<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>松本新村店</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafaf9;
  --card:#ffffff;
  --text:#0f172a;
  --text-sub:#64748b;
  --shadow:0 1px 2px rgba(15,23,42,.03),0 4px 16px rgba(15,23,42,.05);
  --shadow-hover:0 4px 8px rgba(15,23,42,.05),0 16px 36px rgba(15,23,42,.10);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:72px 24px 24px;
  padding-top:max(72px,env(safe-area-inset-top));
  padding-bottom:max(24px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.container{max-width:880px;margin:0 auto;}
.title{
  font-size:36px;
  font-weight:300;
  letter-spacing:-.02em;
  margin-bottom:56px;
  color:var(--text);
}
.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:20px;
}
.tile{
  background:var(--card);
  border-radius:22px;
  padding:32px 22px;
  text-decoration:none;
  color:var(--text);
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease;
  display:flex;flex-direction:column;align-items:flex-start;gap:18px;
  cursor:pointer;
  border:1px solid rgba(15,23,42,.04);
  min-height:140px;
}
.tile:hover,.tile:active{
  transform:translateY(-3px);
  box-shadow:var(--shadow-hover);
}
.icon-wrap{
  width:54px;height:54px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  flex-shrink:0;
}
.tile.ff .icon-wrap{background:linear-gradient(135deg,#fef3c7,#fde68a);}
.tile.ws .icon-wrap{background:linear-gradient(135deg,#dbeafe,#bfdbfe);}
.tile.next .icon-wrap{background:linear-gradient(135deg,#dcfce7,#bbf7d0);}
.name{
  font-size:16px;
  font-weight:600;
  letter-spacing:.01em;
  line-height:1.4;
}
@media (max-width:480px){
  body{padding:48px 18px 18px;}
  .title{font-size:28px;margin-bottom:36px;}
  .tile{padding:24px 18px;min-height:120px;gap:14px;}
  .icon-wrap{width:48px;height:48px;font-size:24px;border-radius:12px;}
  .name{font-size:15px;}
}
</style>
</head>
<body>
<div class="container">
  <h1 class="title">松本新村店</h1>
  <div class="tiles">
    <a class="tile ff" href="./ff/index.html">
      <div class="icon-wrap">🍗</div>
      <div class="name">FF管理</div>
    </a>
    <a class="tile ws" href="./ws/index.html">
      <div class="icon-wrap">📋</div>
      <div class="name">ワークスケジュール</div>
    </a>
    <a class="tile next" href="./next/index.html">
      <div class="icon-wrap">📅</div>
      <div class="name">次週計画</div>
    </a>
  </div>
</div>
<script>
document.querySelectorAll('a.tile').forEach(function(a){
  a.addEventListener('click',function(){
    try{
      sessionStorage.setItem('_fromHub','1');
      sessionStorage.setItem('_hubUrl',location.href);
    }catch(e){}
  });
});
</script>
</body>
</html>
