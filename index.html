<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>松本新村店 経営ハブ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --main:#1e3a5f;--main-dk:#152c47;--main-lt:#dbeafe;
  --accent:#2196f3;--accent-lt:#e3f2fd;
  --bg:#f8fafc;--card:#ffffff;--border:#e5e7eb;
  --text:#1f2937;--text-sub:#6b7280;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --shadow-hover:0 4px 8px rgba(0,0,0,.10),0 12px 28px rgba(0,0,0,.08);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic",sans-serif;
  background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);
  min-height:100vh;
  color:var(--text);
  padding:24px 16px;
  padding-top:max(24px,env(safe-area-inset-top));
  padding-bottom:max(24px,env(safe-area-inset-bottom));
}
.container{max-width:760px;margin:0 auto;}
.header{text-align:center;color:#fff;margin-bottom:32px;}
.header h1{font-size:26px;font-weight:800;letter-spacing:.02em;margin-bottom:6px;}
.header .sub{font-size:13px;opacity:.85;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}
.tile{
  background:var(--card);
  border-radius:18px;
  padding:22px 16px;
  text-align:center;
  text-decoration:none;
  color:var(--text);
  box-shadow:var(--shadow);
  transition:transform .15s ease,box-shadow .15s ease;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  cursor:pointer;
  border:2px solid transparent;
  min-height:160px;
  justify-content:center;
}
.tile:hover,.tile:active{
  transform:translateY(-2px);
  box-shadow:var(--shadow-hover);
  border-color:var(--accent-lt);
}
.tile .icon{font-size:48px;line-height:1;}
.tile .name{font-size:15px;font-weight:700;line-height:1.4;}
.tile .desc{font-size:11px;color:var(--text-sub);line-height:1.5;}
.footer{
  margin-top:36px;text-align:center;
  color:rgba(255,255,255,.65);font-size:11px;line-height:1.7;
}
@media (max-width:480px){
  .header h1{font-size:22px;}
  .tile{padding:18px 12px;min-height:140px;}
  .tile .icon{font-size:40px;}
  .tile .name{font-size:14px;}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📊 松本新村店 経営ハブ</h1>
    <div class="sub">使いたいシステムを選んでください</div>
  </div>

  <div class="tiles">
    <a class="tile" href="./ff/">
      <div class="icon">🍗</div>
      <div class="name">FF管理システム</div>
      <div class="desc">作成計画・在庫・予算</div>
    </a>
    <a class="tile" href="./ws/">
      <div class="icon">📋</div>
      <div class="name">ワークスケジュール</div>
      <div class="desc">業務タスク・人員配置</div>
    </a>
    <a class="tile" href="./next/">
      <div class="icon">📅</div>
      <div class="name">次週計画</div>
      <div class="desc">来週の売上・施策計画</div>
    </a>
  </div>

  <div class="footer">
    新システム追加：<code>{name}/index.html</code> を置いて、このページにタイル1行追加するだけ
  </div>
</div>
<script>
// 各タイルにクリックハンドラを追加：sessionStorageにハブURLを記憶
// （遷移先システムの「← ハブ」ボタンが正しい戻り先を持てる）
document.querySelectorAll('a.tile').forEach(function(a){
  a.addEventListener('click',function(){
    try{
      sessionStorage.setItem('_fromHub','1');
      sessionStorage.setItem('_hubUrl',location.href);
    }catch(e){}
  });
});
</script>
</body>
</html>
