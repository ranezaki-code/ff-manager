<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI経営チーム 組織図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6efe2; --grid:#ecdfc9; --card:#fffaf0; --ink:#4a3a2a; --sub:#9a8a74; --line:#e3d3b8; --edge:#d9c4a0;
  --chip:#f3e9d6; --work:#2f9e5b; --work-bg:#e9f7e6; --warn:#c2620a; --bar:#efe3cd;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"DotGothic16","MS Gothic","Yu Gothic UI",monospace;font-size:14px;line-height:1.5;
  background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.5px,transparent 1.5px);background-size:16px 16px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:18px;margin:0;flex:1;min-width:200px;font-weight:400}
h1 .chip{vertical-align:middle;margin-left:4px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.dot{width:10px;height:10px;background:var(--sub)}
.live.on .dot{background:var(--work);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hide{display:none!important}
.chip{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--chip);white-space:nowrap}
.chip.lv{color:var(--c)}
.chip.gray{background:var(--chip);color:var(--sub)}
.chip.store{background:#8a6a45;color:#fffaf0}
.chip.new{background:#f6c8b8;color:#a23a17}
.chip.ask{background:#e2ecff;color:#1d4ed8}
.chip.due{background:#f3e9d6;color:#7a6850}
.chip.due.late{background:#f6c8b8;color:#a23a17}
.chip.due.today{background:#fbe7b0;color:#9a6a00}
.empty{color:var(--sub);padding:14px 0;text-align:center}

/* タブ */
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:4px solid var(--line)}
.tabs button{font:inherit;font-size:15px;padding:10px 16px;border:2px solid var(--line);border-bottom:0;background:var(--chip);color:var(--sub);border-radius:6px 6px 0 0;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:-4px}
.tabs button.on{background:var(--card);color:var(--ink);border-color:var(--edge);border-bottom:4px solid var(--card)}

/* オフィス */
.today{background:var(--card);border:2px solid var(--line);border-radius:4px;padding:8px 12px;margin:0 0 12px;font-size:13px;display:flex;gap:6px 18px;flex-wrap:wrap}
.today b{font-weight:400;color:var(--work);margin-right:8px}
.today span{color:var(--sub)}
.offwrap{overflow-x:auto;border:4px solid #3d4248;border-radius:6px;box-shadow:4px 4px 0 #b9bdc3;background:#f4f4f2}
.office{position:relative;width:100%;min-width:620px;aspect-ratio:2/1;overflow:hidden}
.office>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx{position:absolute;transform:translate(-50%,0)}
.counter{width:27%;height:10%;background:#f1f2f3;border:2px solid #3d4248;border-radius:4px;box-shadow:0 5px 0 #3d4248,0 9px 0 rgba(30,34,40,.13)}
.counter::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:#3a3f45}
.counter .reg{position:absolute;left:44%;bottom:62%;width:11%;height:70%;background:#3a3f45;border:2px solid #22262a;border-radius:2px}
.counter .reg i{position:absolute;left:14%;right:14%;top:12%;height:40%;background:#6f7a83;display:block}
.counter.on .reg i{background:#9af0c0;animation:glow .9s steps(2) infinite}
.counter .hot{position:absolute;left:6%;bottom:62%;width:26%;height:95%;background:rgba(245,246,247,.9);border:2px solid #3d4248;border-radius:3px}
.counter .hot::before{content:"";position:absolute;left:10%;right:10%;top:22%;height:16%;background:#8d9299;box-shadow:0 180% 0 #b9bdc3,0 360% 0 #6f757d}
.counter .cof{position:absolute;right:7%;bottom:62%;width:12%;height:85%;background:#4b5057;border:2px solid #22262a;border-radius:2px}
.counter .cof::after{content:"";position:absolute;left:28%;top:18%;width:44%;height:22%;background:#c9ccd1}
.desk{width:11%;height:8.5%;background:linear-gradient(#eceded 0 38%,#c9ccd1 38%);border:2px solid #3d4248;border-radius:4px;box-shadow:0 4px 0 #3d4248,0 8px 0 rgba(30,34,40,.13)}
.desk::after{content:"";position:absolute;left:48%;top:10%;width:36%;height:20%;background:#fbfbfa;border:1px solid #3d4248;border-radius:1px}
.desk[data-desk="owner"] .mon{background:#aeb6bf;animation:glow 1.6s steps(2) infinite}
.ch .say.kata{border:0;background:transparent;box-shadow:none;font-size:10px;padding:0;color:#8d9299;letter-spacing:1px}
.desk::before{content:"";position:absolute;right:8%;bottom:14%;width:16%;height:30%;background:var(--c);border:1px solid #3d4248;border-radius:1px}
.desk .mon{position:absolute;left:10%;bottom:66%;width:28%;height:86%;background:#3a3f45;border:2px solid #22262a;border-radius:2px}
.desk .mon::after{content:"";position:absolute;left:38%;top:100%;width:24%;height:22%;background:#22262a}
.desk.on .mon{background:var(--c);animation:glow .9s steps(2) infinite}
@keyframes glow{50%{filter:brightness(1.35)}}
.plate{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:7px;font-size:11px;color:#7d848c;white-space:nowrap}
.ch{position:absolute;width:clamp(40px,6.8%,72px);transform:translate(-50%,-100%);transition-property:left,top;transition-timing-function:linear;transition-duration:0s}
.ch::before{content:"";position:absolute;left:14%;right:14%;bottom:-3%;height:10%;background:rgba(60,45,25,.22);border-radius:50%}
.ch svg{position:relative;display:block;width:100%;height:auto}
.ch.flip svg{transform:scaleX(-1)}
.ch.walk svg{animation:step .36s steps(2) infinite}
.ch.flip.walk svg{animation:stepf .36s steps(2) infinite}
.ch.work svg{animation:typing 1.1s steps(2) infinite}
.ch.train svg{animation:step .5s steps(2) infinite}
.ch.flip.train svg{animation:stepf .5s steps(2) infinite}
@keyframes step{50%{transform:translateY(-2px)}}
@keyframes stepf{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-2px)}}
@keyframes typing{50%{transform:translateY(-1px)}}
.eye{animation:wink 5s steps(1) infinite}
@keyframes wink{0%,95%{opacity:1}96%,100%{opacity:0}}
.ch .tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:1px;font-size:11px;line-height:1.25;white-space:nowrap;background:rgba(255,253,248,.92);padding:0 5px;border-radius:8px;color:var(--c);border:1px solid var(--c)}
.ch .say{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;font-size:11px;line-height:1.35;background:#fff;border:2px solid var(--c);border-radius:8px;padding:2px 8px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--ink);box-shadow:0 2px 0 rgba(60,45,25,.15)}
.ch .say:empty{display:none}
.ch .say.lv1{margin-bottom:28px}
.ch .say.lv2{margin-bottom:50px}
.ch .say.lv1::after,.ch .say.lv2::after{content:"";position:absolute;left:50%;top:100%;width:0;border-left:2px dotted var(--c)}
.ch .say.lv1::after{height:22px}
.ch .say.lv2::after{height:44px}
.ch .say.lv1,.ch .say.lv2{overflow:visible}
.ch.busy svg{animation:typing .7s steps(2) infinite}
.ch .say.emo{border:0;background:transparent;box-shadow:none;font-size:16px;padding:0;font-family:"Segoe UI Emoji","Apple Color Emoji",sans-serif}
.paper{position:absolute;transform:translate(-50%,-100%);font-size:clamp(14px,2.2vw,22px);transition:left 1.2s ease-in-out,top 1.2s ease-in-out;z-index:200;font-family:"Segoe UI Emoji",sans-serif}
.pop{position:absolute;transform:translate(-50%,-100%);font-size:12px;color:var(--work);background:var(--work-bg);border:2px solid var(--work);border-radius:8px;padding:1px 8px;white-space:nowrap;z-index:210;animation:rise 2.6s ease-out forwards}
@keyframes rise{0%{opacity:0;margin-top:0}15%{opacity:1}80%{opacity:1}100%{opacity:0;margin-top:-28px}}

/* メンバー一覧（1行ずつ） */
.roster{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:8px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:4px;padding:6px 10px}
.rrow.working{border-color:var(--c);background:var(--work-bg)}
.roster{align-items:start}
.rrow{cursor:pointer}
.rrow.sel{box-shadow:0 0 0 3px var(--c)}
.ch[data-ch]{cursor:pointer}
#rdetail{margin-top:10px;min-height:44px}
.rtip{font-size:12px;color:var(--sub);padding:10px 12px;border:2px dashed var(--line);border-radius:4px}
.rdesc{background:var(--card);border:2px solid var(--c);border-radius:4px;font-size:13px;line-height:1.7}
.rdh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2px solid var(--line)}
.rdb{padding:10px 14px 12px}
.rdesc ul{margin:2px 0 0;padding-left:18px}
.rmk{font-size:11px;color:var(--sub);margin-top:8px}
.rclose{margin-left:auto;font:inherit;font-size:12px;border:0;background:var(--chip);color:var(--sub);border-radius:4px;padding:5px 10px;cursor:pointer}
.flow{background:var(--card);border:2px solid var(--line);border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.7}
.fchain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.fnode{border:2px solid var(--edge);border-radius:6px;padding:4px 10px;background:#fff;text-align:center;line-height:1.3}
.fnode b{display:block;font-weight:400;font-size:14px}
.fnode span{font-size:11px;color:var(--sub)}
.farrow{color:var(--sub)}
.flow ol{margin:4px 0 0;padding-left:22px}
.flow h3{font-size:13px;font-weight:400;color:var(--sub);margin:10px 0 2px}
.rbot{width:30px;flex:none}
.rbot svg{display:block;width:100%;height:auto}
.rmain{flex:1;min-width:0}
.rline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nick{font-size:16px;color:var(--c)}
.rrole{font-size:12px;color:var(--sub)}
.rsub{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow.working .rsub{color:var(--ink)}
.xp{display:flex;gap:2px;margin-left:auto}
.xp i{width:8px;height:8px;background:var(--bar);display:block}
.xp i.on{background:var(--c)}
.rst{font-size:12px;color:var(--sub);flex:none;text-align:right}
.rrow.working .rst{color:var(--work)}
.stale{color:var(--warn);font-size:11px}

/* たたむ欄 */
/* 絞り込み・列をそろえた一覧（やること・提出物） */
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fpill{font:inherit;font-size:14px;padding:8px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.fpill span{font-size:12px;color:var(--sub);margin-left:2px}
.fpill.on{background:var(--sc,#4a3a2a);border-color:var(--sc,#4a3a2a);color:#fff}
.fpill.on span{color:#fff}
.schip{display:inline-block;font-size:11px;line-height:1.5;padding:0 6px;border-radius:4px;color:#fff;background:var(--sc);white-space:nowrap;min-width:38px;text-align:center}
.lsec{display:flex;align-items:center;gap:8px;font-size:16px;margin:18px 0 8px}
.lsec .cnt{font-size:12px;color:var(--sub)}
.lno{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#8a6a45;color:#fff;align-items:center;justify-content:center;font-size:13px;flex:none}
.lbox{background:var(--card);border:2px solid var(--line);border-radius:4px;box-shadow:4px 4px 0 var(--edge);padding:0 12px}
.lrow{display:grid;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;color:inherit;text-decoration:none}
.lbox>.lrow:last-child{border-bottom:0}
.trow2{grid-template-columns:28px 92px 46px minmax(0,1fr) 52px}
.frow2{grid-template-columns:40px 56px 46px minmax(0,1fr) 40px 44px}
.lhead{font-size:11px;color:var(--sub);padding:6px 0;border-bottom:2px solid var(--line)}
.c-date{color:var(--sub)}
.c-who{font-size:12px;color:var(--c);border:2px solid var(--c);border-radius:4px;text-align:center;line-height:1.5;white-space:nowrap;overflow:hidden}
.c-title{min-width:0;overflow-wrap:anywhere}
.c-kind{font-size:12px;color:var(--sub);white-space:nowrap}
.c-due{font-size:12px;padding:1px 6px;border-radius:4px;background:#f3e9d6;color:#7a6850;text-align:center;white-space:nowrap}
.c-due.late{background:#f6c8b8;color:#a23a17}
.c-due.today{background:#fbe7b0;color:#9a6a00}
.c-due.none{background:transparent;color:var(--sub)}
.tlink{font:inherit;font-size:14px;text-align:left;background:none;border:0;padding:0;color:inherit;cursor:pointer}
.tlink i{font-style:normal;font-size:10px;color:var(--sub)}
.trow2.done .tlink{color:var(--sub);text-decoration:line-through}
.trow2.done .tkb{background:var(--work-bg);border-color:var(--work)}
.trow2.open{border-bottom:0}
.tmore{margin:0 0 8px 38px;padding:8px 12px;background:#fff;border:1px dashed var(--line);border-radius:4px;font-size:13px;line-height:1.7;color:var(--ink)}
.tmore a{color:#2f6fb5}
.frow2:hover .c-title{text-decoration:underline}
.frow2:not(.unread) .c-title{color:var(--sub)}
/* 組織の流れ */
.fstages{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.fstage{flex:1 1 150px;border:2px solid var(--line);border-radius:6px;background:#fff;padding:8px}
.fst{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:6px}
.fwho{display:grid;grid-template-columns:22px auto;column-gap:6px;align-items:center;padding:3px 0;font-size:12px;line-height:1.3}
.fwho .fbot{grid-row:span 2;width:22px}
.fwho .fbot svg{display:block;width:100%;height:auto}
.fwho b{font-weight:400;font-size:14px;color:var(--c)}
.fwho span:last-child{color:var(--sub)}
.farr{align-self:center;color:var(--sub);font-size:12px}
.fweek{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin-top:12px}
.fweek div{background:var(--chip);border-radius:6px;padding:6px 10px;font-size:12px;line-height:1.5}
.fweek b{display:block;font-weight:400;font-size:13px;color:var(--work)}
.fnote{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.8}
@media (max-width:600px){ .trow2{grid-template-columns:28px 76px 42px minmax(0,1fr)} .trow2 .c-kind{display:none} .frow2{grid-template-columns:36px 50px 42px minmax(0,1fr) 40px} .frow2 .c-kind{display:none} .farr{display:none} }
/* 入れる場所 */
.ib-top{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.7}
.ib-msg{color:#a23a17;margin-top:4px}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;align-items:start}
.ibox{background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:4px;box-shadow:4px 4px 0 var(--edge);padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.ib-what{font-size:17px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ib-when{font-size:11px;color:var(--sub);background:var(--chip);border-radius:4px;padding:1px 8px;margin-left:auto;white-space:nowrap}
.ib-ex{font-size:12px;color:var(--sub);line-height:1.5}
.ib-where,.ib-then{font-size:13px;line-height:1.6;padding-top:6px;border-top:1px dashed var(--line)}
.ib-where b{font-weight:400;font-size:15px;color:var(--ink);display:block}
.ib-lbl{display:block;font-size:11px;color:var(--sub)}
.ib-sub{display:block;font-size:12px;color:var(--sub)}
.ib-then .fbot{display:inline-block;width:20px;vertical-align:middle;margin-right:6px}
.ib-then .fbot svg{display:block;width:100%;height:auto}
.ib-foot{display:flex;align-items:center;gap:8px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.ib-foot .ib-sub{display:inline}
.ib-ok{color:var(--work)}
.ib-none{color:#a23a17;background:#f6c8b8;border-radius:4px;padding:1px 8px}
.ib-open{margin-left:auto;font:inherit;font-size:13px;padding:8px 12px;border:2px solid var(--edge);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer}
.fold{margin-top:16px}
.fold>summary{cursor:pointer;font-size:14px;padding:10px 12px;background:var(--card);border:2px solid var(--line);border-radius:4px;list-style:none;display:flex;align-items:center;gap:8px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▶";font-size:11px;color:var(--sub)}
.fold[open]>summary::before{content:"▼"}
.fold[open]>summary{margin-bottom:10px}
.log{background:var(--card);border:2px solid var(--line);border-radius:4px;box-shadow:4px 4px 0 var(--edge);padding:4px 12px;max-height:320px;overflow:auto}
.li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.li time{color:var(--sub);flex:none;width:44px}
.li>div{min-width:0;overflow-wrap:anywhere}

/* 店舗ごとの箱（やること・提出物） */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;align-items:start}
.sbox{background:var(--card);border:2px solid var(--line);border-top:8px solid var(--sc);border-radius:4px;box-shadow:4px 4px 0 var(--edge);padding:4px 12px 6px}
.shd{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px solid var(--line);font-size:15px}
.shd .cnt{margin-left:auto;font-size:12px;color:var(--sub)}
.tk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.tk:last-child{border-bottom:0}
.tkb{flex:none;width:28px;height:28px;border:2px solid var(--edge);background:#fff;border-radius:4px;cursor:pointer;font:inherit;font-size:16px;line-height:1;color:var(--work);padding:0}
.tk.done .tkb{background:var(--work-bg);border-color:var(--work)}
.tk.done .tkt{color:var(--sub);text-decoration:line-through}
.tkm{flex:1;min-width:0;overflow-wrap:anywhere}
.tkd{font-size:12px;color:var(--sub);margin-top:2px}
.tkd a{color:inherit}
.tkmore{width:100%;padding:8px;border:0;background:transparent;color:var(--sub);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.frow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;color:inherit;text-decoration:none}
.frow:last-of-type{border-bottom:0}
.frow:hover .ftitle{text-decoration:underline}
.frow time{color:var(--sub);flex:none;width:36px}
.ftitle{flex:1;min-width:0;overflow-wrap:anywhere}
.frow:not(.unread) .ftitle{color:var(--sub)}
.who{font-size:11px;padding:1px 6px;border-radius:4px;border:2px solid var(--c);color:var(--c);white-space:nowrap;flex:none}
@media (max-width:600px){ .tabs button{padding:9px 10px;font-size:14px} .desk .plate{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI経営チーム <span id="stores"></span></h1>
    <div class="live" id="live"><span class="dot"></span><span id="live-txt">接続待ち</span></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="office">🏢 オフィス</button>
    <button data-tab="tasks">📌 やること <span id="tk-cnt"></span></button>
    <button data-tab="files">📄 提出物 <span id="files-cnt"></span></button>
    <button data-tab="inbox">📥 入れる場所</button>
  </nav>

  <section id="tab-office">
    <div class="today" id="week"></div>
    <div class="offwrap"><div class="office" id="office"></div></div>
    <div class="roster" id="roster"></div>
    <div id="rdetail"></div>
    <details class="fold" id="fold-flow"><summary>この組織の流れ</summary>
      <div class="flow" id="flow"></div>
    </details>
    <details class="fold" id="fold-log"><summary>やりとりの記録</summary><div class="log" id="log"></div></details>
  </section>

  <section id="tab-tasks" class="hide">
    <div id="tasks"></div>
  </section>

  <section id="tab-inbox" class="hide">
    <div id="inbox"></div>
  </section>

  <section id="tab-files" class="hide">

function place(c, x, y){ c.x = x; c.y = y; c.el.style.left = x + '%'; c.el.style.top = y + '%'; c.el.style.zIndex = Math.round(y); }

function routeTo(c, t){

  if (cp === cq){ pts.push({ x: c.x, y: cp }, { x: t.x, y: cp }); }
  else {
    var ax = Math.abs(AISLES[0] - c.x) < Math.abs(AISLES[1] - c.x) ? AISLES[0] : AISLES[1];
    pts.push({ x: c.x, y: cp }, { x: ax, y: cp }, { x: ax, y: cq }, { x: t.x, y: cq });
  }
  pts.push({ x: t.x, y: t.y });
  return pts.filter(function(p, i){ var q = i ? pts[i-1] : c; return Math.abs(p.x - q.x) > 0.3 || Math.abs(p.y - q.y) > 0.3; });
}
function walkTo(c, target, done){
  var id = ++c.moveId, pts = routeTo(c, target);
  c.say.textContent = ''; c.say.className = 'say'; c.el.classList.remove('train');
  (function next(){
    if (id !== c.moveId) return;
    var p = pts.shift();
    if (!p){ c.el.classList.remove('walk'); c.el.style.transitionDuration = '0s'; if (done) done(); return; }
    var dx = (p.x - c.x) * 2, dy = p.y - c.y, sec = Math.max(0.15, Math.sqrt(dx*dx + dy*dy) / 13);   // 速さ一定
    if (Math.abs(dx) > 0.6) c.el.classList.toggle('flip', dx < 0);
    c.el.classList.add('walk');
    c.el.style.transitionDuration = sec + 's';
    place(c, p.x, p.y);

}
function freeSpot(c){

}
function goIdle(c, id){
  var open = [];

  if (!open.length) return;
  var i = open[Math.floor(Math.random() * open.length)], p = SPOTS[i];
  freeSpot(c); p.by = id; c.spot = i;
  walkTo(c, p, function(){
    var cls = p.train ? 'say kata' : 'say emo';
    if (p.train && c.spot === i) c.el.classList.add('train');   // トレーニング中は小さく体を動かす
    if (p.emo){ c.say.className = cls; c.say.textContent = p.emo; setTimeout(function(){ if (c.say.className === cls) c.say.textContent = ''; }, 3500); }
    c.nextAct = Date.now() + 5000 + Math.random() * 6000;

  var sig = [TEAM.owner.sprite, TEAM.boss.sprite, TEAM.boss.color].concat(TEAM.members.map(function(m){ return m.id+m.sprite+m.color+m.nick; })).join('|');

  var list = [{ id: 'owner', m: TEAM.owner, s: {} }, { id: 'boss', m: TEAM.boss, s: boss, crown: true }];
  TEAM.members.forEach(function(m){ list.push({ id: m.id, m: m, s: agents[m.id] || {} }); });

  }
}

// 待機中は、たまに1人ずつ別の場所へ歩く（全員が同時には動かない）

    else if (l.type === 'reply') t = esc(bn)+' → '+esc(memberName('owner'))+'　報告しました';
    else return;
    h += '<div class="li"><time>'+hm(l.t)+'</time><div>'+t+'</div></div>';
  });
  document.getElementById('log').innerHTML = h || '<div class="empty">まだ記録がありません。</div>';

  // 施策資料（店長が毎月保存するPDF）が足りない時だけ、やることに自動で出す
  var today2 = new Date(); PLAN_TASKS = [];
  (st.plans || []).forEach(function(p, i){
    var m = Number(String(p.month).split('-')[1]);
    if (p.n === 0 && (i === 0 || today2.getDate() >= 20)) PLAN_TASKS.push({ id: 'auto-plan-'+p.month, kind: 'do', due: '', store: '2店舗', by: 'チロル', title: m+'月の施策PDFを「施策資料 ＞ '+p.month+'」フォルダに保存する', detail: '入れると、ミルがカレンダーに載せ、ポップが POP を作れる。' });
  });

  renderFiles(st.files || []);
  renderInbox();

  document.getElementById('live').className = 'live' + (anyWork ? ' on' : '');
  document.getElementById('live-txt').textContent = !STATE ? '接続待ち' : (anyWork ? '稼働中' : '全員待機中') + '・最終更新 ' + hm(st.updatedAt || Date.now());
}

// ================= 店舗の絞り込み（やること・提出物で共通） =================
var FILTER = '';
try { FILTER = localStorage.getItem('ai_team_filter') || ''; } catch (e) {}
function filterBar(counts){
  var opts = [{ key: '', name: 'ぜんぶ' }].concat(STORES), h = '';
  opts.forEach(function(s){
    var n = s.key ? (counts[s.key] || 0) : (counts['新村'] || 0) + (counts['大町'] || 0) + (counts['共通'] || 0);
    h += '<button class="fpill'+(FILTER === s.key ? ' on' : '')+'" data-filter="'+esc(s.key)+'"'+(s.color ? ' style="--sc:'+s.color+'"' : '')+'>'+esc(s.key ? s.name : 'ぜんぶ')+' <span>'+n+'</span></button>';
  });
  return h;
}
function storeChip(key){
  var s = STORES.filter(function(x){ return x.key === key; })[0] || STORES[2];
  return '<span class="schip" style="--sc:'+s.color+'">'+esc(key === '共通' ? '共通' : key)+'</span>';
}

// ================= 提出物（1本の一覧。列をそろえる） =================
// ファイル名の決まり：<日付>_<担当名>_<店舗>_<件名>.<拡張子>
var FILE_ALL = false, FILE_READ = {}, FILE_MAX = 12;
try { FILE_READ = JSON.parse(localStorage.getItem('ai_team_files_read') || '{}'); } catch (e) { FILE_READ = {}; }
function markRead(name){
  FILE_READ[name] = 1;
  try { localStorage.setItem('ai_team_files_read', JSON.stringify(FILE_READ)); } catch (e) {}
  lastSig = '';
}
function parseFile(f){
  var base = String(f.name).replace(/\.[A-Za-z0-9]+$/, ''), ext = (String(f.name).match(/\.([A-Za-z0-9]+)$/) || [,''])[1].toLowerCase();
  var p = base.split('_');
  var o = { name: f.name, t: f.t, ext: ext, date: p[0] || '', nick: p[1] || '', store: p[2] || '', title: p.slice(3).join(' ') || base };
  if (p.length < 4){ o.nick = ''; o.store = ''; o.title = base; }
  o.sk = storeKey(o.store);
  return o;
}
function renderFiles(files){
  var list = files.map(parseFile), counts = {};
  list.forEach(function(f){ counts[f.sk] = (counts[f.sk] || 0) + 1; });
  var mine = list.filter(function(f){ return !FILTER || f.sk === FILTER; });
  var show = FILE_ALL ? mine : mine.slice(0, FILE_MAX), rows = '';
  show.forEach(function(f){
    var d = new Date(f.t), kind = f.ext === 'html' ? '資料' : (f.ext === 'md' ? '報告' : f.ext), m = memberByNick(f.nick), unread = !FILE_READ[f.name];
    rows += '<a class="lrow frow2'+(unread?' unread':'')+'" href="'+(f.ext === 'md' ? 'view.html?f=' : '../提出物/')+encodeURIComponent(f.name)+'" target="_blank" rel="noopener" data-file="'+esc(f.name)+'">'+
      '<span class="c-date">'+(d.getMonth()+1)+'/'+d.getDate()+'</span>'+
      '<span class="c-who" style="--c:'+esc(m ? m.color : '#9a8a74')+'">'+esc(f.nick || '—')+'</span>'+
      '<span>'+storeChip(f.sk)+'</span>'+
      '<span class="c-title">'+esc(f.title)+'</span>'+
      '<span class="c-kind">'+esc(kind)+'</span>'+
      '<span class="c-new">'+(unread ? '<span class="chip new">未読</span>' : '')+'</span></a>';
  });
  var h = '<div class="fbar">'+filterBar(counts)+'</div>'+
    '<div class="lbox"><div class="lrow frow2 lhead"><span>日付</span><span>だれが</span><span>店舗</span><span>件名（押すと開く）</span><span>種類</span><span></span></div>'+
    (rows || '<div class="empty">まだありません</div>')+
    (mine.length > FILE_MAX ? '<button class="tkmore" data-fileall="1">'+(FILE_ALL ? '▲ たたむ' : '▼ 残り '+(mine.length-FILE_MAX)+' 件を表示')+'</button>' : '')+'</div>';
  document.getElementById('files').innerHTML = h;
  var unreadAll = list.filter(function(f){ return !FILE_READ[f.name]; }).length;
  document.getElementById('files-cnt').innerHTML = unreadAll ? '<span class="chip new">未読 '+unreadAll+'</span>' : '';
}

// ================= 📌 やること（やること／返事 の2つに分け、列をそろえる） =================
// tasks.js＝チロルが管理する一覧、tasks_auto.js＝ミルの週次リサーチから自動で入る確認依頼、tasks_done.js＝チェックの記録
var TK_DONE = {}, TK_SHOWDONE = false, TK_SIG = '', TK_LOCAL = false, PLAN_TASKS = [], TK_OPEN = '';
try { TK_DONE = JSON.parse(localStorage.getItem('ai_team_tasks_done') || '{}'); } catch (e) { TK_DONE = {}; }
function tkItems(){
  var a = ((window.__AI_TASKS || {}).items || []).slice();
  ((window.__AI_TASKS_AUTO || {}).items || []).forEach(function(x){ a.push(x); });
  ((window.__AI_TASKS_TEIAN || {}).items || []).forEach(function(x){ a.push(x); });
  PLAN_TASKS.forEach(function(x){ a.push(x); });
  return a;
}
function tkDue(due){
  if (!due) return '<span class="c-due none">いつでも</span>';
  var p = String(due).split('-'), d = new Date(+p[0], +p[1]-1, +p[2]), t = new Date(); t.setHours(0,0,0,0);
  var diff = Math.round((d - t) / 86400000), wd = ['日','月','火','水','木','金','土'][d.getDay()];
  if (diff < 0) return '<span class="c-due late">期限すぎ</span>';
  if (diff === 0) return '<span class="c-due today">今日まで</span>';
  return '<span class="c-due">'+(d.getMonth()+1)+'/'+d.getDate()+'（'+wd+'）</span>';
}
// 一覧には短い件名だけ出す（short が無ければ、最初の区切りまで）。全文は押すと出る
function tkShort(x){ return x.short || cut(String(x.title || '').split(/[：:。]/)[0], 30); }
function tkRow(x){
  var done = !!TK_DONE[x.id], open = TK_OPEN === x.id, full = x.short || tkShort(x) !== x.title ? x.title : '';
  var more = (full ? '<div>'+esc(full)+'</div>' : '') + (x.detail ? '<div>'+esc(x.detail)+'</div>' : '') +
    (x.link ? '<div><a href="'+(/\.md$/.test(x.link)?'view.html?f=':'../提出物/')+encodeURIComponent(x.link)+'" target="_blank" rel="noopener">▶ 資料を開く</a></div>' : '');
  return '<div class="lrow trow2'+(done?' done':'')+(open?' open':'')+'">'+
    '<button class="tkb" data-task="'+esc(x.id)+'" aria-label="'+(done?'済みを取り消す':'済みにする')+'">'+(done?'✔':'')+'</button>'+
    (done ? '<span class="c-due none">済み</span>' : tkDue(x.due))+
    '<span>'+storeChip(storeKey(x.store))+'</span>'+
    '<button class="c-title tlink" data-tkopen="'+esc(x.id)+'">'+esc(tkShort(x))+(more ? ' <i>'+(open?'▲':'▼')+'</i>' : '')+'</button>'+
    '<span class="c-kind">'+esc(x.by || '')+'</span></div>'+
    (open && more ? '<div class="tmore">'+more+'</div>' : '');
}
function renderTasks(){
  var all = tkItems(), counts = {};
  all.forEach(function(x){ if (!TK_DONE[x.id]){ var k = storeKey(x.store); counts[k] = (counts[k] || 0) + 1; } });
  var mine = all.filter(function(x){ return !FILTER || storeKey(x.store) === FILTER; });
  var open = mine.filter(function(x){ return !TK_DONE[x.id]; }), fin = mine.filter(function(x){ return TK_DONE[x.id]; });
  function byDue(a, b){ return String(a.due||'9999').localeCompare(String(b.due||'9999')); }
  var todo = open.filter(function(x){ return x.kind !== 'decide'; }).sort(byDue), dec = open.filter(function(x){ return x.kind === 'decide'; }).sort(byDue);
  var head = '<div class="lrow trow2 lhead"><span></span><span>いつまで</span><span>店舗</span><span>内容（押すとくわしく）</span><span>担当</span></div>';
  var h = '<div class="fbar">'+filterBar(counts)+'</div>';
  h += '<div class="lsec"><span class="lno">1</span>れんさんが やること <span class="cnt">'+todo.length+' 件</span></div><div class="lbox">'+head+(todo.map(tkRow).join('') || '<div class="empty">ありません</div>')+'</div>';
  h += '<div class="lsec"><span class="lno">2</span>チロルに 返事すること <span class="cnt">'+dec.length+' 件　決めたらチロルに伝えて、チェック</span></div><div class="lbox">'+head+(dec.map(tkRow).join('') || '<div class="empty">ありません</div>')+'</div>';
  if (fin.length) h += '<div class="lbox" style="margin-top:14px"><button class="tkmore" data-tkmore="1">'+(TK_SHOWDONE?'▲':'▼')+' 済んだこと '+fin.length+' 件'+(TK_SHOWDONE?'':'（押すと表示。チェックを外すと戻せます）')+'</button>'+(TK_SHOWDONE?fin.map(tkRow).join(''):'')+'</div>';
  if (TK_LOCAL) h += '<div class="tkd">※ チェックをこの端末にだけ保存しました（記録の仕組みに届きませんでした）。</div>';
  document.getElementById('tasks').innerHTML = h;
  var openAll = all.filter(function(x){ return !TK_DONE[x.id]; }).length;
  document.getElementById('tk-cnt').innerHTML = openAll ? '<span class="chip new">'+openAll+'</span>' : '';
}
function tkToggle(id){
  var done = !TK_DONE[id];
  if (done) TK_DONE[id] = new Date().toISOString(); else delete TK_DONE[id];
  try { localStorage.setItem('ai_team_tasks_done', JSON.stringify(TK_DONE)); } catch (e) {}
  renderTasks();
  fetch('/api/task', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, done: done }) })
    .then(function(r){ TK_LOCAL = !r.ok; if (!r.ok) renderTasks(); })
    .catch(function(){ TK_LOCAL = true; renderTasks(); });
}
function pollTasks(){
  var n = 4, fin = function(){
    if (--n) return;
    if (window.__AI_TASKS_DONE && !TK_LOCAL) TK_DONE = JSON.parse(JSON.stringify(window.__AI_TASKS_DONE));
    var sig = JSON.stringify([window.__AI_TASKS, window.__AI_TASKS_AUTO, window.__AI_TASKS_TEIAN, PLAN_TASKS, TK_DONE, new Date().getDate()]);
    if (sig !== TK_SIG){ TK_SIG = sig; try { renderTasks(); } catch (e) {} }
  };
  // tasks_teian.js＝週1回の自主点検で出た「提案」（れんさんが承認するまで、だれも進めない）
  loadScript('tasks.js', fin); loadScript('tasks_auto.js', fin); loadScript('tasks_teian.js', fin); loadScript('tasks_done.js', fin);
}

// ================= この組織の流れ（図） =================
function renderFlow(){
  function who(id, note){
    var m = memberOf(id); if (!m) return '';
    return '<div class="fwho" style="--c:'+esc(m.color||'#9ca3af')+'"><span class="fbot">'+botSvg(m.color, m.sprite || 'ghost', id === 'boss')+'</span><b>'+esc(m.nick||m.name)+'</b><span>'+esc(note)+'</span></div>';
  }
  var stages = [
    { t: '材料を集める', w: who('research', '外で起きること') + who('planner', '店の数字') + who('crew-care', 'クルーの状況') },
    { t: '作戦を立てる', w: who('strategy', '狙い・やること・確かめ方') },
    { t: '点検して決める', w: who('boss', '点検して渡す') + who('owner', '決める') },
    { t: '形にする', w: who('pop', 'お客様向け（POP・売場）') + who('crew-info', 'クルー向け（お知らせ・手順）') + who('system-dev', 'アプリ') },
    { t: '確かめる', w: who('planner', '実績の数字') + who('strategy', '当たり・外れ → 次の作戦へ') }
  ];
  var h = '<div class="fstages">' + stages.map(function(s, i){
    return '<div class="fstage"><div class="fst"><span class="lno">'+(i+1)+'</span>'+esc(s.t)+'</div>'+s.w+'</div>';
  }).join('<div class="farr">▶</div>') + '</div>';
  h += '<div class="fweek"><div><b>日曜</b>ミルが自動で調べる</div><div><b>月曜まで</b>サクが作戦 → チロル点検 → れんさんが決める</div><div><b>火曜</b>新商品・施策スタート。POP を貼る。FF管理で調整を確認</div><div><b>翌週</b>ソロの数字で、サクが検証</div></div>';
  h += '<div class="fnote">📮 現場の課題は、チロルに送る → 課題の一覧に入る → 担当に振り分け → サクがアクションプランに → れんさんが決める → ベルがクルー向けの資料に。<br>📁 施策PDFは「施策資料」、清算書は「数値資料」、クルーのデータは「クルー管理 ＞ データ」、クルーに伝えたいことは「クルー連絡 ＞ 受付」へ。</div>';
  document.getElementById('flow').innerHTML = h;
}

// ================= 📥 入れる場所（れんさんが、何をどこに入れるか） =================
// 一覧は folders.js。各フォルダの件数と最新の日付は、記録の仕組み（hook.ps1）が数えて state に入れる
var INBOX_MSG = '';
function renderInbox(){
  var list = window.__AI_FOLDERS || [], inbox = (STATE || {}).inbox || {}, h = '';
  list.forEach(function(f){
    var m = memberByNick(f.who), st = inbox[f.key], status = '';
    if (f.path){
      if (st && st.n > 0){ var d = new Date(st.last); status = '<span class="ib-ok">'+st.n+' 件 入っている</span><span class="ib-sub">最新 '+(d.getMonth()+1)+'/'+d.getDate()+'</span>'; }
      else status = '<span class="ib-none">まだ空</span>';
    }
    h += '<div class="ibox" style="--c:'+esc(m ? m.color : '#8a6a45')+'">'+
      '<div class="ib-what">'+esc(f.what)+'<span class="ib-when">'+esc(f.when||'')+'</span></div>'+
      '<div class="ib-ex">'+esc(f.ex||'')+'</div>'+
      '<div class="ib-where"><span class="ib-lbl">どこへ</span>'+(f.path ? '<b>'+esc(f.path.replace(/\//g, ' ＞ '))+'</b>' : '<b>'+((f.url || f.links) ? 'Google スプレッドシート' : 'チロルとのチャット')+'</b>')+'<span class="ib-sub">'+esc(f.sub||'')+'</span></div>'+
      '<div class="ib-then"><span class="ib-lbl">入れると</span>'+(m ? '<span class="fbot">'+botSvg(m.color, m.sprite || 'ghost', f.who === TEAM.boss.nick)+'</span>' : '')+esc(f.then||'')+'</div>'+
      (f.path ? '<div class="ib-foot">'+status+'<button class="ib-open" data-open="'+esc(f.key)+'">📂 フォルダを開く</button></div>' : '')+
      (f.url && /^https:\/\/docs\.google\.com\//.test(f.url) ? '<div class="ib-foot"><span class="ib-sub">ここに直接入力</span><button class="ib-open" data-open="'+esc(f.key)+'">📊 シートを開く</button></div>' : '')+
      (f.links && f.links.length ? '<div class="ib-foot" style="flex-wrap:wrap;gap:8px"><span class="ib-sub">ここに直接入力</span>'+f.links.map(function(l){ return '<button class="ib-open" data-open="'+esc(l.key)+'">📊 '+esc(l.label)+'</button>'; }).join('')+'</div>' : '')+
      '</div>';
  });
  document.getElementById('inbox').innerHTML = '<div class="ib-top">フォルダはすべて「マイドライブ ＞ AI経営チーム」の中にあります。入れたら、チロルに「入れた」と一言伝えてください。'+(INBOX_MSG ? '<div class="ib-msg">'+esc(INBOX_MSG)+'</div>' : '')+'</div><div class="igrid">'+h+'</div>';
}
function openFolder(key){
  fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key }) })
    .then(function(r){ INBOX_MSG = r.ok ? '' : '開けませんでした。エクスプローラーで「マイドライブ ＞ AI経営チーム」を開いてください（シートもこの中にあります）。'; renderInbox(); })
    .catch(function(){ INBOX_MSG = 'フォルダを開けませんでした（画面を映す仕組みが止まっています）。'; renderInbox(); });
}

// ================= タブ・操作 =================
var TAB = 'office';
try { TAB = localStorage.getItem('ai_team_tab') || 'office'; } catch (e) {}
function showTab(t){
  if (!document.getElementById('tab-' + t)) t = 'office';
  TAB = t;
  ['office','tasks','files','inbox'].forEach(function(k){ document.getElementById('tab-' + k).classList.toggle('hide', k !== t); });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === t); });
  try { localStorage.setItem('ai_team_tab', t); } catch (e) {}
}
document.addEventListener('click', function(e){
  var c = function(sel){ return e.target.closest ? e.target.closest(sel) : null; }, el;
  if ((el = c('#tabs button'))){ showTab(el.getAttribute('data-tab')); return; }
  if ((el = c('[data-task]'))){ tkToggle(el.getAttribute('data-task')); return; }
  if (c('[data-tkmore]')){ TK_SHOWDONE = !TK_SHOWDONE; renderTasks(); return; }
  if ((el = c('[data-file]'))){ markRead(el.getAttribute('data-file')); return; }
  if ((el = c('[data-open]'))){ openFolder(el.getAttribute('data-open')); return; }
  if (c('[data-fileall]')){ FILE_ALL = !FILE_ALL; lastSig = ''; poll(); return; }
  if ((el = c('[data-filter]'))){ FILTER = el.getAttribute('data-filter'); try { localStorage.setItem('ai_team_filter', FILTER); } catch (x) {} renderTasks(); lastSig = ''; poll(); return; }
  if ((el = c('[data-tkopen]'))){ var tk = el.getAttribute('data-tkopen'); TK_OPEN = TK_OPEN === tk ? '' : tk; renderTasks(); return; }
  if (c('[data-rclose]')){ SEL = ''; selectMember(''); return; }
  if ((el = c('[data-row]'))){ selectMember(el.getAttribute('data-row')); return; }
  if ((el = c('.ch[data-ch]'))){ selectMember(el.getAttribute('data-ch')); }
});
var fl = document.getElementById('fold-log');
try { if (localStorage.getItem('ai_team_fold-log') === '1') fl.open = true; } catch (e) {}
fl.addEventListener('toggle', function(){ try { localStorage.setItem('ai_team_fold-log', fl.open ? '1' : '0'); } catch (e) {} });

var lastSig = '';
function poll(){
  loadScript('state.js', function(ok){
    if (ok && window.__AI_STATE) STATE = window.__AI_STATE;
    // 1分ごとにも描き直す（「動きがありません」の判定は時間で変わるため）
    var sig = JSON.stringify(STATE) + '|' + JSON.stringify(TEAM) + '|' + new Date().getDay() + '|' + Math.floor(Date.now()/60000);
    if (sig !== lastSig){
      lastSig = sig;
      try { render(); }
      catch (e){ document.getElementById('roster').innerHTML = '<div class="empty">表示に失敗しました：'+esc(e.message)+'</div>'; }
    }
  });
}
// 稼働時間だけは毎秒進める（全体は描き直さない）
setInterval(function(){
  var now = Date.now();
  document.querySelectorAll('[data-since]').forEach(function(el){ el.textContent = dur(now - Number(el.getAttribute('data-since'))); });
}, 1000);
showTab(TAB);
setInterval(poll, 1500);
setInterval(pollTasks, 5000);
loadScript('folders.js', function(){ try { renderInbox(); } catch (e) {} });
setInterval(function(){ loadScript('team.js', function(){ TEAM = window.__AI_TEAM || TEAM; }); }, 30000);
loadScript('team.js', function(){ TEAM = window.__AI_TEAM || TEAM; try { render(); renderDetail(); renderFlow(); } catch (e) {} poll(); pollTasks(); });
</script>
