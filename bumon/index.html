<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>担当業務</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--panel:#fff;--text:#0f172a;--sub:#64748b;--faint:#94a3b8;--border:#e2e8f0;
  --accent:#2563eb;--accent-dk:#1d4ed8;--accent-lt:#eff6ff;
  --green:#16a34a;--green-lt:#ecfdf5;--amber:#d97706;--amber-lt:#fffbeb;--red:#dc2626;--red-lt:#fef2f2;
  --purple:#7c3aed;--purple-lt:#f5f3ff;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:60px}
.wrap{max-width:900px;margin:0 auto;padding:14px}
html.embedded-in-hub .wrap{padding:10px 10px 14px}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:700}
html.embedded-in-hub header h1{display:none}
header .spacer{flex:1}
.mgr-toggle{font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--sub)}
.mgr-toggle.on{background:var(--purple-lt);border-color:#ddd6fe;color:var(--purple)}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtab{flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--sub);background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px;cursor:pointer}
.subtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.subtabs.single{display:none}
/* 📌 今やること */
.todo{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.todo-h{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo-h .clear{margin-left:auto;font-size:11px;color:var(--accent);cursor:pointer;background:none;border:none;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{font-size:12px;font-weight:700;border-radius:999px;padding:6px 11px;border:1px solid var(--border);background:#f8fafc;color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.tchip .n{font-size:13px}
.tchip.amber{background:var(--amber-lt);color:var(--amber);border-color:#fde68a}
.tchip.red{background:var(--red-lt);color:var(--red);border-color:#fecaca}
.tchip.blue{background:var(--accent-lt);color:var(--accent-dk);border-color:#bfdbfe}
.tchip.gray{opacity:.75}
.tchip.on{outline:2px solid var(--accent);outline-offset:1px}
.tchip select{font-family:inherit;font-size:12px;border:none;background:transparent;color:inherit;font-weight:700;cursor:pointer}
.todo-ok{font-size:13px;color:var(--green);font-weight:600}
/* 部門ボード */
.group-title{font-size:13px;font-weight:700;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.group-title .g-cond{font-size:11px;font-weight:500;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.04);overflow:hidden}
.area{border-bottom:1px solid var(--border)}
.area:last-child{border-bottom:none}
.area-row{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.area-row:hover{background:#fafbfc}
.area.open .area-row{background:#f8fafc}
.area-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 部門名は固定幅の列にして、担当者の名前が全行で同じ位置から始まるようにそろえる */
.area-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;width:270px;flex-shrink:0}
.info{font-size:11px;color:var(--faint);cursor:help;font-weight:500}
.assignees{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--accent-lt);color:var(--accent-dk);border-radius:999px;padding:3px 9px;font-weight:600;cursor:pointer}
.chip .av{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.unassigned{font-size:12px;color:var(--sub);background:#fff;border:1px dashed #cbd5e1;border-radius:999px;padding:3px 10px;font-weight:600;cursor:pointer}
.unassigned:hover{border-color:var(--accent);color:var(--accent)}
.sum{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex-shrink:0;justify-content:flex-end}
.sc{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.sc.none{color:var(--faint);font-weight:500}
.chev{font-size:11px;color:var(--faint);width:14px;text-align:center}
.area-body{display:none;padding:4px 12px 12px;background:#fbfcfe;border-top:1px dashed var(--border)}
.area.open .area-body{display:block}
.btn{font-family:inherit;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;padding:7px 12px;white-space:nowrap}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-pri{background:var(--accent);color:#fff}.btn-pri:hover{background:var(--accent-dk)}
.btn-ghost{background:#f1f5f9;color:var(--text)}.btn-ghost:hover{background:#e2e8f0}
.btn-green{background:var(--green);color:#fff}.btn-amber{background:var(--amber);color:#fff}.btn-red{background:var(--red);color:#fff}
.btn-line{background:#fff;border:1px solid var(--border);color:var(--sub)}
.btn-line.danger{color:var(--red);border-color:#fecaca}
/* 作戦シート カード */
.sheet{background:#fff;border:1px solid var(--border);border-radius:10px;margin-top:8px;overflow:hidden}
.sheet.hit{outline:2px solid var(--accent);outline-offset:-1px}
.sheet-head{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}
.sheet-title{font-size:14px;font-weight:700;flex:1;min-width:120px}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-draft{background:#f1f5f9;color:var(--sub)}
.b-submitted{background:var(--amber-lt);color:var(--amber)}
.b-returned{background:var(--red-lt);color:var(--red)}
.b-doing{background:var(--accent-lt);color:var(--accent-dk)}
.b-done{background:var(--green-lt);color:var(--green)}
.b-retry{background:var(--purple-lt);color:var(--purple)}
.due-badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:#f1f5f9;color:var(--sub)}
.due-soon{background:var(--amber-lt);color:var(--amber)}
.due-over{background:var(--red-lt);color:var(--red)}
.sheet-meta{font-size:11px;color:var(--faint)}
.sheet-toggle{font-size:12px;color:var(--accent);cursor:pointer;background:none;border:none;font-weight:600;padding:0 12px 6px}
.sheet-body{padding:0 12px 10px;display:none}
.sheet.showbody .sheet-body{display:block}
.step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.step:last-child{border-bottom:none}
.step .n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent-lt);color:var(--accent-dk);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step .n.n4{background:var(--green-lt);color:var(--green)}
.step .s-label{font-size:12px;font-weight:700;color:var(--sub)}
.step .s-val{font-size:13px;white-space:pre-wrap;margin-top:1px}
.step .s-val.empty{color:var(--faint)}
.note{font-size:12px;color:var(--red);background:var(--red-lt);border-radius:8px;padding:6px 10px;margin:0 12px 8px}
.sheet-actions{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px;align-items:center}
.sheet-actions .spacer{flex:1}
.empty-note{color:var(--faint);font-size:13px;text-align:center;padding:16px}
/* 全体管理ダッシュボード */
.mgr-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:6px}
.metric{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 12px;text-align:center}
.metric .mv{font-size:24px;font-weight:700;line-height:1.1}
.metric .ml{font-size:11px;color:var(--sub);margin-top:3px}
.metric.warn .mv{color:var(--red)}.metric.amber .mv{color:var(--amber)}.metric.ok .mv{color:var(--green)}
.mgr-sec{margin:18px 0 7px;font-size:14px;font-weight:700}
.mini-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.mini-row:last-child{border-bottom:none}
.eval-table{width:100%;border-collapse:collapse;font-size:13px}
.eval-table th,.eval-table td{padding:7px 6px;border-bottom:1px solid #f1f5f9;text-align:center;white-space:nowrap}
.eval-table th{color:var(--sub);font-size:12px;font-weight:600}
.eval-table td.name,.eval-table th.name{text-align:left;font-weight:600}
.rate{font-weight:700;color:var(--accent-dk)}
/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:1000;padding:14px;overflow:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:600px;width:100%;margin:auto;padding:18px}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .mhint{font-size:12px;color:var(--sub);margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.field .ex{font-size:11px;color:var(--faint);margin-bottom:5px;line-height:1.5}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:#fff}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.modal-actions .btn{flex:1;min-width:110px;padding:11px}
.close-x{float:right;font-size:22px;background:none;border:none;color:var(--sub);cursor:pointer;line-height:1}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi .opt{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:6px 11px;cursor:pointer;background:#fff;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.multi .opt.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.multi .opt .ok{font-size:10px;font-weight:700;color:var(--green)}
.multi .opt.sel .ok,.multi .opt.sel .ng{color:#fff;opacity:.9}
.multi .opt .ng{font-size:10px;font-weight:700;color:var(--amber)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;z-index:2000;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:560px){
  /* スマホ：1行目＝▶ 部門名 ＋作戦／2行目＝担当／3行目＝作戦の状況 */
  .area-row{flex-wrap:wrap;row-gap:6px}
  .area-main{flex-direction:column;align-items:flex-start;gap:6px;flex-basis:0}
  .area-name{width:auto;min-width:0}
  .area-main .assignees{order:5}
  .area-row>.btn{order:2}
  .sum{order:6;flex-basis:100%;justify-content:flex-start;padding-left:22px}
  .sum:empty{display:none}
  .sheet-head .sheet-title{flex-basis:100%;order:-1}
}
/* ===== 作戦シート 印刷（A4縦・PDF保存用） ===== */
#print-area{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm}
  html,body{background:#fff!important}
  body>*{display:none!important}
  body>#print-area{display:block!important}
  .ps-page{font-size:12px;color:#000;font-family:inherit}
  .ps-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #111;padding-bottom:8px;margin-bottom:12px}
  .ps-kicker{font-size:11px;color:#555;font-weight:700;letter-spacing:1px}
  .ps-title{font-size:21px;font-weight:800;margin-top:3px;line-height:1.3}
  .ps-meta{text-align:right;flex-shrink:0;padding-left:12px}
  .ps-badge{border:1.5px solid #111;border-radius:5px;padding:2px 9px;font-size:11px;font-weight:800}
  .ps-store{font-size:12px;margin-top:5px;font-weight:600}
  .ps-info{width:100%;border-collapse:collapse;margin-bottom:13px;font-size:12px}
  .ps-info th{background:#f2f2f2;border:1px solid #999;padding:5px 8px;text-align:left;width:72px;white-space:nowrap;font-weight:700}
  .ps-info td{border:1px solid #999;padding:5px 8px}
  .ps-box{border:1px solid #333;border-radius:6px;margin-bottom:10px;overflow:hidden;page-break-inside:avoid}
  .ps-box-h{background:#f2f2f2;border-bottom:1px solid #333;padding:6px 10px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
  .ps-n{background:#111;color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .ps-box-b{padding:9px 11px;min-height:58px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .ps-empty{color:#aaa}
  .ps-next{margin-top:9px;padding-top:8px;border-top:1px dashed #bbb;font-size:12px}
  .ps-foot{margin-top:16px;text-align:right;font-size:10px;color:#777}
}
</style>

<script>
/* 入力途中の値を守る共通ガード（全システム共通・同期対象外）
   - 文字を打つたびに sessionStorage へ退避し、画面の作り直し・再描画の後に同じ欄へ戻す（フォーカスも戻す）
   - 欄が確定（change）されたら退避を消す。30分で失効
   → 統合アプリの同期や他タブの保存で画面が描き直されても、入力途中の文字が構造的に消えない */
(function(){
  var KEY='__draft::'+location.pathname, TTL=30*60*1000, drafts={}, lastFocusKey=null, timer=null;
  try{ drafts=JSON.parse(sessionStorage.getItem(KEY)||'{}')||{}; lastFocusKey=sessionStorage.getItem(KEY+'#focus')||null; }catch(e){ drafts={}; }
  function isText(el){ if(!el||!el.tagName)return false; var t=el.tagName; if(t==='TEXTAREA')return true; if(t!=='INPUT')return false; var ty=(el.type||'text').toLowerCase(); return ['text','number','search','tel','url','email','date','time','month'].indexOf(ty)>=0; }
  function keyOf(el){
    if(el.id)return '#'+el.id;
    var a=el.getAttribute('onchange')||el.getAttribute('oninput')||el.getAttribute('onblur'); if(a)return 'h:'+a;
    var ds=(el.dataset&&Object.keys(el.dataset).length)?JSON.stringify(el.dataset):''; if(ds)return 'd:'+ds;
    var anc=el.closest('[id],[data-pid],[data-id],[data-key]'); var base=anc?(anc.id?'#'+anc.id:JSON.stringify(anc.dataset)):'body';
    var list=(anc||document.body).querySelectorAll('input,textarea'); return 'p:'+base+'/'+Array.prototype.indexOf.call(list,el);
  }
  function persist(){ try{ sessionStorage.setItem(KEY,JSON.stringify(drafts)); sessionStorage.setItem(KEY+'#focus',lastFocusKey||''); }catch(e){} }
  function prune(){ var now=Date.now(); Object.keys(drafts).forEach(function(k){ if(now-(drafts[k].t||0)>TTL)delete drafts[k]; }); }
  document.addEventListener('input',function(e){ var el=e.target; if(!isText(el)||el.__draftRestoring)return; var k=keyOf(el); lastFocusKey=k; drafts[k]={v:el.value,t:Date.now()}; persist(); },true);
  document.addEventListener('change',function(e){ var el=e.target; if(!isText(el))return; var k=keyOf(el); if(drafts[k]){ delete drafts[k]; persist(); } },true);
  document.addEventListener('focusin',function(e){ if(isText(e.target))lastFocusKey=keyOf(e.target); },true);
  function restore(){
    timer=null; prune(); var keys=Object.keys(drafts); if(!keys.length)return;
    var els=document.querySelectorAll('input,textarea'), map={}, i;
    for(i=0;i<els.length;i++){ if(isText(els[i]))map[keyOf(els[i])]=els[i]; }
    var refocus=null;
    keys.forEach(function(k){ var el=map[k]; if(!el)return; var d=drafts[k];
      if(el.value!==d.v){ el.__draftRestoring=true; el.value=d.v; try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){} el.__draftRestoring=false; }
      if(k===lastFocusKey)refocus=el; });
    // 描き直しでフォーカスが外れていたら、同じ欄の末尾へ戻す
    if(refocus&&(!document.activeElement||document.activeElement===document.body)){ try{ refocus.focus(); var n=refocus.value.length; if(refocus.setSelectionRange)refocus.setSelectionRange(n,n); }catch(e){} }
  }
  function schedule(){ if(!timer)timer=setTimeout(restore,60); }
  function start(){ try{ new MutationObserver(function(ms){ for(var i=0;i<ms.length;i++){ if(ms[i].addedNodes&&ms[i].addedNodes.length){ schedule(); return; } } }).observe(document.body,{childList:true,subtree:true}); }catch(e){} schedule(); }
  if(document.body)start(); else document.addEventListener('DOMContentLoaded',start);
  window.addEventListener('pagehide',persist);
})();
</script>

<body>
<div class="wrap">
  <header>
    <h1>担当業務</h1>
    <span class="spacer"></span>
    <button class="btn btn-pri btn-sm" id="new-sheet-btn">＋ 作戦シート</button>
    <button class="mgr-toggle" id="mgr-toggle">🔓 全体管理</button>
  </header>

  <div class="subtabs single" id="subtabs">
    <div class="subtab active" data-view="board">🧭 部門ボード</div>
    <div class="subtab" data-view="mgr" id="subtab-mgr">📋 全体管理</div>
  </div>

  <div id="view-board">
    <div class="todo" id="todo-strip"></div>
    <div id="board"></div>
  </div>
  <div id="view-mgr" style="display:none"></div>
</div>

<!-- 担当割当モーダル -->
<div class="overlay" id="assign-overlay">
  <div class="modal">
    <button class="close-x" data-close="assign-overlay">×</button>
    <h2>担当を割り当て</h2>
    <div class="mhint" id="assign-area-name"></div>
    <div class="field">
      <label>担当者 <span style="font-weight:500;color:var(--faint);font-size:11px">タップで選択（複数可）。✓＝条件を満たす／△＝条件未達（割当は可能）</span></label>
      <div class="ex" id="assign-staff-hint"></div>
      <div class="multi" id="assign-staff-multi"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-pri" id="assign-save">保存</button>
      <button class="btn btn-ghost" data-close="assign-overlay">閉じる</button>
    </div>
  </div>
</div>

<!-- 作戦シート編集モーダル -->
<div class="overlay" id="sheet-overlay">
  <div class="modal">
    <button class="close-x" data-close="sheet-overlay">×</button>
    <h2 id="sheet-modal-title">作戦シート</h2>
    <div class="mhint">事実ベースで具体的に。誰が読んでも同じ行動が取れるように書きます。</div>
    <div class="field">
      <label>担当部門</label>
      <select id="s-area"></select>
    </div>
    <div class="field">
      <label>担当者</label>
      <select id="s-assignee"></select>
    </div>
    <div class="field">
      <label>タイトル（一言で）</label>
      <input type="text" id="s-title" placeholder="例：16時のアイス新商品の品切れをなくす">
    </div>
    <div class="field">
      <label>期限（達成・検証する日）</label>
      <div class="ex">いつまでにやり切るかを決めると、PDCAが回りやすくなります。</div>
      <input type="date" id="s-due">
    </div>
    <div class="field">
      <label>① 現状の課題（客観的な事実は何か？）</label>
      <div class="ex">× なんとなく汚い／〇 新商品◯◯の棚が16時のピーク時に毎日空になっている</div>
      <textarea id="s-problem"></textarea>
    </div>
    <div class="field">
      <label>② 目的とゴール（どんな状態にするか？）</label>
      <div class="ex">× 売上を伸ばすため（大きすぎる）／〇 棚の最上段が毎日16時に「新商品で満タン」の状態</div>
      <textarea id="s-goal"></textarea>
    </div>
    <div class="field">
      <label>③ 明日からの仕組み（いつ・どのタイミングで・誰が・何を）</label>
      <div class="ex">〇 毎日15時の検収直後に、必ず◯◯を5個補充するルールにする</div>
      <textarea id="s-mechanism"></textarea>
    </div>
    <div id="result-block" style="display:none">
      <div class="field">
        <label>④ 結果（数値または状態）＋ なぜその結果になったか</label>
        <textarea id="s-result" placeholder="★結果：達成／未達成、数値や状態。なぜそうなったか。"></textarea>
      </div>
      <div class="field">
        <label>次の一手</label>
        <div class="multi" id="s-next-multi">
          <span class="opt" data-next="A">A：今の仕組みを継続・定着（達成）</span>
          <span class="opt" data-next="B">B：仕組みを更新して再挑戦（未達）</span>
        </div>
      </div>
    </div>
    <div class="modal-actions" id="sheet-modal-actions"></div>
  </div>
</div>

<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 担当業務（自走店舗作り）
//   1画面＝部門ボード：部門ごとに「担当」と「作戦シート」をまとめて見る。
//   上の「📌 今やること」で 承認待ち／差し戻し／期限超過 などに一発で絞れる。
// ============================================================
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

// 部門ツリー（PDF「自走店舗作り」より）
const SEED=[
  {group:'売上利益拡大', items:[
    {id:'order_aico',name:'商品発注・AICOカテゴリ',cond:'サブリーダークルー以上／FFファンタジスタ取得済'},
    {id:'order_ff',name:'商品発注・ファストフード',cond:'サブリーダークルー以上／まちかど厨房ファンタジスタ取得済'},
    {id:'order_kitchen',name:'商品発注・店内厨房',cond:'サブリーダークルー以上／マチカフェファンタジスタ取得済'},
    {id:'order_machicafe',name:'商品発注・マチカフェ',cond:''},
    {id:'order_drink',name:'商品発注・種類／飲料／チルド飲料',cond:''},
    {id:'order_processed',name:'商品発注・加工食品',cond:''},
    {id:'order_sweets',name:'商品発注・菓子',cond:''},
    {id:'order_daily',name:'商品発注・日用品／たばこ',cond:''},
  ]},
  {group:'基準の維持', cond:'リーダークルー以上', items:[
    {id:'clean',name:'清掃',cond:'リーダークルー以上／接客ファンタジスタ取得済'},
    {id:'consumable',name:'消耗品',cond:''},
    {id:'training',name:'新人教育',cond:''},
    {id:'three',name:'3つの徹底',cond:''},
  ]},
];
const GROUP_DOT={'売上利益拡大':'#2563eb','基準の維持':'#16a34a','全体管理':'#7c3aed'};
function allAreas(){const a=[];SEED.forEach(g=>g.items.forEach(it=>a.push(Object.assign({group:g.group},it))));return a;}
function areaById(id){return allAreas().find(a=>a.id===id);}

// ---- ストア／保存 ----
function storeId(){return localStorage.getItem('current_store_id')||localStorage.getItem('ffv6_current')||'';}
function dataKey(){const s=storeId();return s?'bumon_v1_store_'+s:'bumon_v1';}
let S={assignments:{},sheets:[]};
function loadS(){
  const raw=localStorage.getItem(dataKey());
  try{if(raw)S=JSON.parse(raw);}catch(e){console.error(e);try{localStorage.setItem(dataKey()+'_corrupt_backup_'+Date.now(),raw);}catch(_){}}   // 壊れた保存は退避して上書きしない
  if(!S.assignments)S.assignments={};
  if(!Array.isArray(S.sheets))S.sheets=[];
}
function saveS(){
  try{localStorage.setItem(dataKey(),JSON.stringify(S));}catch(e){console.error(e);alert('保存に失敗しました: '+e);}
}
// クルー（クルータブの登録）— 名前とランク・ファンタジスタ。無ければWSの従業員
function crewData(){
  const s=storeId();
  try{const raw=localStorage.getItem(s?'crew_v1_store_'+s:'crew_v1');if(raw){const c=JSON.parse(raw);if(Array.isArray(c.members)&&c.members.length)return {members:c.members,ranks:c.ranks||{}};}}catch(e){}
  return null;
}
function wsStaff(){
  const s=storeId();const key=s?'ws_v1_store_'+s:'ws_v1';
  try{const raw=localStorage.getItem(key);if(raw){const st=JSON.parse(raw);if(Array.isArray(st.staff))return st.staff.slice();}}catch(e){}
  return [];
}
// 担当候補：クルー登録があればクルー、無ければWS従業員。過去に割り当てた名前も落とさない
function candidateNames(){
  const set=new Set();
  const cd=crewData(); if(cd)cd.members.forEach(m=>set.add(m.name)); else wsStaff().forEach(n=>set.add(n));
  Object.values(S.assignments).forEach(arr=>(arr||[]).forEach(n=>set.add(n)));
  S.sheets.forEach(sh=>{if(sh.assignee)set.add(sh.assignee);});
  return Array.from(set).filter(Boolean);
}
// 担当条件（例「サブリーダークルー以上／FFファンタジスタ取得済」）をクルーのランク・ファンタジスタで判定
const RANK_ORDER={rookie:0,regular:1,subleader:2,leader:3};
const RANK_JA={'ルーキー':'rookie','レギュラー':'regular','サブリーダー':'subleader','リーダー':'leader'};
const FANTA_JA=[['FF','ff'],['接客','sekkyaku'],['Machi Cafe','machicafe'],['マチカフェ','machicafe'],['まちかど厨房','machikado']];
function eligibility(name,cond){
  if(!cond)return {ok:true,why:''};
  const cd=crewData(); if(!cd)return {ok:null,why:'クルー登録なし'};
  const m=cd.members.find(x=>x.name===name); if(!m)return {ok:null,why:'クルー未登録'};
  const r=cd.ranks[m.id]||{rank:'rookie',fanta:{}};
  const lacks=[];
  const rm=cond.match(/(ルーキー|レギュラー|サブリーダー|リーダー)クルー以上/);
  if(rm){ const need=RANK_JA[rm[1]]; if((RANK_ORDER[r.rank]||0)<RANK_ORDER[need])lacks.push(rm[1]+'以上'); }
  FANTA_JA.forEach(([ja,k])=>{ if(cond.indexOf(ja+'ファンタジスタ')>=0&&!(r.fanta&&r.fanta[k]))lacks.push(ja+'ファンタジスタ'); });
  return lacks.length?{ok:false,why:lacks.join('・')+'が未達'}:{ok:true,why:''};
}

// ---- 全体管理モード（パスワード保護） ----
const MGR_PW='3963';
function isMgr(){return localStorage.getItem('bumon_manager_mode')==='1';}
function renderMgr(){
  const b=$('mgr-toggle');const on=isMgr();
  if(on){b.classList.add('on');b.textContent='🔐 全体管理 ON';}else{b.classList.remove('on');b.textContent='🔓 全体管理';}
  $('subtabs').classList.toggle('single',!on);
  if(!on && $('view-mgr').style.display==='block')switchView('board');
}

// ---- 状態・期限 ----
function sheetsOfArea(id){return S.sheets.filter(s=>s.areaId===id);}
function statusOf(sh){
  if(sh.phase==='draft')return {k:'draft',label:'下書き',cls:'b-draft'};
  if(sh.phase==='submitted')return {k:'submitted',label:'承認待ち',cls:'b-submitted'};
  if(sh.phase==='returned')return {k:'returned',label:'差し戻し',cls:'b-returned'};
  if(sh.phase==='done'){
    if(sh.next==='A')return {k:'done',label:'達成',cls:'b-done'};
    if(sh.next==='B')return {k:'retry',label:'再挑戦へ',cls:'b-retry'};
    return {k:'done',label:'完了',cls:'b-done'};
  }
  return {k:'doing',label:'実行中',cls:'b-doing'};
}
function fmtDate(s){if(!s)return '';const p=s.split('-');return p.length===3?(parseInt(p[1],10)+'/'+parseInt(p[2],10)):s;}
function dueInfo(sh){
  if(!sh.due)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(sh.due+'T00:00:00');
  const diff=Math.round((d-today)/86400000);
  const done=(sh.phase==='done');
  let cls='due-badge',txt='期限 '+fmtDate(sh.due);
  if(!done){
    if(diff<0){cls='due-badge due-over';txt=fmtDate(sh.due)+'・'+(-diff)+'日超過';}
    else if(diff===0){cls='due-badge due-soon';txt='今日まで';}
    else if(diff<=3){cls='due-badge due-soon';txt=fmtDate(sh.due)+'・あと'+diff+'日';}
    else{cls='due-badge';txt=fmtDate(sh.due)+'・あと'+diff+'日';}
  }
  return {cls,txt,diff};
}
function isOverdue(sh){const di=dueInfo(sh);return !!(di&&sh.phase!=='done'&&di.diff<0);}
function isSoon(sh){const di=dueInfo(sh);return !!(di&&sh.phase!=='done'&&di.diff>=0&&di.diff<=3);}

// ---- 画面状態（開いている部門・絞り込み）はこのタブ内で保持 ----
let _ui={open:[],flt:'all',name:'',body:[]};
try{ _ui=Object.assign(_ui,JSON.parse(sessionStorage.getItem('bumon_ui')||'{}')); }catch(e){}
function saveUi(){ try{sessionStorage.setItem('bumon_ui',JSON.stringify(_ui));}catch(e){} }
const openAreas=()=>new Set(_ui.open||[]);

// ---- 📌 今やること（絞り込みチップ） ----
function matchFilter(sh){
  if(_ui.name&&sh.assignee!==_ui.name)return false;
  switch(_ui.flt){
    case 'approve':return sh.phase==='submitted';
    case 'returned':return sh.phase==='returned';
    case 'overdue':return isOverdue(sh);
    case 'soon':return isSoon(sh);
    case 'doing':return sh.phase==='doing';
    case 'draft':return sh.phase==='draft';
    default:return true;
  }
}
function renderTodo(){
  const box=$('todo-strip'); if(!box)return;
  const sheets=S.sheets;
  const cnt={approve:sheets.filter(s=>s.phase==='submitted').length,returned:sheets.filter(s=>s.phase==='returned').length,
    overdue:sheets.filter(isOverdue).length,soon:sheets.filter(isSoon).length,doing:sheets.filter(s=>s.phase==='doing').length,draft:sheets.filter(s=>s.phase==='draft').length};
  const unassigned=allAreas().filter(a=>!(S.assignments[a.id]||[]).length).length;
  const chip=(k,label,n,cls)=>n?`<button type="button" class="tchip ${cls} ${_ui.flt===k?'on':''}" data-filter="${k}"><span class="n">${n}</span>${label}</button>`:'';
  const names=candidateNames();
  const active=_ui.flt!=='all'||_ui.name;
  let h=`<div class="todo-h">📌 今やること <span style="font-weight:500">タップで絞り込み</span>${active?'<button type="button" class="clear" data-filter="all">✕ 絞り込みを解除</button>':''}</div><div class="chips">`;
  h+=chip('approve','承認待ち',cnt.approve,isMgr()?'amber':'gray');
  h+=chip('returned','差し戻し → 直して再提出',cnt.returned,'red');
  h+=chip('overdue','期限超過',cnt.overdue,'red');
  h+=chip('soon','期限3日以内',cnt.soon,'amber');
  h+=chip('doing','実行中',cnt.doing,'blue');
  h+=chip('draft','下書き（未提出）',cnt.draft,'gray');
  if(unassigned)h+=`<button type="button" class="tchip ${_ui.flt==='unassigned'?'on':''} ${unassigned?'gray':''}" data-filter="unassigned"><span class="n">${unassigned}</span>担当が未割当の部門</button>`;
  if(names.length)h+=`<label class="tchip ${_ui.name?'on':''}">👤 <select data-namefilter><option value="">全員</option>${names.map(n=>`<option ${_ui.name===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`;
  const nothing=!cnt.approve&&!cnt.returned&&!cnt.overdue&&!cnt.soon&&!unassigned;
  if(nothing)h+=`<span class="todo-ok">✅ 対応が必要なものはありません</span>`;
  h+='</div>';
  box.innerHTML=h;
}

// ---- 部門ボード ----
function areaSummary(shs){
  if(!shs.length)return '<span class="sc none">作戦なし</span>';
  const c={};shs.forEach(s=>{const k=statusOf(s).k;c[k]=(c[k]||0)+1;});
  const order=[['submitted','承認待ち','b-submitted'],['returned','差し戻し','b-returned'],['doing','実行中','b-doing'],['draft','下書き','b-draft'],['retry','再挑戦へ','b-retry'],['done','達成','b-done']];
  return order.filter(([k])=>c[k]).map(([k,l,cls])=>`<span class="sc ${cls}">${l} ${c[k]}</span>`).join('')+(shs.some(isOverdue)?'<span class="sc due-over">期限超過</span>':'');
}
function renderBoard(){
  const wrap=$('board');let h='';
  const opens=openAreas();
  const filtering=_ui.flt!=='all'||_ui.name;
  let shown=0;
  SEED.forEach(g=>{
    let gh='';
    g.items.forEach(it=>{
      const as=S.assignments[it.id]||[];
      const shsAll=sheetsOfArea(it.id);
      const shs=filtering?shsAll.filter(matchFilter):shsAll;
      if(filtering){
        if(_ui.flt==='unassigned'){ if(as.length)return; }
        else if(!shs.length)return;
      }
      shown++;
      const open=(filtering&&_ui.flt!=='unassigned')?true:opens.has(it.id);
      gh+=`<div class="area ${open?'open':''}" data-area="${it.id}">`;
      gh+=`<div class="area-row" data-area-toggle="${it.id}">`;
      gh+=`<span class="chev">${open?'▼':'▶'}</span>`;
      gh+='<div class="area-main">';
      gh+=`<div class="area-name">${esc(it.name)}${it.cond?` <span class="info" title="担当条件：${esc(it.cond)}">ℹ️</span>`:''}</div>`;
      gh+='<div class="assignees" data-assign="'+it.id+'" title="タップで担当を変更">';
      if(as.length){as.forEach(n=>{gh+='<span class="chip"><span class="av">'+esc((n||'?').slice(0,1))+'</span>'+esc(n)+'</span>';});}
      else{gh+='<span class="unassigned">＋ 担当を決める</span>';}
      gh+='</div>';
      gh+='</div>';
      gh+=`<div class="sum">${shsAll.length?areaSummary(shsAll):''}</div>`;
      gh+=`<button class="btn btn-ghost btn-sm" data-newsheet="${it.id}" title="この部門の作戦シートを作る">＋作戦</button>`;
      gh+='</div>';
      // 中身：作戦シート（未完了を期限が近い順 → 完了は新しい順）
      const sorted=shs.slice().sort((a,b)=>{
        const ad=a.phase==='done',bd=b.phase==='done'; if(ad!==bd)return ad?1:-1;
        if(!ad){ const x=a.due||'9999',y=b.due||'9999'; if(x!==y)return x<y?-1:1; }
        return (b.updatedAt||0)-(a.updatedAt||0);
      });
      gh+='<div class="area-body">';
      if(!sorted.length)gh+='<div class="empty-note">作戦シートはまだありません。「＋作戦」から作れます</div>';
      else gh+=sorted.map(sheetHtml).join('');
      gh+='</div></div>';
    });
    if(!gh)return;
    h+='<div class="group-title"><span class="dot" style="background:'+GROUP_DOT[g.group]+'"></span>'+esc(g.group)+(g.cond?' <span class="g-cond">'+esc(g.cond)+'</span>':'')+'</div>';
    h+='<div class="card">'+gh+'</div>';
  });
  if(filtering&&!shown)h+='<div class="empty-note">この条件の作戦シートはありません</div>';
  wrap.innerHTML=h;
}
function sheetHtml(sh){
  const st=statusOf(sh), di=dueInfo(sh);
  const showBody=(_ui.body||[]).includes(sh.id);
  let h=`<div class="sheet ${showBody?'showbody':''}" data-id="${sh.id}">`;
  h+='<div class="sheet-head">';
  h+='<span class="badge '+st.cls+'">'+st.label+'</span>';
  if(di)h+='<span class="'+di.cls+'">'+esc(di.txt)+'</span>';
  h+='<span class="sheet-title">'+esc(sh.title||'(無題)')+'</span>';
  h+='<span class="sheet-meta">'+(sh.assignee?'👤 '+esc(sh.assignee):'担当なし')+'</span>';
  h+='</div>';
  if(sh.phase==='returned'&&sh.approverNote)h+=`<div class="note">差し戻しの理由：${esc(sh.approverNote)}</div>`;
  h+=`<button type="button" class="sheet-toggle" data-sheettoggle="${sh.id}">${showBody?'▾ 内容を閉じる':'▸ 内容（①②③）を見る'}</button>`;
  h+='<div class="sheet-body">';
  h+=stepHtml(1,'現状の課題（客観的な事実）',sh.problem);
  h+=stepHtml(2,'目的とゴール（あるべき状態）',sh.goal);
  h+=stepHtml(3,'明日からの仕組み（いつ・誰が・何を）',sh.mechanism);
  if(sh.result||sh.phase==='done')h+=stepHtml(4,'結果と次の一手',(sh.result||'')+(sh.next?'\n→ '+(sh.next==='A'?'A：継続・定着':'B：更新して再挑戦'):''));
  h+='</div>';
  h+='<div class="sheet-actions">'+actionsHtml(sh,st)+'</div>';
  h+='</div>';
  return h;
}
function stepHtml(n,label,val){
  const empty=!val||!String(val).trim();
  return '<div class="step"><span class="n'+(n===4?' n4':'')+'">'+n+'</span><div><div class="s-label">'+esc(label)+'</div><div class="s-val'+(empty?' empty':'')+'">'+(empty?'（未記入）':esc(val))+'</div></div></div>';
}
// 主ボタン＝今この状態で次にやること。編集・印刷・削除は控えめに
function actionsHtml(sh,st){
  let h='';
  if(sh.phase==='draft'||sh.phase==='returned')h+='<button class="btn btn-pri btn-sm" data-submit="'+sh.id+'">提出する</button>';
  if(sh.phase==='submitted'){
    if(isMgr()){
      h+='<button class="btn btn-green btn-sm" data-approve="'+sh.id+'">承認（実行へ）</button>';
      h+='<button class="btn btn-red btn-sm" data-return="'+sh.id+'">差し戻し</button>';
    }else{h+='<span class="sheet-meta">全体管理の承認待ち</span>';}
  }
  if(sh.phase==='doing')h+='<button class="btn btn-amber btn-sm" data-result="'+sh.id+'">結果を記入して完了</button>';
  if(sh.phase==='done'&&sh.next==='B')h+='<button class="btn btn-pri btn-sm" data-cycle="'+sh.id+'">次のサイクルを作成</button>';
  h+='<span class="spacer"></span>';
  h+='<button class="btn btn-line btn-sm" data-edit="'+sh.id+'">✎ 編集</button>';
  h+='<button class="btn btn-line btn-sm" data-print="'+sh.id+'">🖨 印刷</button>';
  return h;
}

// ---- 作戦シート A4印刷 / PDF ----
function storeName(){
  try{const arr=JSON.parse(localStorage.getItem('global_stores')||'[]');const s=arr.find(x=>x.id===storeId());if(s&&s.name)return s.name;}catch(e){}
  return '';
}
function fmtJaDate(v){
  if(v==null||v==='')return '—';
  const d=(typeof v==='number')?new Date(v):new Date(String(v)+'T00:00:00');
  if(isNaN(d.getTime()))return String(v);
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function printSheet(id){
  const sh=S.sheets.find(x=>x.id===id);
  if(!sh){toast('シートが見つかりません');return;}
  const ar=areaById(sh.areaId)||{name:'(不明)',group:''};
  const st=statusOf(sh);
  const nextTxt=sh.next==='A'?'A：今の仕組みを継続・定着（達成）':sh.next==='B'?'B：仕組みを更新して再挑戦（未達）':'';
  const box=(n,label,val,extra)=>`<div class="ps-box">
      <div class="ps-box-h"><span class="ps-n">${n}</span>${esc(label)}</div>
      <div class="ps-box-b">${val&&String(val).trim()?esc(val):'<span class="ps-empty">（未記入）</span>'}${extra||''}</div>
    </div>`;
  const sn=storeName();
  const html=`<div class="ps-page">
    <div class="ps-head">
      <div><div class="ps-kicker">作戦シート（PDCA）</div><div class="ps-title">${esc(sh.title||'(無題)')}</div></div>
      <div class="ps-meta"><span class="ps-badge">${esc(st.label)}</span>${sn?`<div class="ps-store">${esc(sn)}</div>`:''}</div>
    </div>
    <table class="ps-info"><tbody>
      <tr><th>担当部門</th><td>${esc(ar.group)} ／ ${esc(ar.name)}</td><th>担当者</th><td>${esc(sh.assignee||'—')}</td></tr>
      <tr><th>期限</th><td>${fmtJaDate(sh.due)}</td><th>更新日</th><td>${fmtJaDate(sh.updatedAt)}</td></tr>
    </tbody></table>
    ${box(1,'現状の課題（客観的な事実は何か？）',sh.problem)}
    ${box(2,'目的とゴール（どんな状態にするか？）',sh.goal)}
    ${box(3,'明日からの仕組み（いつ・どのタイミングで・誰が・何を）',sh.mechanism)}
    ${box(4,'結果 ＋ 次の一手',sh.result,nextTxt?`<div class="ps-next">→ 次の一手：<b>${esc(nextTxt)}</b></div>`:'')}
    <div class="ps-foot">印刷日：${fmtJaDate(Date.now())}　／　自走店舗づくり 作戦シート</div>
  </div>`;
  const area=$('print-area');
  if(!area){toast('印刷領域が見つかりません');return;}
  area.innerHTML=html;
  window.print();
}

// ---- 全体管理ダッシュボード ----
function metric(v,l,cls){return '<div class="metric '+(cls||'')+'"><div class="mv">'+v+'</div><div class="ml">'+esc(l)+'</div></div>';}
function renderManager(){
  const box=$('view-mgr'); if(!box)return;
  if(!isMgr()){box.innerHTML='';return;}   // 全体管理OFFのときはDOMにも承認ボタンを置かない
  const today=new Date();today.setHours(0,0,0,0);
  const sheets=S.sheets;
  const submitted=sheets.filter(s=>s.phase==='submitted');
  const overdue=sheets.filter(isOverdue);
  const returned=sheets.filter(s=>s.phase==='returned');
  const doing=sheets.filter(s=>s.phase==='doing');
  const doneA=sheets.filter(s=>s.phase==='done'&&s.next==='A');
  const doneB=sheets.filter(s=>s.phase==='done'&&s.next==='B');
  let h='';
  h+='<div class="mgr-metrics">';
  h+=metric(submitted.length,'承認待ち',submitted.length?'amber':'');
  h+=metric(overdue.length,'期限超過',overdue.length?'warn':'');
  h+=metric(doing.length,'実行中','');
  h+=metric(doneA.length,'達成','ok');
  h+=metric(doneB.length,'再挑戦','');
  h+='</div>';
  h+='<div class="mgr-sec">✅ 承認待ち（あなたの承認が必要）</div><div class="card">';
  if(!submitted.length)h+='<div class="empty-note">承認待ちはありません</div>';
  else submitted.forEach(sh=>{const ar=areaById(sh.areaId)||{};
    h+='<div class="mini-row"><div style="flex:1;min-width:140px"><b>'+esc(sh.title)+'</b><div class="sheet-meta">'+esc(ar.name||'')+(sh.assignee?' ・ '+esc(sh.assignee):'')+'</div></div>';
    h+='<button class="btn btn-line btn-sm" data-edit="'+sh.id+'">内容</button>';
    h+='<button class="btn btn-green btn-sm" data-approve="'+sh.id+'">承認</button>';
    h+='<button class="btn btn-red btn-sm" data-return="'+sh.id+'">差し戻し</button></div>';});
  h+='</div>';
  const att=overdue.concat(returned.filter(s=>overdue.indexOf(s)<0));
  h+='<div class="mgr-sec">⚠️ 要対応（期限超過・差し戻し）</div><div class="card">';
  if(!att.length)h+='<div class="empty-note">ありません</div>';
  else att.forEach(sh=>{const ar=areaById(sh.areaId)||{};const di=dueInfo(sh);const st=statusOf(sh);
    h+='<div class="mini-row"><span class="badge '+st.cls+'">'+st.label+'</span>'+(di?'<span class="'+di.cls+'">'+esc(di.txt)+'</span>':'');
    h+='<div style="flex:1;min-width:120px"><b>'+esc(sh.title)+'</b><div class="sheet-meta">'+esc(ar.name||'')+(sh.assignee?' ・ '+esc(sh.assignee):'')+'</div></div>';
    h+='<button class="btn btn-line btn-sm" data-edit="'+sh.id+'">開く</button></div>';});
  h+='</div>';
  h+='<div class="mgr-sec">🏅 担当者別 達成状況（評価）</div><div class="card" style="padding:8px 12px;overflow:auto">';
  const names=Array.from(new Set(sheets.map(s=>s.assignee).filter(Boolean)));
  if(!names.length)h+='<div class="empty-note">作戦シートに担当者が設定されると集計されます</div>';
  else{
    h+='<table class="eval-table"><tr><th class="name">担当</th><th>実行中</th><th>達成</th><th>再挑戦</th><th>達成率</th></tr>';
    names.forEach(n=>{const my=sheets.filter(s=>s.assignee===n);
      const dn=my.filter(s=>s.phase==='doing').length;
      const a=my.filter(s=>s.phase==='done'&&s.next==='A').length;
      const b=my.filter(s=>s.phase==='done'&&s.next==='B').length;
      const comp=a+b;const rate=comp?Math.round(a/comp*100)+'%':'—';
      h+='<tr><td class="name">'+esc(n)+'</td><td>'+dn+'</td><td>'+a+'</td><td>'+b+'</td><td class="rate">'+rate+'</td></tr>';});
    h+='</table>';
  }
  h+='</div>';
  h+='<div class="mgr-sec">📊 部門別 進捗</div><div class="card">';
  let any=false;
  SEED.forEach(g=>{g.items.forEach(it=>{const shs=sheetsOfArea(it.id);if(!shs.length)return;any=true;
    const done=shs.filter(s=>s.phase==='done').length;
    h+='<div class="mini-row"><div style="flex:1">'+esc(it.name)+'</div><span class="sheet-meta">'+shs.length+'件中 完了'+done+'</span></div>';});});
  if(!any)h+='<div class="empty-note">作戦シートが作られると、部門別の進捗が出ます</div>';
  h+='</div>';
  box.innerHTML=h;
}

// ---- モーダル：担当割当（条件の適合を表示） ----
let assignAreaId=null, assignSel=[];
function openAssign(areaId){
  assignAreaId=areaId;const ar=areaById(areaId);
  assignSel=(S.assignments[areaId]||[]).slice();
  $('assign-area-name').textContent=ar.name+(ar.cond?'　（条件: '+ar.cond+'）':'');
  const names=candidateNames();
  const cd=crewData();
  $('assign-staff-hint').textContent=names.length?(cd?'候補はクルータブの登録から':'候補はワークスケジュールの従業員から（クルータブに登録するとランク・ファンタジスタで条件判定が出ます）'):'※クルータブ（またはワークスケジュール）に従業員を登録すると、ここに出ます。';
  const rows=names.map(n=>({n,e:eligibility(n,ar.cond)})).sort((a,b)=>{const s=x=>x.e.ok===true?0:x.e.ok===null?1:2;return s(a)-s(b)||a.n.localeCompare(b.n,'ja');});
  $('assign-staff-multi').innerHTML=rows.map(({n,e})=>'<span class="opt'+(assignSel.includes(n)?' sel':'')+'" data-name="'+esc(n)+'" title="'+esc(e.why||'')+'">'+esc(n)+(ar.cond?(e.ok===true?'<span class="ok">✓</span>':e.ok===false?'<span class="ng" title="'+esc(e.why)+'">△ '+esc(e.why)+'</span>':''):'')+'</span>').join('')||'<span class="sheet-meta">（候補なし）</span>';
  show('assign-overlay');
}
function toggleAssignName(n){const i=assignSel.indexOf(n);if(i>=0)assignSel.splice(i,1);else assignSel.push(n);
  $('assign-staff-multi').querySelectorAll('.opt').forEach(o=>{o.classList.toggle('sel',assignSel.includes(o.dataset.name));});}

// ---- モーダル：作戦シート ----
let editId=null, sheetNext='';
function newSheet(areaId){
  editId=null;sheetNext='';
  $('sheet-modal-title').textContent='新規作戦シート';
  fillAreaSelect($('s-area'),areaId||'');
  // 担当者の初期値：その部門の担当が1人ならその人
  const as=(S.assignments[areaId]||[]);
  fillAssigneeSelect($('s-assignee'),as.length===1?as[0]:'');
  $('s-title').value='';$('s-due').value='';$('s-problem').value='';$('s-goal').value='';$('s-mechanism').value='';$('s-result').value='';
  $('result-block').style.display='none';
  setNextSel('');
  $('sheet-modal-actions').innerHTML='<button class="btn btn-ghost" id="m-draft">下書き保存</button><button class="btn btn-pri" id="m-submit">提出する</button>';
  $('m-draft').onclick=()=>saveSheet('draft');
  $('m-submit').onclick=()=>saveSheet('submitted');
  show('sheet-overlay');
}
function editSheet(id){
  const sh=S.sheets.find(s=>s.id===id);if(!sh)return;
  editId=id;sheetNext=sh.next||'';
  $('sheet-modal-title').textContent='作戦シートを編集';
  fillAreaSelect($('s-area'),sh.areaId);
  fillAssigneeSelect($('s-assignee'),sh.assignee||'');
  $('s-title').value=sh.title||'';$('s-due').value=sh.due||'';$('s-problem').value=sh.problem||'';$('s-goal').value=sh.goal||'';$('s-mechanism').value=sh.mechanism||'';$('s-result').value=sh.result||'';
  const showResult=(sh.phase==='doing'||sh.phase==='done');
  $('result-block').style.display=showResult?'block':'none';
  setNextSel(sh.next||'');
  let acts='<button class="btn btn-ghost" id="m-save">保存</button>';
  if(sh.phase==='draft'||sh.phase==='returned')acts+='<button class="btn btn-pri" id="m-submit">提出する</button>';
  if(sh.phase==='doing')acts+='<button class="btn btn-amber" id="m-complete">完了にする</button>';
  acts+='<button class="btn btn-line danger" id="m-del" style="flex:0 0 auto;min-width:0">削除</button>';   // 削除はカードには置かず、編集画面の中だけ（誤タップ防止）
  $('sheet-modal-actions').innerHTML=acts;
  $('m-save').onclick=()=>saveSheet(sh.phase);
  $('m-del').onclick=()=>{ hide('sheet-overlay'); delSheet(id); };
  if($('m-submit'))$('m-submit').onclick=()=>saveSheet('submitted');
  if($('m-complete'))$('m-complete').onclick=()=>{ if(!sheetNext){toast('「次の一手」A/Bを選んでください');return;} saveSheet('done'); };
  show('sheet-overlay');
}
function openResult(id){editSheet(id);$('result-block').style.display='block';$('s-result').focus();}
function setNextSel(v){sheetNext=v;document.querySelectorAll('#s-next-multi .opt').forEach(o=>o.classList.toggle('sel',o.dataset.next===v));}
function fillAreaSelect(sel,val){
  sel.innerHTML=SEED.map(g=>'<optgroup label="'+esc(g.group)+'">'+g.items.map(it=>'<option value="'+it.id+'"'+(it.id===val?' selected':'')+'>'+esc(it.name)+'</option>').join('')+'</optgroup>').join('');
}
function fillAssigneeSelect(sel,val){
  const names=candidateNames(); if(val&&!names.includes(val))names.push(val);
  sel.innerHTML='<option value="">（未設定）</option>'+names.map(n=>'<option'+(n===val?' selected':'')+'>'+esc(n)+'</option>').join('');
}
function saveSheet(phase){
  const areaId=$('s-area').value;
  const title=$('s-title').value.trim();
  if(!title){toast('タイトルを入力してください');return;}
  if(phase==='submitted'){
    if(!$('s-problem').value.trim()||!$('s-goal').value.trim()||!$('s-mechanism').value.trim()){toast('提出には①②③の記入が必要です');return;}
  }
  if(phase==='done'&&!sheetNext){toast('「次の一手」A/Bを選んでください');return;}
  const now=Date.now();
  let sh;
  if(editId){sh=S.sheets.find(s=>s.id===editId);}
  if(!sh){sh={id:'sh_'+now+'_'+Math.random().toString(36).slice(2,6),createdAt:now};S.sheets.push(sh);}
  sh.areaId=areaId;sh.assignee=$('s-assignee').value;sh.title=title;sh.due=$('s-due').value;
  sh.problem=$('s-problem').value;sh.goal=$('s-goal').value;sh.mechanism=$('s-mechanism').value;
  sh.result=$('s-result').value;sh.next=sheetNext;
  sh.phase=phase;sh.updatedAt=now;
  if(phase==='submitted')sh.submittedAt=now;
  if(phase==='done')sh.doneAt=now;
  // 作った／直した部門は開いた状態にして、見失わない
  if(!(_ui.open||[]).includes(areaId)){_ui.open=(_ui.open||[]).concat([areaId]);saveUi();}
  saveS();hide('sheet-overlay');renderAll();
  toast(phase==='submitted'?'提出しました（承認待ち）':phase==='done'?'完了にしました':'保存しました');
}

// ---- ステータス遷移 ----
function submitSheet(id){const sh=S.sheets.find(s=>s.id===id);if(!sh)return;
  if(!sh.problem||!sh.goal||!sh.mechanism){toast('提出には①②③の記入が必要です。編集から記入してください');editSheet(id);return;}
  sh.phase='submitted';sh.submittedAt=Date.now();sh.updatedAt=Date.now();saveS();renderAll();toast('提出しました（承認待ち）');}
function approveSheet(id){const sh=S.sheets.find(s=>s.id===id);if(!sh)return;sh.phase='doing';sh.approvedAt=Date.now();sh.updatedAt=Date.now();saveS();renderAll();toast('承認しました。実行中になりました');}
function returnSheet(id){const sh=S.sheets.find(s=>s.id===id);if(!sh)return;const note=prompt('差し戻しの理由（担当者に表示されます）');if(note===null)return;sh.phase='returned';sh.approverNote=note||'';sh.updatedAt=Date.now();saveS();renderAll();toast('差し戻しました');}
function delSheet(id){const sh=S.sheets.find(s=>s.id===id);if(!confirm(`作戦シート「${(sh&&sh.title)||''}」を削除しますか？（取り消せません）`))return;S.sheets=S.sheets.filter(s=>s.id!==id);saveS();renderAll();toast('削除しました');}
function cycleSheet(id){
  const sh=S.sheets.find(s=>s.id===id);if(!sh)return;
  const now=Date.now();
  const ns={id:'sh_'+now+'_'+Math.random().toString(36).slice(2,6),createdAt:now,updatedAt:now,
    areaId:sh.areaId,assignee:sh.assignee,title:sh.title+'（再挑戦）',due:'',
    problem:sh.problem,goal:sh.goal,mechanism:sh.mechanism,result:'',next:'',phase:'draft'};
  S.sheets.push(ns);saveS();
  _ui.flt='all';_ui.body=(_ui.body||[]).concat([ns.id]);saveUi();
  renderAll();toast('次のサイクルの下書きを作成しました。①②③を見直して提出してください');
  editSheet(ns.id);
}

// ---- 共通 ----
function show(id){$(id).classList.add('show');}
function hide(id){$(id).classList.remove('show');}
function renderAll(){renderTodo();renderBoard();renderManager();renderMgr();}

// ---- イベント ----
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-assign],[data-newsheet],[data-area-toggle],[data-sheettoggle],[data-filter],[data-edit],[data-print],[data-submit],[data-approve],[data-return],[data-result],[data-cycle],[data-del],[data-close],[data-name],[data-next]');
  if(!t)return;
  if(t.dataset.filter!=null){ _ui.flt=(t.dataset.filter==='all'||_ui.flt===t.dataset.filter)?'all':t.dataset.filter; if(t.dataset.filter==='all')_ui.name=''; saveUi(); renderTodo(); renderBoard(); return; }
  if(t.dataset.assign!=null){ e.stopPropagation(); return openAssign(t.dataset.assign); }
  if(t.dataset.newsheet!=null){ e.stopPropagation(); return newSheet(t.dataset.newsheet); }
  if(t.dataset.areaToggle!=null){
    const id=t.dataset.areaToggle; const o=new Set(_ui.open||[]); if(o.has(id))o.delete(id); else o.add(id); _ui.open=[...o]; saveUi();
    const el=t.closest('.area'); if(el){ el.classList.toggle('open',o.has(id)); const ch=el.querySelector('.chev'); if(ch)ch.textContent=o.has(id)?'▼':'▶'; }
    return;
  }
  if(t.dataset.sheettoggle!=null){
    const id=t.dataset.sheettoggle; const b=new Set(_ui.body||[]); if(b.has(id))b.delete(id); else b.add(id); _ui.body=[...b]; saveUi();
    const el=t.closest('.sheet'); if(el){ el.classList.toggle('showbody',b.has(id)); t.textContent=b.has(id)?'▾ 内容を閉じる':'▸ 内容（①②③）を見る'; }
    return;
  }
  if(t.dataset.edit!=null)return editSheet(t.dataset.edit);
  if(t.dataset.print!=null)return printSheet(t.dataset.print);
  if(t.dataset.submit!=null)return submitSheet(t.dataset.submit);
  if(t.dataset.approve!=null)return approveSheet(t.dataset.approve);
  if(t.dataset.return!=null)return returnSheet(t.dataset.return);
  if(t.dataset.result!=null)return openResult(t.dataset.result);
  if(t.dataset.cycle!=null)return cycleSheet(t.dataset.cycle);
  if(t.dataset.del!=null)return delSheet(t.dataset.del);
  if(t.dataset.close!=null)return hide(t.dataset.close);
  if(t.dataset.name!=null)return toggleAssignName(t.dataset.name);
  if(t.dataset.next!=null)return setNextSel(t.dataset.next);
});
document.addEventListener('change',e=>{ const s=e.target.closest('[data-namefilter]'); if(s){ _ui.name=s.value; saveUi(); renderTodo(); renderBoard(); } });
$('assign-save').onclick=()=>{
  if(!assignAreaId)return;
  S.assignments[assignAreaId]=assignSel.slice();
  saveS();hide('assign-overlay');renderAll();toast('担当を保存しました');
};
$('new-sheet-btn').onclick=()=>newSheet('');
$('mgr-toggle').onclick=()=>{
  if(isMgr()){localStorage.setItem('bumon_manager_mode','0');renderAll();toast('全体管理モードOFF');return;}
  const pw=prompt('全体管理モードのパスワードを入力してください');
  if(pw===null)return;
  if(pw!==MGR_PW){toast('パスワードが違います');return;}
  localStorage.setItem('bumon_manager_mode','1');renderAll();toast('全体管理モードON（承認・全体管理の項目）');
};
document.querySelectorAll('.subtab').forEach(tb=>tb.addEventListener('click',()=>switchView(tb.dataset.view)));
function switchView(v){
  if(v==='mgr'&&!isMgr())v='board';
  document.querySelectorAll('.subtab').forEach(tb=>tb.classList.toggle('active',tb.dataset.view===v));
  $('view-board').style.display=v==='board'?'block':'none';
  $('view-mgr').style.display=v==='mgr'?'block':'none';
  if(v==='mgr')renderManager();
}

// 別タブ/別端末でstateが変わったら読み直して描き直す（統合アプリのリアルタイム反映）
window.addEventListener('storage',e=>{ if(e.key===dataKey()||e.key==='current_store_id'||/^(crew_v1|ws_v1)/.test(e.key||'')){loadS();renderAll();} });

// 起動
loadS();renderAll();
</script>
