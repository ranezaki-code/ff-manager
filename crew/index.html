<script>
/* 入力途中の値を守る共通ガード（全システム共通・同期対象外）
   - 文字を打つたびに sessionStorage へ退避し、画面の作り直し・再描画の後に同じ欄へ戻す（フォーカスも戻す）
   - 欄が確定（change）されたら退避を消す。30分で失効
   → 統合アプリの同期や他タブの保存で画面が描き直されても、入力途中の文字が構造的に消えない */
(function(){
  var KEY='__draft::'+location.pathname, TTL=30*60*1000, drafts={}, lastFocusKey=null, timer=null;
  try{ drafts=JSON.parse(sessionStorage.getItem(KEY)||'{}')||{}; lastFocusKey=sessionStorage.getItem(KEY+'#focus')||null; }catch(e){ drafts={}; }
  function isText(el){ if(!el||!el.tagName)return false; var t=el.tagName; if(t==='TEXTAREA')return true; if(t!=='INPUT')return false; var ty=(el.type||'text').toLowerCase(); return ['text','number','search','tel','url','email','date','time','month'].indexOf(ty)>=0; }
  function keyOf(el){
    if(el.id)return '#'+el.id;
    var a=el.getAttribute('onchange')||el.getAttribute('oninput')||el.getAttribute('onblur'); if(a)return 'h:'+a;
    var ds=(el.dataset&&Object.keys(el.dataset).length)?JSON.stringify(el.dataset):''; if(ds)return 'd:'+ds;
    var anc=el.closest('[id],[data-pid],[data-id],[data-key]'); var base=anc?(anc.id?'#'+anc.id:JSON.stringify(anc.dataset)):'body';
    var list=(anc||document.body).querySelectorAll('input,textarea'); return 'p:'+base+'/'+Array.prototype.indexOf.call(list,el);
  }
  function persist(){ try{ sessionStorage.setItem(KEY,JSON.stringify(drafts)); sessionStorage.setItem(KEY+'#focus',lastFocusKey||''); }catch(e){} }
  function prune(){ var now=Date.now(); Object.keys(drafts).forEach(function(k){ if(now-(drafts[k].t||0)>TTL)delete drafts[k]; }); }
  document.addEventListener('input',function(e){ var el=e.target; if(!isText(el)||el.__draftRestoring)return; var k=keyOf(el); lastFocusKey=k; drafts[k]={v:el.value,t:Date.now()}; persist(); },true);
  document.addEventListener('change',function(e){ var el=e.target; if(!isText(el))return; var k=keyOf(el); if(drafts[k]){ delete drafts[k]; persist(); } },true);
  document.addEventListener('focusin',function(e){ if(isText(e.target))lastFocusKey=keyOf(e.target); },true);
  function restore(){
    timer=null; prune(); var keys=Object.keys(drafts); if(!keys.length)return;
    var els=document.querySelectorAll('input,textarea'), map={}, i;
    for(i=0;i<els.length;i++){ if(isText(els[i]))map[keyOf(els[i])]=els[i]; }
    var refocus=null;
    keys.forEach(function(k){ var el=map[k]; if(!el)return; var d=drafts[k];
      if(el.value!==d.v){ el.__draftRestoring=true; el.value=d.v; try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){} el.__draftRestoring=false; }
      if(k===lastFocusKey)refocus=el; });
    // 描き直しでフォーカスが外れていたら、同じ欄の末尾へ戻す
    if(refocus&&(!document.activeElement||document.activeElement===document.body)){ try{ refocus.focus(); var n=refocus.value.length; if(refocus.setSelectionRange)refocus.setSelectionRange(n,n); }catch(e){} }
  }
  function schedule(){ if(!timer)timer=setTimeout(restore,60); }
  function start(){ try{ new MutationObserver(function(ms){ for(var i=0;i<ms.length;i++){ if(ms[i].addedNodes&&ms[i].addedNodes.length){ schedule(); return; } } }).observe(document.body,{childList:true,subtree:true}); }catch(e){} schedule(); }
  if(document.body)start(); else document.addEventListener('DOMContentLoaded',start);
  window.addEventListener('pagehide',persist);
})();
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--panel:#fff;--text:#0f172a;--sub:#64748b;--faint:#94a3b8;--border:#e2e8f0;
  --accent:#2563eb;--accent-dk:#1d4ed8;--accent-lt:#eff6ff;
  --green:#16a34a;--green-lt:#ecfdf5;--amber:#d97706;--amber-lt:#fffbeb;--red:#dc2626;--red-lt:#fef2f2;--purple:#7c3aed;--purple-lt:#f5f3ff;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:1000px;margin:0 auto;padding:10px 12px 0}
header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-shrink:0}
header h1{font-size:18px;font-weight:800}
header .spacer{flex:1}
.hub-link{font-size:13px;color:var(--sub);text-decoration:none;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px}
.embedded-in-hub .hub-link{display:none}
.subtabs{display:flex;gap:6px;margin-bottom:10px;flex-shrink:0}
.subtab{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--sub);background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 6px;cursor:pointer;user-select:none}
.subtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view{display:none;flex:1;min-height:0;overflow:auto;padding-bottom:80px;-webkit-overflow-scrolling:touch}
.view.active{display:block}
#view-duty{padding:0;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:12px}
#view-duty.active{display:flex;flex-direction:column}
#duty-frame{flex:1;width:100%;border:none;min-height:0;background:#fff}
/* 共通 */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar input[type=search]{flex:1;min-width:140px;font-family:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;background:#fff}
.btn{font-family:inherit;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;padding:9px 13px;white-space:nowrap}
.btn-pri{background:var(--accent);color:#fff}.btn-pri:hover{background:var(--accent-dk)}
.btn-ghost{background:#f1f5f9;color:var(--text)}.btn-ghost:hover{background:#e2e8f0}
.btn-line{background:#fff;border:1px solid var(--border);color:var(--sub)}
.btn-red{background:var(--red-lt);color:var(--red)}
.btn-sm{padding:6px 10px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.empty{color:var(--faint);font-size:13px;text-align:center;padding:22px;background:var(--panel);border:1px dashed var(--border);border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.rank-badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;white-space:nowrap}
.fanta{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:#fdf4ff;color:#7e22ce;border:1px solid #e9d5ff;white-space:nowrap}
.muted{font-size:12px;color:var(--sub)}
.hint{font-size:11px;color:var(--faint)}
/* クルー情報のロック画面（パスワード） */
.lockbox{max-width:420px;margin:28px auto 0;padding:26px 20px;text-align:center}
.lockbox .lock-ico{font-size:40px;line-height:1}
.lockbox .lock-title{font-size:16px;font-weight:800;margin:10px 0 4px}
.lockbox form{display:flex;gap:8px;margin-top:16px}
.lockbox input{flex:1;min-width:0;font-family:inherit;font-size:18px;letter-spacing:2px;text-align:center;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;background:#fff}
.lockbox input:focus{outline:none;border-color:var(--accent)}
.lockbox .btn{padding:11px 20px;font-size:15px}
.lock-err{min-height:20px;margin-top:10px;font-size:13px;font-weight:700;color:var(--red)}
.lock-err.wait{color:var(--sub);font-weight:500}
.lock-note{font-size:12px;color:var(--sub);background:#f8fafc;border:1px dashed var(--border);border-radius:9px;padding:8px 11px;margin-bottom:8px}
/* 名前の整理（WS・担当業務に残る、クルー情報に無い名前） */
.tidy-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;background:var(--amber-lt);color:#92400e;border:1px solid #fde68a;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.tidy-banner span{flex:1;min-width:180px}
.tidy-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.tidy-name{font-size:14px;font-weight:800;width:130px;flex-shrink:0;word-break:break-word}
.tidy-row select{flex:1;min-width:190px;font-family:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:9px;padding:9px 10px;background:#fff}
/* クルー情報：一覧（列をそろえた表）／スキル表 */
.toolbar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;background:#e2e8f0;border-radius:10px;padding:3px;gap:2px}
.seg button{font-family:inherit;font-size:13px;font-weight:700;border:none;background:transparent;color:var(--sub);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.fchip{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--border);background:#fff;color:var(--sub);border-radius:999px;padding:6px 11px;cursor:pointer}
.fchip.on{background:var(--accent-lt);border-color:#bfdbfe;color:var(--accent-dk)}
.ctable{overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(0,1.6fr) 104px minmax(0,1.3fr) 92px 86px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.crow:last-child{border-bottom:none}
.crow:hover{background:#fafcff}
.crow.head{cursor:default;background:#f8fafc;font-size:11px;font-weight:700;color:var(--faint);padding:7px 14px}
.crow.head:hover{background:#f8fafc}
.c-name{display:flex;align-items:center;gap:10px;min-width:0}
.c-name b{font-size:15px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name small{font-size:11px;color:var(--faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar.sm{width:34px;height:34px;font-size:14px}
.c-memo{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px}
.c-talk{font-size:13px;color:#374151;white-space:nowrap}
.c-talk.warn{color:var(--red);font-weight:700}
.c-none{color:var(--faint);font-size:12px}
.c-fix{background:var(--red-lt);color:var(--red)}.c-good{background:var(--green-lt);color:var(--green)}.c-doing{background:var(--amber-lt);color:var(--amber)}
.c-lbl{display:none;font-size:10px;color:var(--faint);font-weight:700;margin-right:4px}
.matrix-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
.matrix{border-collapse:collapse;font-size:13px;width:100%}
.matrix th,.matrix td{border-bottom:1px solid #f1f5f9;padding:8px 6px;text-align:center;white-space:nowrap}
.matrix th{font-size:11px;font-weight:700;color:var(--sub);background:#f8fafc;min-width:66px;white-space:normal;word-break:keep-all;line-height:1.3;vertical-align:bottom}
.matrix .nm{text-align:left;position:sticky;left:0;background:#fff;font-weight:800;min-width:128px;z-index:1;cursor:pointer}
.matrix th.nm{background:#f8fafc;cursor:default}
.matrix td.sk{font-weight:800;font-size:15px;color:#cbd5e1}
.matrix td.sk.lv1{background:var(--amber-lt);color:var(--amber)}
.matrix td.sk.lv2{background:var(--green-lt);color:var(--green)}
.matrix.editing td.sk{cursor:pointer;outline:1px dashed #cbd5e1;outline-offset:-3px}
.matrix tfoot td{font-size:11px;font-weight:700;color:var(--sub);background:#f8fafc}
.legend{font-size:12px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* 人物画面：4つのタブ */
.ptabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin:4px 0 12px;overflow-x:auto}
.ptab{font-family:inherit;font-size:13px;font-weight:700;border:none;background:none;color:var(--sub);padding:9px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.ptab.on{color:var(--accent-dk);border-bottom-color:var(--accent)}
.ptab .cnt{display:inline-block;min-width:18px;text-align:center;font-size:11px;background:var(--red-lt);color:var(--red);border-radius:999px;padding:0 6px;margin-left:3px}
/* 面談メモ（箇条書き） */
.memo-add{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.memo-add input{flex:1;min-width:160px;font-family:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px}
.memo-add input:focus{outline:none;border-color:var(--accent)}
.kseg button.on[data-memokind="fix"]{color:var(--red)}
.kseg button.on[data-memokind="good"]{color:var(--green)}
.memo{display:flex;align-items:flex-start;gap:9px;padding:9px 2px;border-bottom:1px solid #f1f5f9}
.memo:last-child{border-bottom:none}
.kpill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.memo .tx{font-size:14px;font-weight:600;word-break:break-word}
.memo .meta{font-size:11px;color:var(--faint);margin-top:1px}
.memo.done .tx{color:var(--sub);font-weight:500}
.memo .acts{display:flex;gap:4px;align-items:center;flex-shrink:0}
.link-btn{font-family:inherit;font-size:11px;font-weight:700;color:var(--faint);background:none;border:none;cursor:pointer;padding:4px;text-decoration:underline}
.told-btn{width:100%;margin-top:10px;padding:12px;font-size:14px;white-space:normal;line-height:1.4}
details.donebox{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:2px 10px;background:#fafafa}
details.donebox summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--sub);padding:8px 0}
/* 昇格条件・業務スキル：3段階（まだ／練習中／できる） */
.lv3{display:inline-flex;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;flex-shrink:0;background:#fff}
.lv3 button{font-family:inherit;font-size:12px;font-weight:700;border:none;background:#fff;color:var(--faint);padding:7px 10px;cursor:pointer;border-right:1px solid var(--border);white-space:nowrap}
.lv3 button:last-child{border-right:none}
.lv3 button.on[data-lv="0"]{background:#f1f5f9;color:var(--sub)}
.lv3 button.on[data-lv="1"]{background:var(--amber-lt);color:var(--amber)}
.lv3 button.on[data-lv="2"]{background:var(--green-lt);color:var(--green)}
.crit{border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:6px;background:#fff}
.crit.lv2{background:#f7fdf9;border-color:#bbf7d0}
.crit.lv1{background:#fffdf5;border-color:#fde68a}
.crit-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crit-top .t{flex:1;min-width:150px;font-size:13px;font-weight:700}
.crit-note{width:100%;margin-top:7px;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:#fff}
.crit-note:focus{outline:none;border-color:var(--accent)}
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.skrow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0}
.skrow .t{font-size:13px;font-weight:700;min-width:0}
@media(max-width:640px){
  .crow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name rank" "memo act" "talk act";row-gap:6px}
  .crow.head{display:none}
  .c-name{grid-area:name}.c-rank{grid-area:rank;text-align:right}.c-memo{grid-area:memo}.c-talk{grid-area:talk;font-size:12px}.c-act{grid-area:act;align-self:center}
  .c-lbl{display:inline}
  .skgrid{grid-template-columns:1fr}
  .ptab{padding:9px 7px;font-size:12px}
  .ptab .ico{display:none}   /* スマホ：4つのタブが横に収まるよう絵文字を省く */
}
/* クルー情報（旧カード表示の名残：人物パネルのアバター等で使用） */
.member{display:flex;gap:12px;padding:12px 14px;margin-bottom:9px;align-items:flex-start;cursor:pointer}
.member:hover{background:#fafcff}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-body{flex:1;min-width:0}
.m-name{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-kana{font-size:11px;color:var(--faint);font-weight:500}
.m-line{font-size:12px;color:var(--sub);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m-memo{font-size:12px;color:#374151;margin-top:5px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dow{display:inline-flex;gap:2px}
.dow span{width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:#f1f5f9;color:#cbd5e1}
.dow span.on{background:var(--accent-lt);color:var(--accent-dk)}
.icon-mini{background:none;border:none;font-size:15px;cursor:pointer;color:var(--faint);padding:2px 4px;flex-shrink:0}
.icon-mini:hover{color:var(--text)}
/* 📌 今やること（1本の優先順リスト） */
.dash{margin-bottom:10px}
.todo{padding:10px 12px}
.todo h4{font-size:14px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trow{display:flex;align-items:center;gap:8px;padding:9px 6px;border-top:1px solid #f1f5f9;cursor:pointer;flex-wrap:wrap}
.trow:hover{background:#fafcff}
.trow b{font-size:14px}
.ttxt{font-size:12px;color:var(--sub);flex:1;min-width:140px}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.t-eval{background:var(--green-lt);color:var(--green)}.t-collect{background:var(--amber-lt);color:var(--amber)}.t-hand{background:var(--purple-lt);color:var(--purple)}.t-talk{background:var(--accent-lt);color:var(--accent-dk)}.t-issue{background:#f1f5f9;color:var(--sub)}
/* 📄 評価シート */
.sheet-sec{background:#fff7ed;border:1.5px solid #fed7aa;border-radius:12px;padding:10px 12px}
.strail{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--faint)}
.sstep{border:1.5px solid var(--border);border-radius:999px;padding:4px 10px;background:#fff}
.sstep.on{background:var(--green-lt);color:var(--green);border-color:#bbf7d0}
.sstep b{margin-left:4px}
.sarrow{color:#cbd5e1}
.smsg{font-size:13px;margin-top:8px;color:#374151}
/* ランクボード */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.sum{padding:8px 6px;text-align:center;border-radius:10px;border:1px solid var(--border);background:#fff}
.sum .n{font-size:20px;font-weight:800;line-height:1}
.sum .l{font-size:11px;font-weight:700;margin-top:3px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.col{border-radius:12px;padding:8px;min-height:100px;border:1.5px solid var(--border)}
.col h4{font-size:12px;font-weight:800;margin-bottom:6px;text-align:center}
.mchip{background:#fff;border:1px solid var(--border);border-radius:9px;padding:7px 8px;margin-bottom:6px;cursor:pointer}
.mchip:hover{border-color:var(--accent)}
.mchip.sel{outline:2px solid var(--accent);outline-offset:-1px}
.mchip .nm{font-size:13px;font-weight:800;display:flex;justify-content:space-between;gap:4px;align-items:center}
.mchip .pct{font-size:11px;font-weight:700;color:var(--sub)}
.bar{height:6px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.mchip .fx{margin-top:4px;display:flex;gap:3px;flex-wrap:wrap}
/* 人物パネル（クルー情報／ランク共通） */
.person{padding:14px}
.p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.p-head .nm{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-head .spacer{flex:1}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12px;color:#374151;background:#f8fafc;border-radius:10px;padding:9px 11px;margin-bottom:10px}
.prof .k{color:var(--faint);font-weight:700;margin-right:4px}
.prof .full{grid-column:1/-1;white-space:pre-wrap;word-break:break-word}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.qa .addrow{margin:0}
.sec{margin-top:12px}
.sec h3{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rankbtns{display:flex;gap:6px;flex-wrap:wrap}
.rankbtn{font-family:inherit;font-size:12px;font-weight:800;border-radius:999px;padding:7px 12px;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--sub)}
.rankbtn.on{color:#fff}
.chk{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;cursor:pointer;background:#fff}
.chk input{width:18px;height:18px;margin-top:1px;flex-shrink:0;cursor:pointer}
.chk.done{background:var(--green-lt);border-color:#bbf7d0}
.chk .t{font-size:13px;font-weight:600}
.chk.done .t{text-decoration:line-through;color:var(--sub)}
.fbtn{font-family:inherit;font-size:13px;font-weight:800;border-radius:10px;padding:9px 12px;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.fbtn.on{background:#fdf4ff;color:#7e22ce;border-color:#d8b4fe}
.issue{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;background:#fff}
.issue .st{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;cursor:pointer;white-space:nowrap;flex-shrink:0;border:none;font-family:inherit}
.st-todo{background:#f1f5f9;color:var(--sub)}.st-doing{background:var(--amber-lt);color:var(--amber)}.st-done{background:var(--green-lt);color:var(--green)}
.issue .tx{flex:1;font-size:13px;font-weight:600;min-width:0;word-break:break-word}
.issue.done .tx{text-decoration:line-through;color:var(--sub)}
.issue .meta{font-size:11px;color:var(--faint);margin-top:2px}
.addrow{display:flex;gap:6px;margin-bottom:8px}
.addrow input{flex:1;min-width:0;font-family:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:9px;padding:9px 11px}
.logrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.logrow .d{color:var(--faint);font-size:11px;white-space:nowrap;padding-top:2px}
.hist{font-size:12px;color:var(--sub);line-height:1.8}
/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
.overlay.show{display:flex}
@media(min-width:600px){.overlay{align-items:center;padding:18px}}
.modal{background:#fff;border-radius:18px 18px 0 0;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));position:relative}
@media(min-width:600px){.modal{border-radius:18px}}
.modal h2{font-size:17px;font-weight:800;margin-bottom:12px}
.close-x{position:absolute;top:10px;right:12px;font-size:22px;color:var(--sub);cursor:pointer;background:none;border:none;z-index:1}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;font-family:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;background:#fff;color:var(--text)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dowpick{display:flex;gap:5px;flex-wrap:wrap}
.dowpick label{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;border:1.5px solid var(--border);border-radius:999px;padding:6px 10px;cursor:pointer;background:#fff}
.dowpick label.on{background:var(--accent-lt);border-color:#bfdbfe;color:var(--accent-dk)}
.dowpick input{display:none}
.btn-row{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;padding:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;z-index:2000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
@media(max-width:640px){
  .dash{grid-template-columns:1fr}
  .summary,.board{grid-template-columns:repeat(2,1fr)}
  .grid2,.qa,.prof{grid-template-columns:1fr}
  .wrap{padding:8px 8px 0}
}

<body>
<div class="wrap">
  <header>
    <h1>👥 クルー</h1>
    <div class="spacer"></div>
    <a href="../app.html" class="hub-link">← ハブ</a>
  </header>
  <div class="subtabs">
    <div class="subtab" data-view="duty">🧭 担当業務</div>
    <div class="subtab" data-view="info">📇 クルー情報<span id="info-lock-ico"></span></div>
    <div class="subtab" data-view="rank">🏅 クルーランク</div>
  </div>

  <div id="view-duty" class="view"><iframe id="duty-frame" title="担当業務"></iframe></div>

  <div id="view-info" class="view">
    <!-- ロック中はこの画面だけを出し、クルーの一覧は画面に描かない -->
    <div id="info-lock" class="card lockbox" style="display:none">
      <div class="lock-ico">🔒</div>
      <div class="lock-title">クルー情報はパスワードで保護されています</div>
      <div class="muted">連絡先・誕生日・メモなどの個人情報を含むため、管理者だけが開けます</div>
      <form id="info-lock-form" autocomplete="off">
        <input type="password" id="info-pw" inputmode="numeric" autocomplete="off" placeholder="パスワード" aria-label="パスワード">
        <button type="submit" class="btn btn-pri" id="info-unlock-btn">開く</button>
      </form>

    </div>
    <div id="info-body" style="display:none">
      <div class="lock-note" style="border-style:solid;background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a">👥 ここが<b>唯一の名簿</b>です。ここで追加・名前変更すると、ワークスケジュールの担当者と担当業務に自動で反映されます。</div>
      <div id="tidy-banner" class="tidy-banner" style="display:none"></div>
      <div class="toolbar">
        <input type="search" id="info-q" placeholder="名前で検索">
        <button class="btn btn-line" id="import-btn">🔗 名前の整理</button>
        <button class="btn btn-pri" id="add-member-btn">＋ クルー追加</button>
        <button class="btn btn-line" id="info-lock-btn" title="クルー情報を閉じて、パスワードが必要な状態に戻します">🔒 ロックする</button>
      </div>
      <div class="toolbar2">
        <div class="seg" id="info-viewseg"><button type="button" data-infoview="list">📋 一覧</button><button type="button" data-infoview="skills">🧩 スキル表</button></div>
        <span id="info-filters" style="display:inline-flex;gap:6px;flex-wrap:wrap"></span>

    </div>

  <div id="view-rank" class="view">
    <div class="dash" id="rank-dash"></div>
    <div class="summary" id="rank-summary"></div>
    <div class="board" id="rank-board"></div>
    <div class="toolbar" style="justify-content:flex-end;margin-bottom:6px"><button class="btn btn-line btn-sm" id="edit-criteria-btn">⚙️ 昇格条件を編集</button></div>
    <div id="rank-detail"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ============ 基本 ============
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let _toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),1800);}
function uid(p){return (p||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtD(s){if(!s)return '';const p=String(s).split('-');return p.length===3?`${+p[1]}/${+p[2]}`:s;}
function daysSince(s){ if(!s)return null; const d=new Date(s+'T00:00:00'); if(isNaN(d))return null; return Math.floor((Date.now()-d.getTime())/86400000); }
function tenure(hire){ if(!hire)return ''; const d=new Date(hire+'T00:00:00'); if(isNaN(d))return ''; const now=new Date(); let m=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth()); if(now.getDate()<d.getDate())m--; if(m<0)return ''; const y=Math.floor(m/12),mm=m%12; return y>0?`${y}年${mm}か月`:`${mm}か月`; }
const DOW=['日','月','火','水','木','金','土'];

// ============ 店舗 / 保存（壊れた保存は退避して上書きしない） ============
function storeId(){return localStorage.getItem('current_store_id')||localStorage.getItem('ffv6_current')||'';}
function dataKey(){const s=storeId();return s?'crew_v1_store_'+s:'crew_v1';}
const RANKS=[
  {k:'rookie',   label:'ルーキークルー',   short:'ルーキー',   color:'#64748b',bg:'#f1f5f9',border:'#e2e8f0'},
  {k:'regular',  label:'レギュラークルー', short:'レギュラー', color:'#2563eb',bg:'#eff6ff',border:'#bfdbfe'},
  {k:'subleader',label:'サブリーダークルー',short:'サブリーダー',color:'#d97706',bg:'#fffbeb',border:'#fde68a'},
  {k:'leader',   label:'リーダークルー',   short:'リーダー',   color:'#dc2626',bg:'#fef2f2',border:'#fecaca'}
];
const NEXT={rookie:'regular',regular:'subleader',subleader:'leader',leader:null};
const FANTA=[{k:'ff',label:'FF',icon:'🍗'},{k:'sekkyaku',label:'接客',icon:'🙋'},{k:'machicafe',label:'Machi Cafe',icon:'☕'},{k:'machikado',label:'まちかど厨房',icon:'🍱'}];
const DEFAULT_CRITERIA={
  regular:['レジ操作を一人でできる','品出し・前出し・先入れ先出しができる','挨拶・接客の基本ができる','ホットFFの基本作成ができる','清掃基準どおりに清掃できる'],
  subleader:['発注の補助ができる','新人に業務を教えられる','値引き・廃棄の判断ができる','まちかど厨房を一人で回せる','トラブルの一次対応ができる'],
  leader:['シフト内で指示出し・声かけができる','売場改善を提案して実行できる','売上・廃棄の数値を意識して運営できる','全部門の基本業務を網羅している','店長不在時に店舗を運営できる']
};
// 業務スキル表の初期項目（「⚙️ 業務を編集」で店舗ごとに変えられる）
const DEFAULT_SKILLS=['レジ','接客・挨拶','品出し・前出し','清掃','ホットFF','中華まん・常温FF','まちかど厨房','マチカフェ','発注','検品・納品','値引き・廃棄','宅配・収納代行'];
const LV_LABEL=['まだ','練習中','できる'], LV_MARK=['·','▲','●'];
const NO_TALK_DAYS=30;   // 面談が空いたと判定する日数
const NEAR_PCT=80;       // 昇格間近と判定する進捗%
// aliases＝{古い表記: クルーID}。「この名前は○○さんと同じ人」の結びつけ。WS・担当業務はこれを読んで自分の記録の表記をそろえる
let S={members:[],ranks:{},criteria:null,aliases:{}};
function rankOf(k){return RANKS.find(r=>r.k===k)||RANKS[0];}
function loadS(){
  S={members:[],ranks:{},criteria:null,aliases:{}};
  const raw=localStorage.getItem(dataKey());
  if(raw){
    try{ const o=JSON.parse(raw); if(o&&typeof o==='object'){ S.members=Array.isArray(o.members)?o.members:[]; S.ranks=(o.ranks&&typeof o.ranks==='object')?o.ranks:{}; S.criteria=(o.criteria&&typeof o.criteria==='object')?o.criteria:null; S.aliases=(o.aliases&&typeof o.aliases==='object'&&!Array.isArray(o.aliases))?o.aliases:{}; if(Array.isArray(o.skills))S.skills=o.skills.map(x=>String(x||'').trim()).filter(Boolean); } }
    catch(e){ console.error('crew load',e); try{localStorage.setItem(dataKey()+'_corrupt_backup_'+Date.now(),raw);}catch(_){}; }
  }
  if(!S.criteria) S.criteria=JSON.parse(JSON.stringify(DEFAULT_CRITERIA));
  ['regular','subleader','leader'].forEach(k=>{ if(!Array.isArray(S.criteria[k])) S.criteria[k]=DEFAULT_CRITERIA[k].slice(); });
  S.members.forEach(m=>{ if(!Array.isArray(m.days))m.days=[]; if(!Array.isArray(m.logs))m.logs=[]; });
  if(!Array.isArray(S.skills)) S.skills=DEFAULT_SKILLS.slice();   // 未設定＝初期項目（保存は編集した時だけ）
}
function saveS(){ try{ localStorage.setItem(dataKey(),JSON.stringify(S)); }catch(e){ console.error('crew save',e); alert('保存に失敗しました（容量不足の可能性）: '+e); } }
function rankRec(id){ if(!S.ranks[id]) S.ranks[id]={rank:'rookie',checks:{},fanta:{},fantaDate:{},issues:[],history:[]}; const r=S.ranks[id]; if(!r.checks)r.checks={}; if(!r.fanta)r.fanta={}; if(!r.fantaDate)r.fantaDate={}; if(!Array.isArray(r.issues))r.issues=[]; if(!Array.isArray(r.history))r.history=[]; if(!Array.isArray(r.sheetHistory))r.sheetHistory=[]; if(r.sheet&&typeof r.sheet!=='object')r.sheet=null;
  // trying＝昇格条件「練習中」／critNote＝条件ごとのひとこと／skill＝業務スキル（1=練習中, 2=できる）。checks は「できる」のまま（進捗％は従来と同じ計算）
  ['trying','critNote','skill'].forEach(k=>{ if(!r[k]||typeof r[k]!=='object'||Array.isArray(r[k]))r[k]={}; }); if(!NEXT.hasOwnProperty(r.rank))r.rank='rookie'; return r; }
// ---- 紙の評価シート（ランクアップ用）：渡した→受け取った→評価した をシステムが記憶 ----
const SHEET_NUDGE_DAYS=7;   // 配布後この日数を過ぎて未提出なら「回収する」に出す
function sheetOf(id){ const r=rankRec(id); return (r.sheet&&r.sheet.status)?r.sheet:{status:'none'}; }
function sheetLabel(id){ const s=sheetOf(id); if(s.status==='none')return null; const d=s.status==='handed'?s.handedAt:s.status==='submitted'?s.submittedAt:s.doneAt; const n=daysSince(d); const base=s.status==='handed'?'配布中':s.status==='submitted'?'提出済・未評価':'評価完了'; return {text:base+((n!=null&&s.status!=='done')?` ${n}日`:''),status:s.status,days:n}; }
function sheetAdvance(id){
  const r=rankRec(id), m=member(id), t=today(); if(!m)return;
  const st=sheetOf(id).status;
  if(st==='none'){ if(!NEXT[r.rank]){toast('最上位ランクのため評価シートは不要です');return;} r.sheet={target:NEXT[r.rank],status:'handed',handedAt:t}; toast(`${m.name}：評価シートを渡した（${fmtD(t)}）`); }
  else if(st==='handed'){ r.sheet.status='submitted'; r.sheet.submittedAt=t; toast(`${m.name}：評価シートを受け取った（${fmtD(t)}）`); }
  else if(st==='submitted'){ r.sheet.status='done'; r.sheet.doneAt=t; toast(`${m.name}：評価完了。ランクを上げましょう`); }
  else return;
  saveS(); refresh();
}
function sheetUndo(id){
  const r=rankRec(id), s=r.sheet, m=member(id); if(!s||!s.status||s.status==='none'||!m)return;
  const lbl={handed:'渡した',submitted:'受け取った',done:'評価した'}[s.status];
  if(!confirm(`${m.name} の評価シート「${lbl}」の記録を取り消しますか？\n（1つ前の状態に戻ります）`))return;
  if(s.status==='done'){s.status='submitted';delete s.doneAt;} else if(s.status==='submitted'){s.status='handed';delete s.submittedAt;} else {r.sheet=null;}
  saveS(); refresh();
}
function renderSheetBlock(id,nk){
  const s=sheetOf(id), st=s.status, order={none:0,handed:1,submitted:2,done:3}, cur=order[st]||0;
  const steps=[['配布',s.handedAt],['提出',s.submittedAt],['評価',s.doneAt]];
  const trail=steps.map(([l,d],i)=>`<span class="sstep ${cur>i?'on':''}">${cur>i?'✓':(i+1)} ${l}${d?`<b>${esc(fmtD(d))}</b>`:''}</span>`).join('<span class="sarrow">→</span>');
  const days=st==='handed'?daysSince(s.handedAt):st==='submitted'?daysSince(s.submittedAt):null;
  let msg='',btn='';
  if(st==='none'){ msg=nk?'まだ渡していません':'最上位ランクのため対象外'; btn=nk?`<button class="btn btn-pri" data-sheetadv="${esc(id)}">📄 渡した（配布を記録）</button>`:''; }
  else if(st==='handed'){ msg=`配布から <b>${days}日</b>${days>=SHEET_NUDGE_DAYS?'　⚠️ そろそろ回収の声かけを':''}`; btn=`<button class="btn btn-pri" data-sheetadv="${esc(id)}">📥 受け取った（提出を記録）</button>`; }
  else if(st==='submitted'){ msg=`提出から <b>${days}日</b>　✅ 評価してランクアップの判断を`; btn=`<button class="btn btn-pri" data-sheetadv="${esc(id)}">✅ 評価した（完了を記録）</button>`; }
  else { msg='評価完了。下の「ランク」を上げると、このシートは履歴に残り次のランク用に切り替わります'; }
  return `<div class="strail">${trail}</div><div class="smsg">${msg}</div><div class="btn-row" style="margin-top:6px">${btn}${st!=='none'?`<button class="btn btn-line" data-sheetundo="${esc(id)}">取り消し</button>`:''}</div>`;
}
function member(id){return S.members.find(m=>m.id===id);}
function progressOf(id){ const r=rankRec(id); const nk=NEXT[r.rank]; if(!nk)return {pct:100,done:0,total:0,max:true}; const list=S.criteria[nk]||[]; const done=list.filter(c=>r.checks[c]).length; return {pct:list.length?Math.round(done/list.length*100):0,done,total:list.length,max:false}; }
function openIssues(id){ return rankRec(id).issues.filter(i=>i.status!=='done').length; }
function lastLog(m){ return m.logs.length?[...m.logs].map(l=>l.d).sort().pop():null; }
function sortedMembers(){ const ord={leader:0,subleader:1,regular:2,rookie:3}; return [...S.members].sort((a,b)=>{const ra=ord[rankRec(a.id).rank],rb=ord[rankRec(b.id).rank]; return ra!==rb?ra-rb:String(a.kana||a.name).localeCompare(String(b.kana||b.name),'ja');}); }

// ============ ビュー切替 ============
let _view=localStorage.getItem('crew_view')||'duty';
function switchView(v){
  _view=v; try{localStorage.setItem('crew_view',v);}catch(_){}
  document.querySelectorAll('.subtab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  ['duty','info','rank'].forEach(k=>$('view-'+k).classList.toggle('active',k===v));
  if(v==='duty') ensureDuty();
  if(v==='info'){ renderInfo(); if(!infoUnlocked()) setTimeout(()=>{const i=$('info-pw'); if(i)i.focus();},60); }
  if(v==='rank') renderRank();
}

// ============ クルー情報のロック（パスワード） ============
//   ・クルー情報タブはパスワードを入れた時だけ開く。開いた状態は「このタブを閉じるまで」かつ「10分操作がなければ自動ロック」。
//   ・開錠状態は sessionStorage（端末・タブごと。localStorage に置くと統合アプリの同期で全端末が開いてしまう）。
//   ・パスワードの平文はソースに置かない（公開リポジトリのため）。PBKDF2-SHA256 のハッシュだけを持って照合する。
//   ・ロック中は、クルーランク側の人物パネルでもプロフィール（連絡先・誕生日・メモ等）と編集ボタンを出さない。
//   ※ bumon / ws の管理モードも同じパスワード（同じハッシュ）。変える時は3ファイルとも同じ値に。
const ADMIN_PW_HASH='85682d0460df608730c75fc2551e9917f770309ac61f3c7361514cde5cfce597';
async function checkAdminPw(pw){
  try{
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',enc.encode(String(pw||'')),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('ff-manager::admin-lock::v1'),iterations:200000,hash:'SHA-256'},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('')===ADMIN_PW_HASH;
  }catch(e){ console.error(e); return null; }   // null＝この環境では照合できない（https / localhost 以外）
}
const INFO_UNLOCK_KEY='crew_info_unlock_until', INFO_IDLE_MS=10*60*1000;
let _infoUntilMem=0, _infoWasUnlocked=false, _pwBusy=false;
function _infoUntil(){ let v=_infoUntilMem; try{ v=Math.max(v,+(sessionStorage.getItem(INFO_UNLOCK_KEY)||0)); }catch(_){} return v; }
function _setInfoUntil(t){ _infoUntilMem=t; try{ if(t)sessionStorage.setItem(INFO_UNLOCK_KEY,String(t)); else sessionStorage.removeItem(INFO_UNLOCK_KEY); }catch(_){} }
function infoUnlocked(){ return _infoUntil()>Date.now(); }
function applyInfoLock(){
  const un=infoUnlocked();
  $('info-lock').style.display=un?'none':'';
  $('info-body').style.display=un?'':'none';
  $('info-lock-ico').textContent=un?'':' 🔒';
  if(!un) $('member-list').innerHTML='';
  _infoWasUnlocked=un;
}
function lockInfo(msg){
  _setInfoUntil(0);
  if($('overlay').classList.contains('show')) closeModal();   // 開いている人物パネル／編集フォームも閉じる
  applyInfoLock(); refresh(); if(msg)toast(msg);
}
async function submitInfoPw(){
  if(_pwBusy)return;
  const inp=$('info-pw'), err=$('info-pw-err'), pw=inp.value;
  if(!pw){ inp.focus(); return; }
  _pwBusy=true; $('info-unlock-btn').disabled=true; err.className='lock-err wait'; err.textContent='確認中…';
  const ok=await checkAdminPw(pw);
  _pwBusy=false; $('info-unlock-btn').disabled=false; inp.value=''; err.className='lock-err';
  if(ok===null){ err.textContent='この開き方ではパスワードを確認できません。統合アプリのリンク（https）から開いてください'; return; }
  if(!ok){ err.textContent='⚠ パスワードが違います'; inp.focus(); return; }
  err.textContent=''; _setInfoUntil(Date.now()+INFO_IDLE_MS);
  applyInfoLock(); refresh(); toast('クルー情報を開きました（10分操作がないと自動でロック）');
}
// 操作があるたびに自動ロックまでの時間を延長／時間切れ・画面復帰時にロックを確認
function _infoTouch(){ if(infoUnlocked()) _setInfoUntil(Date.now()+INFO_IDLE_MS); }

function memoRow(id,i){
  const k=kindOf(i), st=i.status;
  const meta=`${esc(fmtD(i.created))} メモ`+(st==='todo'?'・まだ伝えていない':st==='doing'?`・${i.toldAt?esc(fmtD(i.toldAt))+' ':''}伝えた（取り組み中）`:(k==='good'?`・${esc(fmtD(i.toldAt||i.done))} 伝えた`:`・${esc(fmtD(i.done))} 改善できた`));
  const main=st==='todo'?`<button class="btn btn-line btn-sm" data-step="${esc(i.id)}">伝えた</button>`:st==='doing'?`<button class="btn btn-line btn-sm" data-step="${esc(i.id)}" style="color:var(--green);border-color:#bbf7d0">改善できた</button>`:'';
  const back=st==='todo'?'':`<button class="link-btn" data-back="${esc(i.id)}" title="1つ前の状態に戻す">戻す</button>`;
  return `<div class="memo ${st==='done'?'done':''}"><span class="kpill ${k==='good'?'c-good':'c-fix'}">${k==='good'?'良い点':'改善'}</span>
    <div style="flex:1;min-width:0"><div class="tx">${esc(i.text)}</div><div class="meta">${meta}</div></div>
    <div class="acts">${main}${back}<button class="icon-mini" data-delissue="${esc(id)}|${esc(i.id)}" title="削除">🗑</button></div></div>`;
}

        :'<div class="hint" style="padding:8px 2px">まだ伝えていないメモはありません。気づいた時に上の欄から1行で書いておくと、面談の時にここに並びます。</div>'}</div>
    ${doing.length?`<div class="sec"><h3>🏃 伝えて、取り組み中 <span class="chip c-doing">${doing.length}件</span><span class="hint">改善できたらボタンで記録</span></h3>${doing.map(i=>memoRow(id,i)).join('')}</div>`:''}

// 一人分の画面：縦に長い1枚をやめ、4つのタブ（面談メモ／ランク・スキル／プロフィール／記録）に分ける。
// ロック中（クルーランク側から開いた時）は「ランク・スキル」だけを出し、面談メモ・プロフィール・記録は出さない。
function renderPersonHtml(id){
  const m=member(id); if(!m)return '<div class="empty">クルーが見つかりません</div>';
  const r=rankRec(id), rk=rankOf(r.rank), ms=memoStat(id);
  const fx=FANTA.filter(f=>r.fanta[f.k]).map(f=>`<span class="fanta">${f.icon}${esc(f.label)}</span>`).join('');
  const locked=!infoUnlocked();
  const ten=tenure(m.hireDate);
  const head=`<div class="p-head"><div class="avatar" style="background:${rk.color}">${esc((m.name||'?').slice(0,1))}</div>
      <div><div class="nm">${esc(m.name)}<span class="rank-badge" style="background:${rk.bg};color:${rk.color};border:1px solid ${rk.border}">${esc(rk.short)}</span>${fx}</div>${(m.kana||(!locked&&ten))?`<div class="m-kana">${esc(m.kana||'')}${(!locked&&ten)?`${m.kana?'　':''}勤続 ${esc(ten)}`:''}</div>`:''}</div></div>`;
  if(locked) return `<div class="person" data-person="${esc(id)}">${head}
    <div class="lock-note">🔒 面談メモ・プロフィール・記録は「クルー情報」タブでパスワードを入れると表示されます</div>${rankTabHtml(id)}</div>`;
  const ico=e=>`<span class="ico">${e} </span>`;
  const tabs=[['memo',ico('📝')+'面談メモ',ms.fix+ms.good],['rank',ico('🏅')+'ランク・スキル',0],['prof',ico('👤')+'プロフィール',0],['log',ico('🗂')+'記録',0]];
  if(!tabs.some(t=>t[0]===_ptab))_ptab='memo';
  const body=_ptab==='rank'?rankTabHtml(id):_ptab==='prof'?profTabHtml(id):_ptab==='log'?logTabHtml(id):memoTabHtml(id);
  return `<div class="person" data-person="${esc(id)}">${head}
    <div class="ptabs">${tabs.map(([k,l,n])=>`<button type="button" class="ptab ${_ptab===k?'on':''}" data-ptab="${k}">${l}${n?`<span class="cnt">${n}</span>`:''}</button>`).join('')}</div>
    ${body}</div>`;
}
function focusMemoInput(){ setTimeout(()=>{ const i=document.querySelector('#overlay.show [data-memo-input]')||document.querySelector('#rank-detail [data-memo-input]'); if(i)i.focus(); },60); }
function openPerson(id,tab,focus){ if(!infoUnlocked()){ switchView('info'); return; } if(tab)_ptab=tab; _personOpen=id; setModal(`<button class="close-x" data-close>×</button><div id="person-body">${renderPersonHtml(id)}</div>`); if(focus)focusMemoInput(); }
// ---- 面談メモの操作 ----
function addMemo(id,text,kind){ text=(text||'').trim(); if(!text||!member(id))return false; rankRec(id).issues.push({id:uid('i'),text,kind:kind==='good'?'good':'fix',status:'todo',created:today()}); saveS(); refresh(); toast(kind==='good'?'👍 良かった点をメモしました':'🔧 改善点をメモしました'); return true; }
function stepMemo(id,iid){ const i=rankRec(id).issues.find(x=>x.id===iid); if(!i)return; const t=today();
  if(i.status==='todo'){ i.toldAt=t; if(kindOf(i)==='good'){ i.status='done'; i.done=t; } else i.status='doing'; }
  else if(i.status==='doing'){ i.status='done'; i.done=t; }
  saveS(); refresh(); }
function backMemo(id,iid){ const i=rankRec(id).issues.find(x=>x.id===iid); if(!i)return;
  if(i.status==='done'&&kindOf(i)==='fix'){ i.status='doing'; delete i.done; }
  else { i.status='todo'; delete i.done; delete i.toldAt; }
  saveS(); refresh(); }
// 面談後の1タップ記録：まだ伝えていないメモを全部「伝えた」にして、話した内容を面談ログに残す
function tellAll(id){
  const m=member(id), r=rankRec(id); if(!m)return;
  const items=r.issues.filter(i=>i.status==='todo'); if(!items.length)return;
  if(!confirm(`${m.name} さんに、まだ伝えていない ${items.length}件 を面談で伝えましたか？\n\n「OK」で ${items.length}件 を「伝えた」にして、面談ログに記録します。`))return;
  const t=today(), nf=items.filter(i=>kindOf(i)==='fix').length, ng=items.length-nf;
  const lines=items.map(i=>`・${kindOf(i)==='good'?'良い点':'改善'}：${i.text}`).join('\n');
  items.forEach(i=>{ i.toldAt=t; if(kindOf(i)==='good'){ i.status='done'; i.done=t; } else i.status='doing'; });
  m.logs.push({id:uid('l'),d:t,text:`面談で伝えた（${[nf?`改善 ${nf}件`:'',ng?`良い点 ${ng}件`:''].filter(Boolean).join('・')}）\n${lines}`});
  saveS(); refresh(); toast(`${items.length}件を「伝えた」にして、面談ログに記録しました`);
}
function setCrit(id,c,lv){ const r=rankRec(id); if(lv===2){ r.checks[c]=true; delete r.trying[c]; } else if(lv===1){ delete r.checks[c]; r.trying[c]=true; } else { delete r.checks[c]; delete r.trying[c]; } saveS(); refresh(); }
function setCritNote(id,c,text){ const r=rankRec(id); text=String(text||'').trim(); if(text)r.critNote[c]=text; else delete r.critNote[c]; saveS(); }   // 再描画しない（入力中のフォーカスを動かさない）

// ============ クルーランク（俯瞰＋ボード＋選択中の人物パネル） ============
function renderRank(){
  const ms=sortedMembers();
  // 📌 今やること：忘れていても画面を開けば分かるよう、対応が必要な事項を1本の優先順リストに自動抽出
  const todo=[];
  ms.forEach(m=>{
    const r=rankRec(m.id), pg=progressOf(m.id), s=sheetOf(m.id);
    if(s.status==='submitted') todo.push({p:1,tag:'評価する',cls:'t-eval',m,txt:`評価シート提出済み（${daysSince(s.submittedAt)}日前）→ 評価してランクを判断`});
    else if(s.status==='done') todo.push({p:1,tag:'昇格',cls:'t-eval',m,txt:'評価完了 → ランクを上げる'});
    else if(s.status==='handed'&&daysSince(s.handedAt)>=SHEET_NUDGE_DAYS) todo.push({p:2,tag:'回収する',cls:'t-collect',m,txt:`評価シートを渡してから${daysSince(s.handedAt)}日、まだ提出なし → 声かけ`});
    else if(s.status==='none'&&!pg.max&&pg.total>0&&pg.pct>=NEAR_PCT) todo.push({p:pg.pct>=100?2:3,tag:'渡す',cls:'t-hand',m,txt:`${rankOf(NEXT[r.rank]).short}の条件 ${pg.pct}%${pg.pct>=100?'（クリア）':''} → 評価シートを渡す`});
    const d=daysSince(lastLog(m)); if(d===null||d>=NO_TALK_DAYS) todo.push({p:4,tag:'声かけ',cls:'t-talk',m,txt:d===null?'面談の記録がまだない':`最後の面談から${d}日`});
    const mst=memoStat(m.id), un=mst.fix+mst.good; if(un>=1) todo.push({p:5,tag:'面談メモ',cls:'t-issue',m,txt:`まだ伝えていない面談メモが${un}件`});
  });
  todo.sort((a,b)=>a.p-b.p);
  $('rank-dash').innerHTML=S.members.length?`<div class="card todo"><h4>📌 今やること<span class="chip" style="background:#f1f5f9;color:var(--sub)">${todo.length}</span><span class="hint">上から順に。名前タップでその人へ</span></h4>${todo.length?todo.map(t=>`<div class="trow" data-sel="${esc(t.m.id)}"><span class="tag ${t.cls}">${t.tag}</span><b>${esc(t.m.name)}</b><span class="ttxt">${t.txt}</span></div>`).join(''):'<div class="hint" style="padding:6px 0">今は対応が必要なことはありません 🎉</div>'}</div>`:'';
  $('rank-summary').innerHTML=RANKS.map(r=>`<div class="sum" style="background:${r.bg};border-color:${r.border}"><div class="n" style="color:${r.color}">${ms.filter(m=>rankRec(m.id).rank===r.k).length}</div><div class="l" style="color:${r.color}">${esc(r.short)}</div></div>`).join('');
  $('rank-board').innerHTML=RANKS.map(r=>{
    const ins=ms.filter(m=>rankRec(m.id).rank===r.k);
    return `<div class="col" style="background:${r.bg};border-color:${r.border}"><h4 style="color:${r.color}">${esc(r.label)}</h4>
      ${ins.length?ins.map(m=>{ const rr=rankRec(m.id), pg=progressOf(m.id), open=openIssues(m.id), sl=sheetLabel(m.id);
        return `<div class="mchip ${_selId===m.id?'sel':''}" data-sel="${esc(m.id)}"><div class="nm"><span>${esc(m.name)}</span><span class="pct">${pg.max?'MAX':(pg.done?pg.pct+'%':'')}</span></div>
          ${pg.max?'':`<div class="bar"><i style="width:${pg.pct}%;background:${r.color}"></i></div>`}
          ${(FANTA.some(f=>rr.fanta[f.k])||open||sl)?`<div class="fx">${FANTA.filter(f=>rr.fanta[f.k]).map(f=>`<span class="fanta">${f.icon}</span>`).join('')}${sl?`<span class="chip" style="${sl.status==='submitted'?'background:var(--green-lt);color:var(--green)':sl.status==='done'?'background:#f1f5f9;color:var(--sub)':'background:var(--purple-lt);color:var(--purple)'}">📄${sl.status==='handed'?'配布中':sl.status==='submitted'?'提出済':'完了'}</span>`:''}${open?`<span class="chip" style="background:var(--amber-lt);color:var(--amber)" title="まだ伝えていない／取り組み中の面談メモ">メモ${open}</span>`:''}</div>`:''}</div>`; }).join('')
      :`<div class="hint" style="text-align:center;padding:8px 0">—</div>`}</div>`;
  }).join('');
  if(_selId&&!member(_selId))_selId=null;
  $('rank-detail').innerHTML=_selId?`<div class="card">${renderPersonHtml(_selId)}</div>`:`<div class="empty">上の「今やること」やボードで名前をタップすると、その人のランク・昇格条件・業務スキルをここで操作できます（面談メモ・プロフィール・記録は「クルー情報」でパスワードを入れると表示されます）。${S.members.length?'':'<br>まず「クルー情報」でクルーを登録してください。'}</div>`;
}
// ---- 操作（誤タップ防止：ランク変更／ファンタジスタ解除は確認、取得日は保持） ----
function setRank(id,k){ const r=rankRec(id); if(r.rank===k)return; const m=member(id); if(!confirm(`${m.name} のランクを\n${rankOf(r.rank).short} → ${rankOf(k).short}\nに変更しますか？`))return; r.history.push({d:today(),from:r.rank,to:k}); r.rank=k;
  if(r.sheet&&r.sheet.status&&r.sheet.status!=='none'){ r.sheetHistory.push(Object.assign({},r.sheet,{closedAt:today(),promotedTo:k})); }   // 評価シートは履歴へ。次ランク用に切り替え
  r.sheet=null; saveS(); refresh(); toast(`${m.name} → ${rankOf(k).short}`); }
function toggleCheck(id,c,on){ const r=rankRec(id); if(on)r.checks[c]=true; else delete r.checks[c]; saveS(); refresh(); }
function toggleFanta(id,k){ const r=rankRec(id); const f=FANTA.find(x=>x.k===k); if(r.fanta[k]){ if(!confirm(`${member(id).name} の「${f.label}ファンタジスタ」を外しますか？\n（取得日 ${fmtD(r.fantaDate[k])||'—'} は記録として保持されます）`))return; r.fanta[k]=false; } else { r.fanta[k]=true; if(!r.fantaDate[k])r.fantaDate[k]=today(); } saveS(); refresh(); }
function delIssue(id,iid){ const r=rankRec(id); const i=r.issues.find(x=>x.id===iid); if(!i)return; if(!confirm(`面談メモ「${i.text}」を削除しますか？`))return; r.issues=r.issues.filter(x=>x.id!==iid); saveS(); refresh(); }
function addLog(id,text){ const m=member(id); text=(text||'').trim(); if(!m||!text)return false; m.logs.push({id:uid('l'),d:today(),text}); saveS(); refresh(); toast('記録しました'); return true; }
function delLog(id,lid){ const m=member(id); if(!m)return; const l=m.logs.find(x=>x.id===lid); if(!l)return; if(!confirm(`${fmtD(l.d)} の記録を削除しますか？`))return; m.logs=m.logs.filter(x=>x.id!==lid); saveS(); refresh(); }
function openCriteria(){
  setModal(`<button class="close-x" data-close>×</button><h2>⚙️ 昇格条件を編集</h2><div class="muted" style="margin-bottom:10px">1行に1条件。チェック済みの条件は文言が同じなら引き継がれます。</div>
    ${['regular','subleader','leader'].map(k=>`<div class="field"><label>${esc(rankOf(k).short)}への昇格条件</label><textarea id="crit-${k}" style="min-height:110px">${esc((S.criteria[k]||[]).join('\n'))}</textarea></div>`).join('')}
    <div class="btn-row"><button class="btn btn-ghost" data-critdefault>初期値に戻す</button><button class="btn btn-pri" data-critsave>保存</button></div>`);
}
function saveCriteria(){ ['regular','subleader','leader'].forEach(k=>{ S.criteria[k]=($('crit-'+k).value||'').split('\n').map(s=>s.trim()).filter(Boolean); }); saveS(); closeModal(); refresh(); toast('昇格条件を保存しました'); }

// ============ モーダル ============
function setModal(html){$('modal').innerHTML=html;$('overlay').classList.add('show');$('modal').scrollTop=0;}
function closeModal(){$('overlay').classList.remove('show');_personOpen=null;}

// ============ イベント（ページ全体で1本の委譲：人物パネルは情報／ランクどちらでも同じ動作） ============
const sp=v=>{const s=String(v);const i=s.indexOf('|');return [s.slice(0,i),s.slice(i+1)];};
document.addEventListener('click',e=>{
  const t=e.target;
  const st=t.closest('.subtab'); if(st){switchView(st.dataset.view);return;}
  if(t.closest('[data-close]')){closeModal();return;}
  const pid=()=>{ const p=t.closest('.person'); return p?p.dataset.person:null; };
  // 一覧・スキル表
  const mm=t.closest('[data-memo]'); if(mm){openPerson(mm.dataset.memo,'memo',true);return;}
  const orr=t.closest('[data-open-rank]'); if(orr){ if(!_skillEdit)openPerson(orr.dataset.openRank,'rank'); return; }
  const iv=t.closest('[data-infoview]'); if(iv){_infoView=iv.dataset.infoview;_skillEdit=false;renderInfo();return;}
  const ifl=t.closest('[data-infofilter]'); if(ifl){_infoFilter=ifl.dataset.infofilter;renderInfo();return;}
  if(t.id==='skill-edit-btn'){_skillEdit=!_skillEdit;renderInfo();return;}
  if(t.id==='edit-skills-btn'){openSkills();return;}
  if(t.closest('[data-skillsave]')){saveSkills();return;}
  if(t.closest('[data-skilldefault]')){$('skills-text').value=DEFAULT_SKILLS.join('\n');return;}
  const sc=t.closest('[data-skcell]'); if(sc){ if(!_skillEdit)return;   // 編集中だけ：その場で切り替え（表を描き直さない＝横スクロール位置を保つ）
    const id=sc.dataset.skcell, i=+sc.dataset.si, s=S.skills[i], nx=((rankRec(id).skill[s]||0)+1)%3; setSkill(id,s,nx);
    sc.className='sk lv'+nx; sc.textContent=LV_MARK[nx]; const fc=document.querySelector(`[data-skcount="${i}"]`); if(fc)fc.textContent=S.members.filter(m=>(rankRec(m.id).skill[s]||0)===2).length+'人'; return; }
  // 人物画面（タブ・面談メモ・3段階）
  const pt=t.closest('[data-ptab]'); if(pt){_ptab=pt.dataset.ptab;refresh();return;}
  const mk=t.closest('[data-memokind]'); if(mk){ _memoKind=mk.dataset.memokind; const p=mk.closest('.person'); if(p){ p.querySelectorAll('[data-memokind]').forEach(b=>b.classList.toggle('on',b.dataset.memokind===_memoKind)); const i=p.querySelector('[data-memo-input]'); if(i)i.focus(); } return; }
  if(t.closest('[data-addmemo]')){ const p=t.closest('.person'), i=p&&p.querySelector('[data-memo-input]'); if(i)submitMemo(i); return; }
  const stp=t.closest('[data-step]'); if(stp){stepMemo(pid(),stp.dataset.step);return;}
  const bk=t.closest('[data-back]'); if(bk){backMemo(pid(),bk.dataset.back);return;}
  const tl=t.closest('[data-told]'); if(tl){tellAll(tl.dataset.told);return;}
  const cr=t.closest('[data-crit]'); if(cr){setCrit(pid(),cr.dataset.crit,+cr.dataset.lv);return;}
  const sk=t.closest('[data-skill]'); if(sk){setSkill(pid(),sk.dataset.skill,+sk.dataset.lv);refresh();return;}
  const ed=t.closest('[data-edit]'); if(ed){openMemberForm(ed.dataset.edit);return;}
  const op=t.closest('[data-open]'); if(op){openPerson(op.dataset.open);return;}
  const se=t.closest('[data-sel]'); if(se){ _selId=se.dataset.sel; if(_view!=='rank'){openPerson(_selId);return;} renderRank(); const d=$('rank-detail'); if(d)d.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const sr=t.closest('[data-setrank]'); if(sr){const [id,k]=sp(sr.dataset.setrank);setRank(id,k);return;}
  const fa=t.closest('[data-fanta]'); if(fa){const [id,k]=sp(fa.dataset.fanta);toggleFanta(id,k);return;}
  const sa=t.closest('[data-sheetadv]'); if(sa){sheetAdvance(sa.dataset.sheetadv);return;}
  const su=t.closest('[data-sheetundo]'); if(su){sheetUndo(su.dataset.sheetundo);return;}
  const di=t.closest('[data-delissue]'); if(di){const [id,iid]=sp(di.dataset.delissue);delIssue(id,iid);return;}
  const dl=t.closest('[data-dellog]'); if(dl){const [id,lid]=sp(dl.dataset.dellog);delLog(id,lid);return;}
  const sm=t.closest('[data-savemember]'); if(sm){saveMemberForm(sm.dataset.savemember||'');return;}
  const dm=t.closest('[data-delmember]'); if(dm){deleteMember(dm.dataset.delmember);return;}
  if(t.closest('[data-doimport]')){doImport();return;}
  if(t.closest('[data-critsave]')){saveCriteria();return;}
  if(t.closest('[data-critdefault]')){ ['regular','subleader','leader'].forEach(k=>{$('crit-'+k).value=DEFAULT_CRITERIA[k].join('\n');}); return; }
  const dp=t.closest('#f-days label'); if(dp){ setTimeout(()=>dp.classList.toggle('on',dp.querySelector('input').checked),0); return; }
  if(t.id==='info-lock-btn'){lockInfo('🔒 クルー情報をロックしました');return;}
  if(t.id==='add-member-btn'){openMemberForm(null);return;}
  if(t.id==='import-btn'||t.id==='tidy-open-btn'){openImport();return;}
  if(t.id==='edit-criteria-btn'){openCriteria();return;}
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-chk]'); if(c){const [id,crit]=sp(c.dataset.chk);toggleCheck(id,crit,c.checked);return;}
  const n=e.target.closest('[data-critnote]'); if(n){const [id,crit]=sp(n.dataset.critnote);setCritNote(id,crit,n.value);}   // 昇格条件のひとこと：欄を離れた時に保存
});
// 入力を登録して欄を空にする。先に change を流して「入力途中の退避」を消す（消さないと描き直し後に同じ文字が戻ってしまう）
function _commitInput(inp){ const v=inp.value; inp.value=''; try{ inp.dispatchEvent(new Event('change',{bubbles:true})); }catch(_){} return v; }
function submitMemo(inp){ const id=inp.dataset.memoInput; if(!inp.value.trim()){ inp.focus(); return; } const v=_commitInput(inp); if(addMemo(id,v,_memoKind)) focusMemoInput(); }
// Enterで即登録（面談メモ／面談ログ）。日本語の変換確定の Enter では登録しない
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  const t=e.target; const panel=t.closest('.person'); if(!panel)return;
  const id=panel.dataset.person||null; if(!id)return;
  if(t.hasAttribute('data-memo-input')){ e.preventDefault(); submitMemo(t); }
  else if(t.hasAttribute('data-log-input')){ e.preventDefault(); if(!t.value.trim())return; const v=_commitInput(t); if(addLog(id,v)) setTimeout(()=>{ const i=document.querySelector('#overlay.show [data-log-input]')||document.querySelector('#rank-detail [data-log-input]'); if(i)i.focus(); },60); }
});
$('info-q').addEventListener('input',renderInfo);
$('info-lock-form').addEventListener('submit',e=>{ e.preventDefault(); submitInfoPw(); });
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
// 店舗切替／多タブ同期：自分のデータ・店舗IDの変化で再描画。店舗が変わったら担当業務も読み直す
window.addEventListener('storage',e=>{ if(e.key===dataKey()){loadS();refresh();} else if(e.key==='current_store_id'||e.key==='ffv6_current'){ loadS(); reloadDuty(); refresh(); } else if(/^(ws_v1|bumon_v1)/.test(e.key||'')&&!/_backup_|_snap_/.test(e.key)){ if(_view==='info')renderInfo(); } });   // WS・担当業務の名前が変わったら「名前の整理」の案内を更新

loadS();
switchView(['duty','info','rank'].includes(_view)?_view:'duty');
</script>
</body>
</html>
