<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新しいシステム：ワークスケジュールを2台で同時に使う試験</title>
<style>
body{font-family:-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:16px;line-height:1.6}
h1{font-size:18px;margin:0 0 4px} .sub{font-size:13px;color:#64748b;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e8f0;font-size:13px}
th{background:#f8fafc;text-align:left;padding:6px 10px} td{padding:6px 10px;border-top:1px solid #e2e8f0;vertical-align:top}
.ok{color:#16a34a;font-weight:700} .ng{color:#dc2626;font-weight:700} #sum{font-size:16px;font-weight:800;margin:10px 0}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0} .frames div{font-size:12px;color:#64748b}
iframe{width:100%;height:420px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
</style>
</head>
<body>
<h1>🧪 ワークスケジュールを2台で同時に使う試験（新しい画面そのものを2つ並べて動かす）</h1>
<div class="sub">下の2つは、新しいワークスケジュールの画面そのものです（端末A・端末B のつもり）。ネットにつながない試験用の保存先を2台で共有し、片方ずつ「ネットが切れた・古い状態のまま」にして操作します。名前は全部 作り物です。本物のデータにも Firebase にもさわりません。</div>
<div id="sum">試験中…（1〜2分）</div>
<div class="frames"><div>端末A<iframe id="fa"></iframe></div><div>端末B<iframe id="fb"></iframe></div></div>
<table><thead><tr><th style="width:50px">番号</th><th>確かめたこと</th><th style="width:70px">結果</th><th>くわしく</th></tr></thead><tbody id="rows"></tbody></table>
<script src="core.js"></script>
<script src="wsspec.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id), J=JSON.stringify, sleep=ms=>new Promise(r=>setTimeout(r,ms)), R=[];
  function check(no,what,ok,detail){ R.push({no,what,ok:!!ok,detail:detail||''}); const tr=document.createElement('tr'); tr.innerHTML=`<td>${no}</td><td>${what}</td><td class="${ok?'ok':'ng'}">${ok?'○ 合格':'× 不合格'}</td><td>${String(detail||'').replace(/</g,'&lt;')}</td>`; $('rows').appendChild(tr); }
  const pad=n=>(n<10?'0':'')+n, dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const K=dk(new Date()), K2=dk(new Date(Date.now()+864e5));
  const T=(id,text,hour)=>({id,text,hour,min:0,endHour:hour+1,endMin:null,tan:'both',cats:[],zones:[],memo:'',manual:'',checklist:[],done:false,carryOvers:[],order:0,createdAt:'2026-10-01T00:00:00.000Z'});
  const prof=()=>({points:10,totalEarned:10,totalCompleted:1,titles:[],items:[],completedCats:[],catCounts:{},monthlyEarned:10,currentMonth:K.slice(0,7),rankHistory:[],companions:[],unseenCompanions:[],taskStreak:0,taskStreakBest:0,viewedItems:[],viewedCompanions:[],journeySeason:1,journeyBaseEarned:0,seasonHistory:[],stamps:[],foodInventory:[]});
  const st={tasks:{[K]:[T('t1','トイレ清掃',9),T('t2','床のモップがけ',10),T('t3','ゴミ出し',11)],[K2]:[T('u1','あしたの品出し',9)]},recurringTasks:[],staff:['見本 花子','見本 太郎'],categories:['清掃','補充'],presets:[],gameProfiles:{'見本 花子':prof(),'見本 太郎':prof()},
    gameSettings:{pointsBase:2,pointsTimeBonus:2,pointsNoCarryBonus:1,pointsChecklistBonus:1,gachaCost:50,rarityRates:{common:.6,rare:.3,super:.08,legendary:.02}},customTitles:[],customItems:[],
    requestTasks:[{id:'rq1',text:'POPの貼り替え',description:'',requestedBy:'見本 太郎',tan:'both',estimatedSeconds:null,dueDate:'',points:3,requestedAt:'2026-10-01T00:00:00.000Z',done:false,carryOvers:[]}],
    breakSettings:{suggestedMinutes:15,warnIfNextTaskWithinMinutes:15},breakLogs:[],activeBreak:null,priorityTasks:[],amUsed:true};
  const stores=[{id:'w1',name:'試験の店（大町）',createdAt:1}];
  const load=(f,url)=>new Promise(res=>{ f.onload=()=>res(f.contentWindow); f.src=url; });
  try{
    const cloud=new V2.MemoryCloud();
    const mk=async(fid,name,seed)=>{ const be=cloud.device(); const store=new V2.Store({backend:be,space:'T',device:name,kv:new V2.MemKV(),snapshot:false}); const win=await load($(fid),'ws/index.html?embedded=1&mem=1&wait=1&t='+Date.now()); win.alert=()=>{}; win.confirm=()=>true; win.prompt=()=>null; await win.__v2go(Object.assign({store,stores,current:'w1'},seed||{})); for(let i=0;i<100&&!win.__v2ready;i++)await sleep(50); return {be,store,win,name,ev:s=>win.eval(s)}; };
    const A=await mk('fa','端末A',{state:J(st)});
    const B=await mk('fb','端末B');
    const sync=async()=>{ for(let i=0;i<3;i++){ for(const d of [A,B]){ if(d.be.online)await d.store.settle(10000); } await sleep(150); } await sleep(400); };
    const nz=s=>{ const o=JSON.parse(s); delete o._modifiedAt; const z=x=>{ if(x&&typeof x==='object'){ if(Array.isArray(x))x.forEach(z); else { delete x._at; Object.keys(x).forEach(k=>z(x[k])); } } }; z(o); return J(o); };
    const same=()=>nz(A.ev('JSON.stringify(state)'))===nz(B.ev('JSON.stringify(state)'));
    const off=()=>{ A.be.setOnline(false); B.be.setOnline(false); }, on=()=>{ A.be.setOnline(true); B.be.setOnline(true); };
    const task=(d,id,key)=>JSON.parse(d.ev(`JSON.stringify((state.tasks[${J(key||K)}]||[]).find(t=>t.id===${J(id)})||null)`));
    const setT=(d,id,patch,key)=>d.ev(`(()=>{ const t=state.tasks[${J(key||K)}].find(t=>t.id===${J(id)}); Object.assign(t,${J(patch)}); saveState(); render(); })()`);
    const addT=(d,t,key)=>d.ev(`(()=>{ const k=${J(key||K)}; if(!state.tasks[k])state.tasks[k]=[]; state.tasks[k].push(${J(t)}); saveState(); render(); })()`);
    const ids=(d,key)=>d.ev(`(state.tasks[${J(key||K)}]||[]).map(t=>t.id).sort().join(',')`);
    for(const d of [A,B]) d.ev('window.__ft0=amFireTop; amFireTop=function(){ return null; }');   // 5.8：🔥 の案内（カードの名前のボタンが灰色になる）は 試験71 で試す。名前のボタンを押す ほかの試験（35・58・64 など）は、案内を止めた形（5.7 と同じ）で流す
    await sync();
    check('0','はじめ：B に A と同じデータが届いている',same()&&ids(B)==='t1,t2,t3',ids(B));

    off(); setT(A,'t1',{done:true,completedBy:'見本 花子'}); setT(B,'t2',{done:true,completedBy:'見本 太郎'}); on(); await sync();
    check('1','同じ日の別のタスクを、2台が同時に完了にした → 両方残る',task(A,'t1').done&&task(A,'t2').done&&task(B,'t1').done&&task(B,'t2').done&&same(),`A:${task(A,'t1').done}/${task(A,'t2').done} B:${task(B,'t1').done}/${task(B,'t2').done}`);
    off(); setT(A,'t3',{memo:'Aのメモ'}); setT(B,'t3',{hour:15,endHour:16}); on(); await sync();
    check('2','同じタスクの別の欄を同時に変えた → 両方残る',task(A,'t3').memo==='Aのメモ'&&task(A,'t3').hour===15&&task(B,'t3').memo==='Aのメモ'&&same(),J({memo:task(B,'t3').memo,hour:task(B,'t3').hour}));
    off(); setT(A,'t3',{text:'先に入れた名前'}); await sleep(30); setT(B,'t3',{text:'後から入れた名前'}); B.be.setOnline(true); await B.store.settle(); A.be.setOnline(true); await sync();
    const c=A.win.__v2.coll, ch=await c.changes(1), le=ch.find(x=>x.lost), h=le?await c.historyOf(le.id,le.h||le.rev):null;
    check('3','同じ欄を同時に変えた → あとから入力したほうが残り、負けた入力は履歴に残る',task(A,'t3').text==='後から入れた名前'&&task(B,'t3').text==='後から入れた名前'&&!!h&&/先に入れた名前/.test(J(h))&&same(),task(A,'t3').text+'・履歴 '+(h?'あり':'なし'));
    off(); addT(A,T('a1','Aが足したタスク',13)); setT(B,'t3',{done:true,completedBy:'見本 太郎'}); on(); await sync();
    check('4','A がタスクを足し、同時に B が同じ日の別のタスクを完了にした → 両方残る',!!task(A,'a1')&&!!task(B,'a1')&&task(A,'t3').done&&same(),ids(B));
    off(); addT(A,T('a2','Aがもう1つ足した',14)); addT(B,T('b1','Bが足したタスク',16)); on(); await sync();
    check('5','同じ日に、2台がそれぞれタスクを足した → 両方残る',!!task(A,'b1')&&!!task(B,'a2')&&same(),ids(A));
    off(); setT(A,'t1',{memo:'今日'}); setT(B,'u1',{memo:'あした'},K2); on(); await sync();
    check('6','別の日のタスクを同時に変えた → 両方残る',task(B,'t1').memo==='今日'&&task(A,'u1',K2).memo==='あした'&&same());
    B.be.setOnline(false); A.ev(`state.tasks[${J(K)}]=state.tasks[${J(K)}].filter(t=>t.id!=='a2'); saveState(); render();`); await sync(); setT(B,'t2',{memo:'Bのメモ'}); B.be.setOnline(true); await sync();
    check('7','A がタスクを消し、古い状態の B が別のタスクを変えて保存 → 消したタスクは戻らない。B の入力は残る',!task(A,'a2')&&!task(B,'a2')&&task(A,'t2').memo==='Bのメモ'&&same(),ids(B));
    B.be.setOnline(false); A.ev(`state.tasks[${J(K)}]=state.tasks[${J(K)}].filter(t=>t.id!=='b1'); saveState(); render();`); await sync(); setT(B,'b1',{memo:'消されたのを知らずに'}); B.be.setOnline(true); await sync();
    check('8','A がタスクを消し、古い状態の B がそのタスクを変えた → 消したまま',!task(A,'b1')&&!task(B,'b1')&&same(),ids(B));

    const wid=A.ev('amWorks()[0].id'), wid2=A.ev('amWorks()[1].id'), n=(d,id)=>d.ev(`((state.areaChecks||{})[${J(id)}]||[]).length`);
    off(); A.win.amRecord(wid,'見本 花子'); B.win.amRecord(wid2,'見本 太郎'); on(); await sync();
    check('9','売場マップ：別の作業の点検を、2台が同時に記録 → 両方残る',n(A,wid)===1&&n(A,wid2)===1&&n(B,wid)===1&&n(B,wid2)===1&&same(),`A:${n(A,wid)}/${n(A,wid2)} B:${n(B,wid)}/${n(B,wid2)}`);
    off(); A.win.amRecord(wid,'見本 花子'); B.win.amRecord(wid,'見本 太郎'); on(); await sync();
    check('10','売場マップ：同じ作業の点検を、2台が同時に記録 → 2件とも残る',n(A,wid)===3&&n(B,wid)===3&&same(),`A:${n(A,wid)} B:${n(B,wid)}`);
    off(); A.ev(`state.requestTasks.push({id:'rq2',text:'Aが足した依頼',description:'',requestedBy:'見本 花子',tan:'both',estimatedSeconds:null,dueDate:'',points:3,requestedAt:'2026-10-05T00:00:00.000Z',done:false,carryOvers:[]}); saveState();`); B.ev(`state.requestTasks.find(r=>r.id==='rq1').done=true; saveState();`); on(); await sync();
    check('11','依頼：A が依頼を足し、同時に B が別の依頼を完了にした → 両方残る',A.ev('state.requestTasks.length')===2&&B.ev('state.requestTasks.length')===2&&A.ev(`state.requestTasks.find(r=>r.id==='rq1').done`)===true&&same());
    off(); A.ev(`state.staff.push('試験 次郎'); state.staff.sort(); saveState();`); B.ev(`state.staff.push('試験 三郎'); state.staff.sort(); saveState();`); on(); await sync();
    check('12','従業員の一覧：2台がそれぞれ1人足した → 2人とも残る',A.ev('state.staff.length')===4&&B.ev('state.staff.length')===4&&same(),'人数 '+B.ev('state.staff.length'));
    off(); A.ev(`state.gameProfiles['見本 花子'].points+=5; saveState();`); B.ev(`state.gameProfiles['見本 太郎'].points+=7; saveState();`); on(); await sync();
    check('13','ポイント：別の人のポイントを2台が同時に足した → 両方残る',A.ev(`state.gameProfiles['見本 花子'].points`)===15&&A.ev(`state.gameProfiles['見本 太郎'].points`)===17&&B.ev(`state.gameProfiles['見本 花子'].points`)===15&&same());

    // 古い状態の端末が、あとから保存（FF で れんさんが報告した形と同じ）
    B.be.setOnline(false);
    setT(A,'t1',{text:'新しい名前のタスク',hour:8,endHour:9,memo:'Aが直した'}); addT(A,T('a9','Aが足した大事なタスク',17)); A.ev(`state.recurringTasks.push(Object.assign(${J(T('rt9','毎日の作業',7))},{recurringDows:[0,1,2,3,4,5,6]})); saveState();`); await sync();
    B.ev('saveState()'); setT(B,'t2',{done:false});
    B.be.setOnline(true); await sync();
    check('14','A がタスクを直し・足した → 古い状態の B が後から保存 → A の入力は1つも消えない',task(A,'t1').text==='新しい名前のタスク'&&task(A,'t1').hour===8&&!!task(A,'a9')&&A.ev('state.recurringTasks.length')===1&&task(B,'t1').text==='新しい名前のタスク'&&!!task(B,'a9')&&task(A,'t2').done===false&&same(),`名前 ${task(B,'t1').text}・足したタスク ${task(B,'a9')?'あり':'なし'}`);
    const mA=A.ev('state._modifiedAt'), cnt0=cloud.writes; B.ev('saveState()'); await sync();
    check('15','何も変えずに保存しても、ネット上には何も書かない（最終保存の時刻は端末ごと）',cloud.writes===cnt0&&A.ev('state._modifiedAt')===mA,'書いた文書 '+(cloud.writes-cnt0)+' 個');
    // ---------- 番号（やる順）：2026-10-11 段1。保存するのは作業ごとの seq（並びの位置）だけ。画面の番号は保存しない ----------
    const DEF=JSON.parse(A.ev('JSON.stringify(DEFAULT_WORKS.map(w=>w.id))'));
    const ord=d=>d.ev('amOrdered().map(w=>w.id).join(",")');
    const numOf=(d,id)=>d.ev(`amNums()[${J(id)}]`);
    const seqs=d=>JSON.parse(d.ev('JSON.stringify((Array.isArray(state.amWorks)?state.amWorks:[]).map(w=>[w.id,typeof w.seq==="number"?w.seq:null]))'));
    const seqOf=(d,id)=>{ const p=seqs(d).find(x=>x[0]===id); return p?p[1]:undefined; };
    const mv=(d,id,pos,opt)=>JSON.parse(d.ev(`JSON.stringify(amMoveTo(${J(id)},${pos},${J(opt||{})}))`));
    const changed=(a,b)=>b.filter(p=>{ const q=a.find(x=>x[0]===p[0]); return !q||q[1]!==p[1]; });
    const wk=(d,id)=>JSON.parse(d.ev(`JSON.stringify(amWork(${J(id)})||null)`));
    const stat=d=>d.ev(`(()=>{ const base=new Date(); base.setHours(0,0,0,0); return JSON.stringify([3,8.99,9,12,14.9,15,20.99,21,26.5].map(h=>amWorks().slice().sort((a,b)=>a.id<b.id?-1:1).map(w=>{ const s=amStatus(w,base.getTime()+h*3600000); return [w.id,s.st,s.lv,s.deadline||0]; }))); })()`);
    A.ev('isAdmin=true'); B.ev('isAdmin=true');
    await sync();
    { const key=A.ev('STORAGE_KEY'), raw0=A.ev(`localStorage.getItem(${J(key)})`), w0=cloud.writes, st0=stat(A);
      const first=ord(A), nn=DEF.map(id=>numOf(A,id)).join(',');
      A.ev(`amOpenWorks(); amSetPeek('yu'); amSetPeek('all'); amMoveStart('coffee'); amMoveBy('cancel'); amMoveStart('coffee'); amRowTap('coffee'); amCloseSheet(); renderMapView(); amOpenArea('toilet'); amCardOthers(); amCloseSheet(); amOpenHelp(); amCloseSheet(); amCellTap('soup'); amCloseSheet(); amFToggle(); amFToggle(); amToggleDone(); amToggleDone();`);
      const same1=mv(A,DEF[0],1);                                   // 同じ場所へ「動かす」＝何も書かない
      await sync();
      check('16','番号：1件も保存していない時は、登録の順のまま 1〜17番。開いただけ・表を開いただけ・動かしかけて やめただけでは、何も保存しない',
        first===DEF.join(',')&&nn===DEF.map((x,i)=>i+1).join(',')&&same1===null&&!A.ev('Array.isArray(state.amWorks)')&&A.ev(`localStorage.getItem(${J(key)})`)===raw0&&cloud.writes===w0&&stat(A)===st0,
        `並び ${first===DEF.join(',')?'登録の順':'ちがう'}・書いた文書 ${cloud.writes-w0} 個・登録の写し ${A.ev('Array.isArray(state.amWorks)')?'できた':'なし'}`);
    }
    { const o1=A.ev(`amOrdered(null,[{id:'a'},{id:'b',pri:1},{id:'c',pri:3},{id:'d'},{id:'e',pri:3}]).map(w=>w.id).join(',')`);
      const o2=A.ev(`amOrdered(null,[{id:'x',seq:3000},{id:'b',pri:3},{id:'y',seq:1000},{id:'z2',seq:2000},{id:'z1',seq:2000},{id:'n'},{id:'s',seq:'5'},{id:'l',pri:1},{id:'q',seq:NaN}]).map(w=>w.id).join(',')`);
      const o3=A.ev(`amOrdered('yu',[{id:'a',seq:1000,seqYu:9000},{id:'b',seq:2000},{id:'c',seq:3000}]).map(w=>w.id).join(',')+'/'+amOrdered(null,[{id:'a',seq:1000,seqYu:9000},{id:'b',seq:2000},{id:'c',seq:3000}]).map(w=>w.id).join(',')`);
      check('17','番号を読む決まり：seq の小さい順 → 同じ数は id の順 → seq 無しは その後ろに「今までの 高 → 中 → 低 → 登録の順」。数字でない seq は「無し」と読む（あとで足す 時間帯ごとの欄も読める）',
        o1==='c,e,a,d,b'&&o2==='y,z1,z2,x,b,n,s,q,l'&&o3==='b,c,a/a,b,c',o1+'｜'+o2+'｜'+o3); }
    { const o=A.ev(`(()=>{ const ws=[{id:'a',seq:1000},{id:'b',seq:2000},{id:'c',seq:3000},{id:'d',seq:4000},{id:'e',seq:5000}], num=amNums(null,ws);
        const sts={a:{st:'soon',min:900},b:{st:'fire',lv:1,min:5},c:{st:'fire',lv:3,min:999},d:{st:'done'},e:{st:'todo'}};
        return ws.slice().reverse().sort((x,y)=>amCmp(x,y,sts,num)).map(w=>num[w.id]+w.id).join(','); })()`);
      check('18','並び：状態（おくれ → そろそろ → これから → 済）→ 番号の小さい順。🔥 の数・最後の記録の古さでは動かない（2番の 🔥1つ が、3番の 🔥3つ より先。1番の そろそろ は その後）',o==='2b,3c,1a,5e,4d',o); }
    { const st0=stat(A), r=mv(A,'stock_red',2), s=seqs(A); await sync();
      const exp=DEF.filter(x=>x!=='stock_red'); exp.splice(1,0,'stock_red');
      check('19','初めて動かした時：その時の並び全部を 1000 きざみで書く（全部の作業に書くのは この時だけ）。2台の番号が同じ',
        r&&r.all===true&&r.n===17&&s.length===17&&s.every(p=>p[1]%1000===0&&p[1]>0)&&ord(A)===exp.join(',')&&ord(B)===exp.join(',')&&numOf(B,'stock_red')===2&&same(),`書いた作業 ${r&&r.n} 件・品出し（赤ゾーン）は ${numOf(B,'stock_red')}番`);
      check('20','番号を付けても、今までの 🔥 の出方（作業ごとの状態・ぬけた回数・しめきり）は変わらない',stat(A)===st0&&stat(B)===st0); }
    { const b=seqs(A), r=mv(A,'coffee',1), a=seqs(A), c=changed(b,a); await sync();
      check('21','2回目からは、動かした1件だけを書く（前と後ろの真ん中の数）',r&&r.all===false&&r.n===1&&c.length===1&&c[0][0]==='coffee'&&c[0][1]===500&&numOf(A,'coffee')===1&&numOf(B,'coffee')===1&&same(),J(c)); }
    { let all=0, one=0, last=null; const ids=['trash','supply','copy','atm','tobacco','counter','face_ff','outside','floor_red','face_red','floor_blue','face_blue'];
      for(const id of ids){ const b=seqs(A), r=mv(A,id,1), c=changed(b,seqs(A)); if(r&&r.all){ all++; last=id; if(c.length<2)all=99; } else if(r&&r.n===1&&c.length===1) one++; else all=99; if(all)break; }
      const s=seqs(A); await sync();

          `外して足す：${J(o.p1b)}→${o.add1}件・登録の数 ${J(o.n1)}｜もう一度見る：登録ずみ ${o.p1c[0]}・✓ ${o.p1c[1]}・「${o.p1c[2]}」→ ${o.add2}件→ もう一度 ${o.add3}件・合計 ${J(o.n2)}・id の形 ${o.ids}・欄 ${o.shape}｜${J(o.detail)}｜足した直後の 🔥 ${J(o.fires)}（鍵 ${o.fireKeys}）｜店が同じ名前を登録ずみ：足した ${o.manual[0]}件・同じ名前 ${o.manual[1]}件`);
        checkL('96x3','【見本から足す・5 レジの アラートリスト／11 廃棄】5：作業の説明に「レジの 画面の 右下あたりに 出る アラートリストを 確かめる」・英語・ネパール語つき（右下・दायाँ）・朝と夕方の 2回・確認項目 2つ・ALIOT の 言葉は 入れない。11：外した数（0でも えらべる＝0 を 押すと 記録される・記録に 0 が 残る）・記録の 10分後に「奥の 見直し」が 1件 出る（9分後は まだ 出ない）・英語・ネパール語つき。2台目に 届く・もう一度 足しても 入らない・古い版にも そのまま 届く',[
            ['1:o.add5===1',o.add5===1],
            ['2:J(o.i5)===J([\'["07:30","16:30"]\',true,true,true,2,false]',J(o.i5)===J(['["07:30","16:30"]',true,true,true,2,false])],
            ['3:J(o.q)===J([true,0,true])',J(o.q)===J([true,0,true])],
            ['4:o.old[0]===true',o.old[0]===true],
            ['5:o.old[1]===true',o.old[1]===true],
            ['6:o.add11===1',o.add11===1],
            ['7:J(o.i11)===J([\'[{"k":"a","label":"外した 数","unit":"個","min',J(o.i11)===J(['[{"k":"a","label":"外した 数","unit":"個","min":0}]','["奥の 見直し（もう一度、棚の奥まで）",10,10]',4,2,true,true,true,true])],
            ['8:o.card11[0]===1',o.card11[0]===1],
            ['9:o.card11[1]===true',o.card11[1]===true],
            ['10:o.card11[2]===1',o.card11[2]===1],
            ['11:J(o.rec0)===J([\'{"a":0}\',true])',J(o.rec0)===J(['{"a":0}',true])],
            ['12:o.after[0]===0',o.after[0]===0],
            ['13:o.after[1].length===1',o.after[1].length===1],
            ['14:/奥の 見直し/.test(o.after[1][0][0]),',/奥の 見直し/.test(o.after[1][0][0]),]],
          `5：${J(o.i5)}｜11：${J(o.i11)}・数字の欄 ${J(o.card11)}・記録 ${J(o.rec0)}・9分後 ${o.after[0]}件／11分後 ${J(o.after[1])}｜2台目：${J(o.q)}・古い版：${J(o.old)}`);
        P.close(); Q.close(); O.close();
      });
      /* ===== 96y：おくれの音（新しい 🔥 が出た時だけ 短い音・60秒に 1回・開いた時にすでに出ている 🔥 では 鳴らさない・管理者が 切れる（全部の端末）・音を出せない端末では 何も起きない） ===== */
      await tryB('96y',async()=>{
        const cl=new V2.MemoryCloud(), P=await mk3(cl,'端末Pu','ws',st), Q=await mk3(cl,'端末Qu','ws'), o={};
        const Fake=function(){ Fake.made++; this.state='running'; this.currentTime=0; this.destination={}; };
        Fake.made=0; Fake.starts=0; Fake.prototype.createOscillator=function(){ return {type:'',frequency:{value:0},connect(){},start(){ Fake.starts++; },stop(){}}; }; Fake.prototype.createGain=function(){ return {gain:{setValueAtTime(){},exponentialRampToValueAtTime(){}},connect(){}}; }; Fake.prototype.resume=function(){ this.state='running'; };
        const idOf=n=>'w_'+(at(8)+n).toString(36);
        const fireW=n=>({id:idOf(n),place:'off',name:'おくれの音の試験'+n,icon:'🔔',kind:'点検',zone:'blue',sub:'',sch:[0,0,0,0],days:null,times:['10:30'],lead:30,grace:30,items:[]});
        const okW={id:idOf(99),place:'off',name:'まだ先の作業',icon:'🕐',kind:'点検',zone:'blue',sub:'',sch:[0,0,0,0],days:null,times:['23:30'],lead:30,grace:30,items:[]};
        const beeps=()=>Fake.starts/2;
        try{
          goto(P,at(12)); P.win.AudioContext=Fake; P.win.webkitAudioContext=undefined;
          P.ev(`isAdmin=true; applyAdminMode(); state.amWorks=${J([okW])}; amSave(); _snd.prev=null; _snd.last=0; _snd.n=0;`);
          o.noCtx=E(P,`(amSndTick(),_snd.n)`);   // まだ 触られていない（音の もとが 無い）：何も 起きない
          P.win.document.dispatchEvent(new P.win.Event('pointerdown')); o.made=Fake.made;
          o.base=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps()+'/'+E(P,'_snd.prev===null?0:1');   // 最初の確認は 覚えるだけ
          P.ev(`state.amWorks=${J([okW,fireW(1)])}`); o.keys1=E(P,'amFireKeys(Date.now()).length'); o.b1=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps();   // 新しい 🔥 → 鳴る
          o.b1b=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps();   // 同じ 🔥 のまま → 鳴らない
          P.ev(`state.amWorks=${J([okW,fireW(1),fireW(2)])}`); o.b2=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps();   // 60秒 以内の 次の 🔥 → 鳴らない（間引く）
          P.ev(`_snd.last=0; state.amWorks=${J([okW,fireW(1),fireW(2),fireW(3)])}`); o.b3=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps();   // 60秒 たてば 鳴る
          /* 管理者が 切る：全部の端末に 効く（2台目で 入り切りの 状態が 同じ）。切ると 新しい 🔥 でも 鳴らない */
          P.ev(`amSave(); amSndToggle()`); o.off=E(P,'JSON.stringify([amSndOn(),state.amSnd])'); await sync3([P,Q]); o.offQ=E(Q,'amSndOn()'); const sv=await P.win.__v2.coll.readServer(); o.offRec=sv['s:amSnd'];
          P.ev(`_snd.last=0; state.amWorks=${J([okW,fireW(1),fireW(2),fireW(3),fireW(4)])}`); o.b4=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps();
          P.ev(`amSndToggle()`); o.on=E(P,'JSON.stringify([amSndOn(),state.amSnd===undefined])'); await sync3([P,Q]); o.onQ=E(Q,'amSndOn()');
          P.ev(`_snd.last=0; state.amWorks=${J([okW,fireW(1),fireW(2),fireW(3),fireW(4),fireW(5)])}`); o.b5=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps();
          /* 音を出せない端末：動いていない・無い → 何も 起きず・エラーも 出ない */
          P.ev(`_snd.ctx.state='suspended'; _snd.last=0; state.amWorks=${J([okW,fireW(1),fireW(2),fireW(3),fireW(4),fireW(5),fireW(6)])}`); o.s1=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps()+'/'+E(P,'amSndBeep()');
          P.ev(`_snd.ctx=null; _snd.last=0; state.amWorks=${J([okW,fireW(1),fireW(2),fireW(3),fireW(4),fireW(5),fireW(6),fireW(7)])}`); o.s2=E(P,`(amSndTick(),_snd.n)`)+'/'+beeps()+'/'+E(P,'amSndBeep()');
          o.btn=[E(P,`isAdmin=true; amOpenWorks(); document.getElementById('snd-toggle')?document.getElementById('snd-toggle').textContent.trim():'(なし)'`)];
        } finally { unwarp(P); P.ev(`isAdmin=false; amCloseSheet();`); }
        checkL('96y','【おくれの音】開いた時に すでに出ている 🔥 では 鳴らさない（最初の確認は 覚えるだけ）／新しい 🔥 が出たら 1回（短い2音）／同じ 🔥 のままなら 鳴らない／60秒 以内の 次の 🔥 は 鳴らさない・60秒たてば 鳴る／管理者が 切ると 全部の端末で 鳴らない（ネット上の 記録は s:amSnd＝{off:1}）・入れると 項目ごと 無くなる／まだ 触られていない・音を 出せない・動いていない 端末では 何も 起きず エラーも 出ない',[
            ['1:(String(o.noCtx)===\'0\')',(String(o.noCtx)==='0')],
            ['2:o.made===1',o.made===1],
            ['3:o.base===\'0/0/1\'',o.base==='0/0/1'],
            ['4:o.keys1===1',o.keys1===1],
            ['5:o.b1===\'1/1\'',o.b1==='1/1'],
            ['6:o.b1b===\'1/1\'',o.b1b==='1/1'],
            ['7:o.b2===\'1/1\'',o.b2==='1/1'],
            ['8:o.b3===\'2/2\'',o.b3==='2/2'],
            ['9:o.off===\'[false,{"off":1}]\'',o.off==='[false,{"off":1}]'],
            ['10:o.offQ===false',o.offQ===false],
            ['11:o.offRec===\'{"off":1}\'',o.offRec==='{"off":1}'],
            ['12:o.b4===\'2/2\'',o.b4==='2/2'],
            ['13:o.on===\'[true,true]\'',o.on==='[true,true]'],
            ['14:o.onQ===true',o.onQ===true],
            ['15:o.b5===\'3/3\'',o.b5==='3/3'],
            ['16:o.s1===\'3/3/false\'',o.s1==='3/3/false'],
            ['17:o.s2===\'3/3/false\'',o.s2==='3/3/false'],
            ['18:/入/.test(o.btn[0])',/入/.test(o.btn[0])]],
          `触られる前 ${o.noCtx}・音の もと ${o.made}個・最初 ${o.base}・新しい🔥 ${o.b1}・同じ 🔥 ${o.b1b}・60秒以内 ${o.b2}・60秒後 ${o.b3}｜切る：${o.off}・2台目 ${o.offQ}・ネット上 ${o.offRec}・切った後 ${o.b4}｜入れる：${o.on}・2台目 ${o.onQ}・入れた後 ${o.b5}｜音を出せない：止まっている ${o.s1}・無い ${o.s2}｜ボタン「${o.btn[0]}」`);
        P.close(); Q.close();
      });
      /* ===== 96z：きのうの抜け（きのうの 回で 記録が なかった物。0件の日は 何も出ない・人の名前は 出さない・「見た」で その日は 出さない・保存する物は 無い） ===== */
      await tryB('96z',async()=>{
        const cl=new V2.MemoryCloud(), P=await mk3(cl,'端末Pv','ws',st), o={};
        const yday=h=>{ const d=new Date(at(12)); d.setDate(d.getDate()-1); d.setHours(h,0,0,0); return d.getTime(); };
        const idOld='w_'+(at(12)-5*864e5).toString(36);
        const W=(id,name,tm)=>({id,place:'off',name,icon:'🧪',kind:'点検',zone:'blue',sub:'',sch:[0,0,0,0],days:null,times:[tm],lead:30,grace:60,items:[]});
        const reset=()=>P.ev(`_yd={t:0,n:-1,items:[]}`);
        try{
          goto(P,at(12)); P.win.sessionStorage.removeItem('ws_am_yd');
          P.ev(`isAdmin=false; applyAdminMode(); setView('map'); state.amWorks=${J([W(idOld,'きのうの抜けの試験','10:30'),W('w_ydother','別の作業','11:00')])}; amSave(); renderMapView();`); await sleep(120);
          reset(); o.none=[E(P,'amYdData().n'),qn(P,'#amf-yd')];   // 記録が 1つも 無い（記録を始める前）＝数えない
          P.ev(`amLogAdd('w_ydother',{at:new Date(${yday(11)}).toISOString(),by:'見本 花子'},null,null); amSave(); renderMapView()`); reset(); P.ev(`renderMapView()`); await sleep(80);
          o.n1=[E(P,'amYdData().n'),E(P,'amYdData().items[0].name'),qn(P,'#amf-yd'),qt(P,'#amf-yd'),E(P,'document.getElementById("amf-yd").getBoundingClientRect().height')];
          P.ev(`amYdOpen()`); await sleep(80); o.sheet=[E(P,'amSheetName()'),qt(P,'#am-sheet'),qn(P,'#am-sheet .yd-row')];
          o.noPerson=!/見本 花子|見本 太郎/.test(qt(P,'#am-sheet'));
          P.ev(`amYdSeenSet()`); await sleep(80); o.seen=[qn(P,'#amf-yd'),P.win.sessionStorage.getItem('ws_am_yd'),E(P,'amSheetName()')];
          P.win.sessionStorage.removeItem('ws_am_yd'); reset();
          P.ev(`amLogAdd(${J(idOld)},{at:new Date(${yday(10)+40*MIN}).toISOString(),by:'見本 太郎'},null,null); amSave(); renderMapView()`); reset(); P.ev(`renderMapView()`); await sleep(80); o.n0=[E(P,'amYdData().n'),qn(P,'#amf-yd')];
          o.noSave=E(P,`JSON.stringify(Object.keys(state).filter(k=>/yd|Yd/.test(k)))`);
          /* きのうの記録が 1件も 無い日（おとといには ある）：抜けは 数えない・1行も 出ない（店で まだ 使っていない間に 毎日 大きな数が 出て じゃまに ならないように・店長 10/19） */
          P.win.sessionStorage.removeItem('ws_am_yd');
          P.ev(`(()=>{ amLogKeys().forEach(k=>{ delete state[k]; }); amLogAdd('w_ydother',{at:new Date(${yday(11)-864e5}).toISOString(),by:'見本 花子'},null,null); amSave(); })()`); reset(); P.ev(`renderMapView()`); await sleep(80);
          o.noYd=[E(P,'amYdData().n'),qn(P,'#amf-yd'),E(P,'amLogKeys().length')];
        } finally { unwarp(P); try{ P.win.sessionStorage.removeItem('ws_am_yd'); }catch(_){} P.ev(`amCloseSheet();`); }
        checkL('96z','【きのうの抜け】記録を 始める前（記録が 1つも無い）は 数えない／きのうの 回で 記録が なかった作業が あれば、最初の画面の 細い1行（広い画面は 右の列の 上・スマホは 列の 上）「きのう 記録が なかった 作業 ◯件」（押せる・高さ 44px 以上）→ 押すと 作業の名前と 時刻の 一覧（人の名前は 出さない・英語・ネパール語つき）→「見た」で その日は 出さない／きのうの 記録が そろえば 0件で 何も 出ない／きのうの 記録が 1件も 無い日は（おとといに あっても）抜けを 数えず 1行も 出ない／保存する物は 無い',[
            ['1:J(o.none)===J([0,0])',J(o.none)===J([0,0])],
            ['2:o.n1[0]===1',o.n1[0]===1],
            ['3:/きのうの抜けの試験/.test(o.n1[1])',/きのうの抜けの試験/.test(o.n1[1])],
            ['4:o.n1[2]===1',o.n1[2]===1],
            ['5:/きのう 記録が なかった 作業 1件/.test(o.n1[3])',/きのう 記録が なかった 作業 1件/.test(o.n1[3])],
            ['6:Number(o.n1[4])>=44',Number(o.n1[4])>=44],
            ['7:o.sheet[0]===\'yd\'',o.sheet[0]==='yd'],
            ['8:/きのうの抜けの試験/.test(o.sheet[1])',/きのうの抜けの試験/.test(o.sheet[1])],
            ['9:/10:30/.test(o.sheet[1])',/10:30/.test(o.sheet[1])],
            ['10:/Not recorded yesterday/.test(o.sheet[1])',/Not recorded yesterday/.test(o.sheet[1])],
            ['11:/हिजो/.test(o.sheet[1])',/हिजो/.test(o.sheet[1])],
            ['12:o.sheet[2]===1',o.sheet[2]===1],
            ['13:o.noPerson',o.noPerson],
            ['14:o.seen[0]===0',o.seen[0]===0],
            ['15:/^\\d{4}-\\d\\d-\\d\\d$/.test(String(o.seen[1]))',/^\d{4}-\d\d-\d\d$/.test(String(o.seen[1]))],
            ['16:o.seen[2]===\'\'',o.seen[2]===''],
            ['17:J(o.n0)===J([0,0])',J(o.n0)===J([0,0])],
            ['18:o.noSave===\'[]\'',o.noSave==='[]'],
            ['19:きのうの記録が 無い日は 出ない',J(o.noYd)===J([0,0,1])]],
          `記録を始める前：${J(o.none)}｜1件：${J(o.n1)}｜一覧：窓 ${o.sheet[0]}・行 ${o.sheet[2]}・人の名前なし ${o.noPerson}｜見た：${J(o.seen)}｜きのうの記録が そろう：${J(o.n0)}｜保存した項目 ${o.noSave}`);
        P.close();
      });
    }
    check('97','最後に、2台の中身が同じ・未送信なし',same()&&A.store.status().pending===0&&B.store.status().pending===0,'未送信 A:'+A.store.status().pending+' B:'+B.store.status().pending);
    const srv=await c.readServer(); check('98','ネット上を直接読み直して組み立てた中身が、画面の中身と同じ',nz(J(V2.SPECS.ws.join(srv)))===nz(A.ev('JSON.stringify(state)')),Object.keys(srv).length+' 件の記録');
    check('99','記録の名前に、従業員の名前が入っていない',!Object.keys(srv).some(k=>/見本|試験/.test(k)),Object.keys(srv).filter(k=>k.indexOf('g:')===0).length+' 人ぶん');
  }catch(e){ check('—','試験の途中で止まった',false,String(e&&e.stack||e)); }
  const ng=R.filter(r=>!r.ok).length;
  $('sum').innerHTML=ng?`<span class="ng">× 不合格 ${ng} 個</span>（全 ${R.length} 個）`:`<span class="ok">○ 全部合格</span>（${R.length} 個）`;
  window.__results={total:R.length,ng,rows:R};
})();
