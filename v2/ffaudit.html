<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF管理：作成数の点検（巡回用）</title>
<style>
body{font-family:-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:16px;line-height:1.6}
h1{font-size:18px;margin:0 0 4px} .sub{font-size:13px;color:#64748b;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e8f0;font-size:13px;margin-top:10px}
th{background:#f8fafc;text-align:left;padding:6px 8px;white-space:nowrap} td{padding:6px 8px;border-top:1px solid #e2e8f0;vertical-align:top}
tr.ng td{background:#fef2f2} tr.gray td{background:#f1f5f9;color:#64748b} tr.ng td.pct{color:#b91c1c;font-weight:800} tr.warn td.pct{color:#b45309;font-weight:700} td.pct{font-weight:700}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer} button.pri{background:#2563eb;color:#fff;border:none;font-weight:700}
#sum{font-size:15px;font-weight:800;margin:10px 0} .tag{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;background:#eef2ff;color:#3730a3;margin:1px}
iframe{width:0;height:0;border:0;position:absolute;left:-9999px}
</style>
</head>
<body>
<h1>🔎 FF管理：作成数の点検（巡回用）</h1>
<div class="sub">商品ごとに「週の目標（定価販売の見込み＝カテゴリ需要×取り分＋ゆとり）」と「作成表の週合計」を比べ、差が ±20% を超える物・先週の実績に対して ±30% を超える物を上に赤で出します。金額は出しません（個数と係数だけ）。計算は新しい FF管理の画面の関数をそのまま呼びます（画面と同じ答え）。</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <button class="pri" id="go-dev">📲 この端末のデータで点検</button>
  <button id="go-file">ファイルで点検</button><input type="file" id="file" accept=".json" style="display:none">
  <span id="src" class="sub" style="margin:0"></span>
</div>
<div id="sum"></div>
<div id="out"></div>
<iframe id="f"></iframe>
<script>
(function(){
  const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms)), J=JSON.stringify, esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function fromObj(obj){
    let d=obj; for(const w of ['data','keys','localStorage']){ if(obj&&obj[w]&&typeof obj[w]==='object'&&Object.keys(obj[w]).some(k=>/^(ffv6_store_|global_stores$)/.test(k))){ d=obj[w]; break; } }
    let stores=[]; try{ stores=JSON.parse(d.global_stores||d.ffv6_stores||'[]'); }catch(_){}
    const states={},setup={}; stores.forEach(s=>{ if(typeof d['ffv6_store_'+s.id]==='string'){ states[s.id]=d['ffv6_store_'+s.id]; setup[s.id]=true; } });
    return {stores:stores.filter(s=>s.id in states),states,setup};
  }
  function devSrc(){ const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(/^(global_stores$|ffv6_stores$|ffv6_store_)/.test(k)&&!/_snap_|_emergency_|_pre_|_backup/.test(k))o[k]=localStorage.getItem(k); } }catch(_){} return o; }
  const load=url=>new Promise(res=>{ const f=$('f'); f.onload=()=>res(f.contentWindow); f.src=url; });
  // 画面の中で動かす読み取り（1店舗ぶん）
  const PROBE=`(function(){
    const rows=[]; const tgt=t=>+(t||0).toFixed(1);
    S.PM.forEach(p=>{
      const on=p.enabled&&S.catOn[p.category]; const cfg=S.catCfg[p.category]; if(!cfg)return;
      if(typeof isPackParent==='function'&&isPackParent(p))return;   // 本数の商品（親）は作成しない（子＝パックで見る）
      const b=on?getWeekTargetBase(p.id):null; const target=b?b.target:0;
      let week=0, invest=0, cells=0, frac={lt03:0,'03to1':0,ge1:0}, offs=[], cond=new Set(), wl=on?getWithdraw(p.id):0;
      const wtP=on?getProdWeekTotalWeighted(p):0;
      for(let d=0;d<7;d++) cfg.slots.forEach(h=>{
        if(!getSlotMake(p,h)){ if(d===0)offs.push(h); return; }
        if(!on)return; cells++;
        const det=getProdCntDetail(p.id,d,h); week+=det.total; invest+=getInvestExtra(p.id,d,h);
        const r=getProdSlotRange(p,h); const sc=r?getSlotCust(d,r[0],r[1]):0; const k=getSlotCoef(p.category,h), a=getLearnAdj(p.id,d,h), g=gaibuFactor(mainCatOf(p.category),d,h);
        const x=wtP>0?getCorrTarget(p.id,d)*sc*k*a/wtP*g:0; if(x<0.3)frac.lt03++; else if(x<1)frac['03to1']++; else frac.ge1++;
        if(k!==1)cond.add('時間帯係数'); if(a!==1)cond.add('学習'); if(g!==1)cond.add('天気イベント'); if(wl>0&&sc<wl)cond.add(typeof withdrawInfo==='function'?(withdrawInfo(p.id,d,h).below?'撤退（印）':'撤退（完売ありで印なし）'):'撤退');
        if(det.forced>0)cond.add(p.noStockout?'品切れ防止':'まとめ単位'); if(det.rice)cond.add('ごはん'+(det.rice>0?'+':'')+det.rice);
      });
      const rest=(typeof prodRestThisWeek==='function')&&on&&prodRestThisWeek(p); if(rest)cond.add('今週は休み');   // 今週のメニュー（2026-10-09）
      if(offs.length)cond.add('作らない時間帯あり'); if(/新商品$/.test(p.category))cond.add('新商品'); if(getBatchUnit(p)>1)cond.add('まとめ'+getBatchUnit(p)); if(p.noStockout)cond.add('品切れ防止ON');
      const ji=(S.ji[p.id]||{}); const last=(ji.teika||0)+(ji.nebiki||0);
      // 週の目標の元＝カテゴリ需要 × 取り分（2026-10-08 店長：MNL の集計版）。取り分・SKU・カテゴリ需要（客数×購入率）。親子の子は親の数。逃げ道（自分の平均）の商品は src=own
      let sku=null; if(on&&typeof getRecentAvgTeikaInfo==='function'){ const pp=(typeof packParentOf==='function'&&packParentOf(p))||p; const si=getRecentAvgTeikaInfo(pp.id,4), m=si.model; if(m)sku={src:si.src,share:si.share,now:m.L.length,nNew:m.Lnew.length,D:m.D,C:m.Cnow,r:m.r,mode:m.mode,isNew:m.Lnew.includes(pp.id),fix:m.weeks.filter(w=>w.kappa<0.9995).length,restW:m.weeks.filter(w=>w.rest&&w.rest.length).length}; }
      rows.push({name:p.name,cat:p.category,on,rest,target:tgt(target),teika4:tgt(b&&b.teika),last,week,invest,cells,frac,offs,cond:[...cond],sku});
    });
    // カテゴリ別の SKU の推移（実績の週 → 今週）
    const skuCats=(typeof skuTrend==='function')?CATS.filter(c=>!c.endsWith('新商品')&&S.PM.some(p=>p.enabled&&mainCatOf(p.category)===c)).map(c=>{ const t=skuTrend(c,4); return {cat:c,past:t.past.map(x=>x.sku),now:t.now}; }):[];
    // 週に作成0の商品（2026-10-08 店長の依頼）：画面と同じ関数で一覧を取る。赤＝計算上0・品切れ防止OFF・時間帯OFF／灰＝終売・投入前・親商品
    const zero=(typeof getZeroMakeList==='function')?getZeroMakeList().map(x=>({name:x.name,cat:x.cat,gray:x.gray,reasons:x.reasons.map(r=>r.t)})):[];

    // 今週のメニュー：週ごとの休みの数（S.weeks[週].menu の false の数。新しい6週）
    const menuWeeks=(typeof weekRestIds==='function')?sortWeekKeys(Object.keys(S.weeks||{})).slice(-6).map(k=>({k,n:weekRestIds(k).length,act:k===S.activeWeek})):[];
    return {store:S.storeName,week:S.activeWeek,rows,zero,skuCats,menuWeeks};
  })()`;
  async function run(data,label){
    $('go-dev').disabled=$('go-file').disabled=true; $('out').innerHTML=''; $('src').textContent=label; $('sum').textContent='点検中…'; const all=[];
    try{
      for(const s of data.stores){
        const w=await load('ff/index.html?embedded=1&mem=1&wait=1&a='+Date.now()); w.alert=()=>{}; w.confirm=()=>true;
        await w.__v2go({stores:data.stores,current:s.id,states:data.states,setup:data.setup});
        for(let i=0;i<100&&!w.__v2ready;i++)await sleep(100);
        const r=w.eval(PROBE); r.storeName=s.name; all.push(r);
      }
      let nBad=0,nWarn=0,nProd=0; let html=''; let nZero=0, nRest=0;
      all.forEach(r=>{
        const rows=r.rows.filter(x=>x.on).map(x=>{ const pct=x.target>0?Math.round(x.week/x.target*100):null; const lastPct=x.last>0?Math.round(x.week/x.last*100):null;
          const bad=!x.rest&&((pct!==null&&Math.abs(pct-100)>20)||(x.target>0&&x.week===0)||(x.target===0&&x.week>0&&x.last>0)); const warn=!x.rest&&!bad&&lastPct!==null&&Math.abs(lastPct-100)>30; if(bad)nBad++; else if(warn)nWarn++; nProd++;   // 今週のメニューで休む商品は 0 で正しい（灰。赤・黄に数えない）
          return Object.assign({pct,lastPct,bad,warn},x); }).sort((a,b)=>(b.bad-a.bad)||(b.warn-a.warn)||(Math.abs((b.pct||100)-100)-Math.abs((a.pct||100)-100)));
        nRest+=rows.filter(x=>x.rest).length;
        html+=`<h2 style="font-size:16px;margin:16px 0 4px">${esc(r.storeName)}　<span style="font-size:13px;color:#64748b">${esc(r.week)}週・${rows.length}商品（オフの商品は除く）</span></h2>`;
        // 今週のメニュー（2026-10-09）：週ごとの休みの数
        if((r.menuWeeks||[]).length)html+=`<div class="sub" style="margin:0">今週のメニューの休み（週ごと・新しい6週）：${r.menuWeeks.map(m=>`${esc(m.k.split('.').slice(1).join('/'))}週${m.act?'（今週）':''} <b>${m.n}品</b>`).join('　')}</div>`;
        if((r.skuCats||[]).length)html+=`<div class="sub" style="margin:0">SKU の推移（実績の週 → 今週）：${r.skuCats.map(c=>`${esc(c.cat)} ${c.past.map(v=>v||'—').join('›')} → <b>今週 ${c.now}</b>`).join('　')}</div>`;
        html+='<table><tr><th>商品</th><th>カテゴリ</th><th>週の目標</th><th title="取り分＝この商品の魅力度 ÷ 今週並ぶ商品の魅力度の合計（魅力度は直近4週の実績から多項ロジットで推定）。SKU＝今週並ぶ数（新商品は仮の取り分）。「自分の平均」＝カテゴリの直近4週に実績が無く、自分の定価販売の平均を使った商品">取り分</th><th title="カテゴリ需要＝今週のカテゴリの客数（売っている時間）× 購入率（直近4週。入力漏れの週は取り分で補正）。週の目標の元＝カテゴリ需要 × 取り分">カテゴリ需要</th><th>週合計</th><th>差</th><th>先週の販売</th><th>先週比</th><th>マスの小数 &lt;0.3／0.3〜1／≥1</th><th>作らない時間帯</th><th>効いている条件</th></tr>';
        html+=rows.map(x=>`<tr class="${x.rest?'gray':x.bad?'ng':x.warn?'warn':''}"><td>${esc(x.name)}</td><td>${esc(x.cat.replace('まちかど厨房','厨房'))}</td><td>${x.target}</td><td>${x.sku&&x.sku.src==='mnl'?`${(x.sku.share*100).toFixed(1)}%<br><span style="font-size:11px;color:#64748b">SKU ${x.sku.now}${x.sku.nNew?`（新${x.sku.nNew}）`:''}</span>`:(x.sku?(x.sku.isNew?'新商品（仮の取り分で分母だけ）':'自分の平均'):'—')}</td><td>${x.sku&&x.sku.D>0?`${Math.round(x.sku.D)}<br><span style="font-size:11px;color:#64748b">${x.sku.mode==='cust'?`客数 ${Math.round(x.sku.C)}×${(x.sku.r*100).toFixed(2)}%`:'客数なし'}${x.sku.fix?`・補正${x.sku.fix}週`:''}${x.sku.restW?`・休みの記録${x.sku.restW}週`:''}</span>`:'—'}</td><td>${x.week}${x.invest?` <span class="tag">投資+${x.invest}</span>`:''}</td><td class="pct">${x.pct===null?'—':x.pct+'%'}</td><td>${x.last}</td><td class="pct">${x.lastPct===null?'—':x.lastPct+'%'}</td><td>${x.frac.lt03}／${x.frac['03to1']}／${x.frac.ge1}</td><td>${x.offs.length?x.offs.map(h=>h+'時').join('・'):'なし'}</td><td>${x.cond.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</td></tr>`).join('');
        html+='</table>';
        // 作成0の商品（週合計 0。上の表の「週合計 0」と同じ物を、理由つきで1か所に）
        const zr=r.zero||[]; const zRed=zr.filter(x=>!x.gray).length; nZero+=zRed;
        html+=`<h3 style="font-size:14px;margin:12px 0 2px">作成0の商品　<span style="font-size:12px;color:#64748b;font-weight:400">${zr.length}件（<span style="color:#b91c1c">赤 ${zRed}</span>＝計算上0・品切れ防止OFF・作る時間帯が全部OFF／灰 ${zr.length-zRed}＝終売・投入前・親商品・今週は休み）</span></h3>`;
        html+=zr.length?'<table><tr><th>商品</th><th>カテゴリ</th><th>理由</th></tr>'+zr.map(x=>`<tr class="${x.gray?'gray':'ng'}"><td>${esc(x.name)}</td><td>${esc(x.cat.replace('まちかど厨房','厨房'))}</td><td>${x.reasons.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</td></tr>`).join('')+'</table>':'<div class="sub" style="margin:4px 0 0">なし</div>';

      });
      $('out').innerHTML=html;
      $('sum').innerHTML=`${all.length} 店舗・${nProd} 商品：<span style="color:#b91c1c">赤 ${nBad}</span>（目標との差 ±20% 超・目標ありで0・目標0で作成あり）／<span style="color:#b45309">黄 ${nWarn}</span>（先週の販売に対して ±30% 超）`;
      $('sum').innerHTML+=`／<span style="color:#b91c1c">作成0 赤 ${nZero}</span>（週に一つも作らない商品。終売・投入前・親商品は数えない）`;
      if(nRest)$('sum').innerHTML+=`／今週のメニューで休み ${nRest}品（灰。0 で正しい）`;
      window.__results={stores:all.length,products:nProd,bad:nBad,warn:nWarn,zero:nZero,rest:nRest,menuWeeks:all.map(r=>r.menuWeeks),rows:all.map(r=>({store:r.storeName,n:r.rows.filter(x=>x.on).length}))};
    }catch(e){ $('sum').textContent='途中で止まりました：'+(e&&e.message||e); }
    finally{ $('f').src='about:blank'; $('go-dev').disabled=$('go-file').disabled=false; }
  }
  $('go-dev').addEventListener('click',()=>{ const d=fromObj(devSrc()); if(!d.stores.length){ $('sum').textContent='この端末には、いまのアプリの FF管理のデータが見つかりません。'; return; } run(d,'この端末のデータ'); });
  $('go-file').addEventListener('click',()=>$('file').click());
  $('file').addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f)return; try{ run(fromObj(JSON.parse((await f.text()).replace(/^﻿/,''))),'ファイル：'+f.name); }catch(err){ $('sum').textContent='ファイルを読めませんでした：'+err.message; } e.target.value=''; });
  window.__runUrl=async url=>run(fromObj(await (await fetch(url,{cache:'no-store'})).json()),'ファイル');
})();
</script>
</body>
</html>
